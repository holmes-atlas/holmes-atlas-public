<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- ホーム画面に追加してスタンドアロン起動した場合、ブラウザのアドレスバーが
     出入りしないぶん、機種によっては100vh/100dvhがジェスチャーバー等の
     実際には描画に使えない領域まで含めて計算されてしまい、画面下端のUIが
     見切れることがある。window.innerHeightは常にその時点で実際に見えている
     高さを返すので、それをCSS変数として持たせて.appの高さの基準に使う
     （早期に1回実行＋resize/orientationchangで追従。JS実行前の初回描画は
     下の.app側フォールバック（100dvh）でカバーする）。 -->
<script>
(function(){
  function setAppVh(){ document.documentElement.style.setProperty('--app-vh', window.innerHeight + 'px'); }
  setAppVh();
  window.addEventListener('resize', setAppVh);
  window.addEventListener('orientationchange', setAppVh);
})();
</script>
<title>ホームズ・アトラス</title>
<meta name="description" content="シャーロック・ホームズ作品に登場する地名・人物・作品情報を、地図と索引でたどれるファンサイトです。">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- PWA（ホーム画面に追加）対応。manifest.jsonとicons/フォルダはHTMLと
     同じ階層に置く。サービスワーカーはあえて入れていない（オフライン
     キャッシュを持たせると、サイトを更新するたびに古い内容が
     キャッシュから表示され続けてしまう不具合の元になりやすいため）。
     その代わりAndroidの自動インストールバナーは出ず、iOS同様「共有→
     ホーム画面に追加」の手動操作が必要になる。 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ホームズ・アトラス">
<meta property="og:type" content="website">
<meta property="og:title" content="ホームズ・アトラス">
<meta property="og:description" content="シャーロック・ホームズ作品に登場する地名・人物・作品情報を、地図と索引でたどれるファンサイトです。">
<meta property="og:url" content="https://holmes-atlas.github.io/holmes-atlas-public/">
<meta property="og:image" content="https://holmes-atlas.github.io/holmes-atlas-public/icons/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="ホームズ・アトラス">
<meta name="twitter:description" content="シャーロック・ホームズ作品に登場する地名・人物・作品情報を、地図と索引でたどれるファンサイトです。">
<meta name="twitter:image" content="https://holmes-atlas.github.io/holmes-atlas-public/icons/og-image.jpg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- お気に入りリストの🧭ルート表示ボタンがGoogleマップに遷移する際、接続確立
     （DNS・TLS）だけでも先に済ませておくことで、実際に開くまでの体感時間を
     わずかでも縮める狙い。ページ自体の読み込み・複数経由地のルート計算時間は
     Googleマップ側の処理なのでここでは短縮できない。 -->
<link rel="preconnect" href="https://www.google.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Crimson+Pro:wght@400;500;600&display=swap">
<style>

:root{
  --ink:#1c2430; --ink-2:#232d3c;
  --parchment:#ece3cc; --parchment-2:#e0d4b3;
  --brass:#ab8347; --brass-light:#c9a562;
  --burgundy:#7a2634; --teal:#2f5d5a; --slate:#55606e; --pastiche:#7c5980; --moss:#5f7a52;
  --charcoal:#2b2620; --fog:#cdd5db; --line:rgba(171,131,71,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--ink);font-family:'Crimson Pro',serif;color:var(--fog);}
button,input,select,textarea{font-family:'Crimson Pro',serif;}

/* スマホのChromeなどでは、アドレスバーが表示されている間は100vhが実際に見えている
   高さより大きくなり、画面下部（古地図・正典ボタンなど）が見切れることがあった。
   100dvh（動的ビューポート高さ）はブラウザのツールバーの出し引きに追従してくれる
   ので、対応ブラウザではそちらを使い、非対応ブラウザ向けに100vhもフォールバックとして
   残しておく。
   ★ホーム画面に追加してスタンドアロン起動した場合は、そもそもアドレスバーの
   出入りがないにもかかわらず、機種によっては100dvhがジェスチャーバー等の
   実際の描画には使えない領域まで含んでしまい、同じく画面下部が見切れる別の
   不具合が起きることがある。headの早期スクリプトでwindow.innerHeightを
   --app-vhというCSS変数に反映させているので、それが使える環境ではそちらを
   優先する（JS実行前の一瞬だけ上のvh/dvhが使われる）。 */
.app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:minmax(56px,auto) 1fr;height:100vh;height:100dvh;height:var(--app-vh, 100dvh);}
.header{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--ink-2);border-bottom:1px solid var(--line);}
.seal{width:24px;height:24px;flex:none;}
.header h1{font-family:'Playfair Display',serif;font-weight:600;font-style:italic;font-size:1.05rem;color:var(--parchment);margin:0;}
.header .sub{font-size:.76rem;color:var(--brass-light);opacity:.85;}
.header-spacer{flex:1;}
.hbtn{background:none;border:1px solid var(--line);color:var(--fog);font-size:.82rem;padding:6px 12px;border-radius:3px;cursor:pointer;white-space:nowrap;}
.auth-area{display:inline-flex;align-items:center;gap:8px;margin-left:6px;}
.link-btn{background:none;border:none;color:var(--brass);text-decoration:underline;cursor:pointer;padding:0;font-size:inherit;}
.draft-banner{background:var(--parchment-2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin:0 0 12px;font-size:.8rem;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.draft-banner-actions{white-space:nowrap;}
.google-auth-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;border:1px solid var(--line);color:#3c3c3c;padding:9px;border-radius:4px;cursor:pointer;font-size:.88rem;margin-top:8px;}
.google-auth-btn:hover{background:#f5f5f5;}
.auth-divider{text-align:center;font-size:.75rem;color:var(--slate);margin:14px 0;position:relative;}
.auth-divider::before,.auth-divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--line);}
.auth-divider::before{left:0;} .auth-divider::after{right:0;}
.hbtn:hover{border-color:var(--brass);color:#fff;}
.hbtn.primary{background:var(--brass);border-color:var(--brass);color:#fff;}
.hbtn.primary:hover{background:var(--brass-light);}
.index-toggle{display:none;}
.action-btns{display:flex;gap:10px;flex-wrap:wrap;}
.menu-toggle{display:none;}

.index{display:flex;flex-direction:column;background:var(--ink-2);border-right:1px solid var(--line);min-height:0;}
.index-toolbar{flex:none;display:flex;align-items:center;gap:6px;padding:10px 10px;border-bottom:1px solid var(--line);}
.index-filter-wrap{position:relative;flex:1 1 auto;min-width:0;}
.index-filter-input{width:100%;box-sizing:border-box;background:var(--ink);border:1px solid var(--line);color:var(--fog);font-size:.82rem;padding:6px 26px 6px 10px;border-radius:4px;font-family:inherit;}
.index-filter-input::placeholder{color:var(--slate);}
.index-filter-input:focus{outline:none;border-color:var(--brass);}
.index-filter-clear-btn{position:absolute;top:50%;right:4px;transform:translateY(-50%);background:none;border:none;color:var(--slate);font-size:1.1rem;line-height:1;cursor:pointer;padding:2px 6px;}
.index-filter-clear-btn:hover{color:var(--burgundy);}
.index-close{display:none;flex:none;background:none;border:none;font-size:1.5rem;line-height:1;color:var(--slate);cursor:pointer;padding:2px 6px;}
.index-close:hover{color:var(--burgundy);}
/* 索引欄の「最近の更新」。サイトが実際に動いていることが初見の人にも伝わるよう、
   承認済みの提案（新規追加・編集・写真追加）を新着順に数件だけ表示する。
   承認履歴の一部（resolvedAt）をそのまま使い回しているので、この機能導入前に
   承認された提案は出てこない（自然に流れていくログなので実害はない）。 */
.recent-updates{flex:none;margin:10px 10px 0;padding:10px 12px;background:rgba(171,131,71,.07);border:1px solid var(--line);border-radius:4px;}
.recent-updates-label{font-size:.74rem;font-weight:600;color:var(--brass-light);margin-bottom:6px;letter-spacing:.02em;}
.recent-update-row{display:block;width:100%;text-align:left;background:none;border:none;color:var(--fog);font-size:.8rem;padding:3px 0;cursor:pointer;font-family:inherit;line-height:1.4;}
.recent-update-row:hover{color:var(--brass-light);}
.recent-update-row-static{cursor:default;}
.recent-update-row-static:hover{color:var(--fog);}
.recent-update-kind{display:inline-block;background:var(--teal);color:#fff;font-size:.64rem;padding:0 6px;border-radius:2px;margin-right:5px;vertical-align:1px;}
.recent-update-time{color:var(--slate);font-size:.74rem;}
.index-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 0 20px;}
.index-filter-empty{padding:16px;font-size:.82rem;color:var(--slate);font-style:italic;}
.index-group-header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:var(--ink-2);border:none;font-weight:600;font-size:.78rem;color:var(--brass-light);padding:9px 16px;margin:0;border-bottom:1px solid var(--line);border-top:1px solid var(--line);cursor:pointer;}
.index-group-header:hover{background:rgba(171,131,71,.1);}
.igh-arrow{font-size:.7rem;width:10px;}
.igh-count{margin-left:auto;font-size:.7rem;opacity:.6;font-weight:400;}
.index-group-items{padding-bottom:4px;}
.index-item{display:block;width:100%;text-align:left;background:none;border:none;color:var(--fog);font-size:.9rem;padding:7px 16px;cursor:pointer;}
.index-link-item{text-decoration:none;box-sizing:border-box;}
.index-link-desc{display:block;font-size:.72rem;opacity:.6;margin-top:2px;}
.alias-list-item{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 16px;font-size:.82rem;color:var(--fog);}
.alias-list-empty{padding:8px 16px;font-size:.78rem;opacity:.55;font-style:italic;}
.site-license{padding:16px;font-size:.68rem;color:var(--fog);opacity:.6;line-height:1.7;border-top:1px solid var(--line);margin-top:10px;}
.site-license a{color:var(--brass-light);}
.fav-subheader{font-size:.7rem;color:var(--brass-light);font-weight:600;}
.fav-subheader-row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 16px 4px;}
.alias-add-standalone-btn{display:block;width:calc(100% - 24px);margin:4px 12px 8px;font-size:.78rem;background:var(--teal);border:none;color:#fff;padding:6px 0;border-radius:3px;cursor:pointer;}
.alias-delete-btn{background:none;border:1px solid var(--line);color:var(--fog);width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:.78rem;flex:none;line-height:1;padding:0;}
.alias-delete-btn:hover{border-color:var(--burgundy);color:var(--burgundy);}
.index-item:hover{background:rgba(171,131,71,.12);}
.index-item.active{background:rgba(171,131,71,.22);color:#fff;}

.stage{position:relative;overflow:hidden;height:100%;}
#map{position:absolute;inset:0;width:100%;height:100%;background:#dfe6ea;filter:sepia(.18) saturate(.85) brightness(.97) contrast(1.02);}
.map-status{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:16px;max-width:calc(100vw - 32px);z-index:500;background:var(--ink-2);color:var(--fog);border:1px solid var(--line);padding:6px 12px;border-radius:3px;font-size:.8rem;display:none;pointer-events:none;}
.map-status.show{display:block;}
.map-search{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:600;width:min(380px,82%);}
.stage:has(.panel.open, .timeline.open) .map-search,
.stage:has(.panel.open, .timeline.open) .map-controls-cluster,
.stage:has(.panel.open, .timeline.open) .map-status,
.stage:has(.panel.open, .timeline.open) .map-locate-btn,
.stage:has(.panel.open, .timeline.open) .map-door-btn,
.stage:has(.panel.open, .timeline.open) .nearby-panel,
.stage:has(.panel.open, .timeline.open) .route-cart-bar{display:none;}
.map-search-row{display:flex;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.25);border-radius:3px;}
.map-search-row input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:3px 0 0 3px;font-size:.9rem;background:#fff;color:var(--charcoal);}
.map-search-row button{background:var(--brass);border:none;color:#fff;padding:0 16px;border-radius:0;cursor:pointer;font-size:.85rem;}
.map-search-row button:last-child{border-radius:0 3px 3px 0;}
.map-search-clear-btn{background:#fff!important;color:var(--slate)!important;border-left:1px solid var(--line)!important;width:32px;padding:0!important;font-size:1.1rem!important;}
.map-search-clear-btn:hover{color:var(--burgundy)!important;}
.map-search-results{margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;display:none;max-height:300px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.2);}
.map-search-results.show{display:block;}
.map-search-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;border:none;border-bottom:1px solid var(--line);padding:9px 12px;font-size:.86rem;color:var(--charcoal);cursor:pointer;}
.map-search-item:hover{background:#f7ecd0;}
.map-search-item .msi-sub{font-size:.72rem;opacity:.6;margin-left:auto;padding-left:8px;}
.map-search-section{padding:6px 12px;font-size:.7rem;color:var(--slate);background:var(--parchment-2);}
.alias-register-row{display:flex;gap:6px;padding:8px 12px;background:#fff;}
.alias-register-row input{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:3px;font-size:.8rem;}
.alias-register-row button{background:var(--brass);border:none;color:#fff;padding:0 12px;border-radius:3px;cursor:pointer;font-size:.8rem;white-space:nowrap;}
.search-popup-btn{background:var(--brass);border:none;color:#fff;padding:5px 10px;border-radius:3px;cursor:pointer;font-size:.8rem;margin-top:4px;}
/* 古地図・正典フィルタ・作品絞り込みを、1本の「真鍮パネル」ツールバーに
   まとめている。以前はそれぞれ独立した丸皿ボタンで、文言の長さが変わると
   隣とぶつかったり見た目がバラバラだったりしたため、仕切り線（.mt-div）で
   区切った1本の帯にし、状態のオン/オフは背景の塗りつぶしではなく文字色（金色）で
   示す形に統一した。
   ★以前は現在地ボタン・221Bへボタンもこの帯の中に入れていたが、スマホ幅だと
   全部のラベル文字を出したままでは帯が画面幅に収まりきらず、右端のボタンが
   画面外に押し出されて見えなくなっていた。「正典のみ」「古地図」の文字ラベルは
   残したいという要望から、現在地ボタン・221Bへボタンは帯から出して、帯の真上に
   積み重ねた独立ボタン（.map-locate-btn / .map-door-btn）にし、帯の幅そのものを
   縮めることで対応している。
   それでも収まりきらない極端に狭い画面向けの保険として、帯の中身だけ横スクロールもできる。 */
.map-controls-cluster{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));right:16px;z-index:500;display:flex;align-items:stretch;
  max-width:calc(100vw - 24px);height:44px;background:linear-gradient(180deg,#2a3547,var(--ink-2));
  border:1px solid var(--brass);border-radius:22px;box-shadow:0 4px 14px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);
  padding:0 4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;}
.map-controls-cluster::-webkit-scrollbar{display:none;}
.mt-div{width:1px;flex:none;align-self:center;height:22px;background:var(--line);}
.mt-seg{display:flex;align-items:center;gap:6px;flex:none;background:none;border:none;color:var(--fog);opacity:.82;
  cursor:pointer;font-family:'Crimson Pro',serif;font-size:.78rem;white-space:nowrap;padding:0 12px;height:100%;
  -webkit-tap-highlight-color:transparent;}
.mt-seg:hover{opacity:1;}
.mt-seg.active{color:var(--brass-light);opacity:1;font-weight:600;}
.mt-ic{width:17px;height:17px;flex:none;}
/* 作品で絞り込みは、以前はネイティブの<select>で作っていたが、スマホの
   ブラウザによっては選択直後にブラウザ標準の明るい配色（白い枠）で
   描き直してしまうことがあり、CSSの指定だけでは機種差を潰しきれなかった。
   自前のボタン＋一覧（.mt-select-btn / .mt-select-menu）に置き換えることで、
   ネイティブの部品を一切使わず、どの機種でも常にこちらの指定通りの
   見た目になるようにしている。ボタンはただのボタンなので、幅もボタン自身の
   文字幅にそのまま追従し、以前のようなJSでの幅の測り直しも不要になった。
   ★文字が欠けるのは避けたいという要望から、長い作品名でも省略せず全部
   表示する。その分、帯の横幅が画面より広くなることがあるが、帯の中身は
   横スクロールできるので隠れて見えなくなることはない。 */
.mt-select-wrap{position:relative;padding:0;}
.mt-select-btn{display:flex;align-items:center;gap:6px;flex:none;background:none;border:none;color:inherit;
  opacity:.82;font:inherit;cursor:pointer;white-space:nowrap;padding:0 12px;height:100%;
  -webkit-tap-highlight-color:transparent;}
.mt-select-btn:hover{opacity:1;}
.mt-select-btn.active{color:var(--brass-light);opacity:1;font-weight:600;}
.mt-select-btn:focus{outline:none;}
.mt-select-btn:focus-visible{outline:2px solid var(--fog);outline-offset:-2px;}
.mt-select-wrap.open .mt-chevron{transform:rotate(180deg);}
.mt-chevron{transition:transform .15s ease;opacity:.75;flex:none;}
/* 一覧本体は帯（.map-controls-cluster、横スクロールのためoverflow-x:autoに
   している）の外に置いたsiblingで、開いたときにJSでボタンの真上へ位置を
   合わせる。帯の中に置くと横スクロール用のoverflow設定に巻き込まれて、
   上にはみ出す部分が見えなくなってしまうため。 */
/* position:fixed（ビューポート基準）にしている。以前はposition:absoluteで
   .stage（帯の入れ物）を基準にしていたが、実機で表示絞り込みメニューが
   帯のすぐ上ではなく画面の上の方（検索バーの近く）に開いてしまう不具合が
   報告された。原因を.stage側のレイアウト計算まで遡って特定するより、
   そもそも.stageのrectに依存しない作りに変える方が確実だと判断し、
   ボタン自身のgetBoundingClientRect()とビューポートのサイズだけで
   位置を決めるようにした（JS側のopenViewFilterMenu/openFavFilterMenuも
   同様に変更済み）。 */
.mt-select-menu{position:fixed;z-index:600;min-width:180px;max-width:min(320px,80vw);
  max-height:280px;overflow-y:auto;background:var(--parchment);border:1px solid var(--line);
  border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.35);display:none;}
.mt-select-menu.show{display:block;}
/* ヘッダー付きメニュー（表示絞り込みのみ）は、選んでも閉じない代わりに上部へ
   固定の閉じるボタンを常時出しておく必要があるため、外枠を縦のflexコンテナに
   分割し、スクロールは中の.mt-select-menu-bodyだけに閉じ込める。ヘッダーを
   持たない通常のメニュー（お気に入り絞り込みなど）は今まで通り.mt-select-menu
   自体がそのままスクロール領域になる。 */
/* ★バグの元凶だった箇所：ここでdisplay:flexを無条件に指定してしまうと、
   .mt-select-menu-with-header自体が常時付いている構造クラス（開閉トグルの
   .showではない）なので、基本形の.mt-select-menu{display:none}より詳細度が
   高いこのルールが常に勝ってしまい、.showの有無にかかわらずメニューが常に
   表示された状態になっていた（＝サイトを開いた瞬間からメニューが開いた
   ままに見え、✕ボタンで.showを外しても見た目が変わらなかった原因）。
   displayの指定はここでは行わず、.showが付いた時だけ下のルールで
   display:flexにする。 */
.mt-select-menu.mt-select-menu-with-header{flex-direction:column;max-height:320px;overflow:hidden;padding:0;}
.mt-select-menu.mt-select-menu-with-header.show{display:flex;}
.mt-select-menu-header{display:flex;align-items:center;justify-content:space-between;flex:none;
  padding:6px 4px 6px 12px;border-bottom:1px solid var(--line);background:var(--parchment-2);}
.mt-select-menu-title{font-size:.75rem;color:var(--slate);font-weight:600;letter-spacing:.02em;}
.mt-select-menu-close{background:none;border:none;color:var(--slate);font-size:.95rem;line-height:1;
  cursor:pointer;padding:6px 9px;border-radius:3px;-webkit-tap-highlight-color:transparent;}
.mt-select-menu-close:hover{background:#e3d6ac;color:var(--charcoal);}
.mt-select-menu-body{overflow-y:auto;flex:1;min-height:0;}
.mt-select-menu-section{padding:6px 12px;font-size:.7rem;color:var(--slate);background:var(--parchment-2);}
/* 正典作品一覧の折りたたみ見出し。中身が長いリスト（.mt-select-menu-collapse-body）
   の開閉トグルを兼ねるため、通常の.mt-select-menu-sectionと違いボタン化して
   いる。ボタンの既定スタイル（枠線・フォント等）をリセットして元の見出しの
   見た目に揃える。 */
.mt-select-menu-section.mt-select-menu-collapsible{display:flex;align-items:center;gap:6px;width:100%;
  border:none;text-align:left;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.mt-select-menu-section.mt-select-menu-collapsible:hover{background:#efe6c8;}
.mt-select-collapse-arrow{display:inline-block;width:8px;flex:none;font-size:.65rem;color:var(--brass);}
.mt-select-menu-collapse-body{display:none;}
.mt-select-menu-collapse-body.expanded{display:block;}
/* 表示絞り込みメニュー専用のチェックボックス表示。選んでも閉じない運用にした
   ため、✓マークだけのシンプルな表現より「今チェックが入っているかどうか」が
   一目でわかるよう、枠付きの四角で示す。地点フィルター側（全ての地点／全ての
   正典登場地／作品ごと）は内部的には従来通り単一選択のままだが、見た目は
   ほかの項目と統一してチェックボックス方式にしている。 */
.mt-select-checkbox{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
  flex:none;margin-right:9px;border:1.5px solid var(--fog);border-radius:3px;color:#fff;
  font-size:.68rem;font-weight:700;line-height:1;background:transparent;}
.mt-select-menu-item.active .mt-select-checkbox{border-color:var(--brass);background:var(--brass);}
.mt-select-menu-item{display:flex;align-items:center;gap:0;width:100%;text-align:left;background:#fff;border:none;
  border-bottom:1px solid var(--line);padding:9px 12px;font-size:.85rem;color:var(--charcoal);
  cursor:pointer;font-family:'Crimson Pro',serif;}
.mt-select-menu-item:hover{background:#f7ecd0;}
/* 選択中かどうかは背景色の違いではなく✓マーク（.mt-select-check）だけで示す。
   背景色だけで区別すると、初期状態（例：「全ての地点」）が誤って「選択中の色」に
   見えてしまい紛らわしかったため。太字だけは選択中の強調として残す。 */
.mt-select-menu-item.active{font-weight:600;}
.mt-select-check{display:inline-block;width:16px;flex:none;color:var(--brass);font-weight:700;}
.mt-select-menu-count{opacity:.6;font-size:.78rem;margin-left:3px;}
/* お気に入りリスト各行：左が絞り込み用の既存ボタン（クリックで選択）、右が
   Googleマップでルートを開くための小さな別ボタン。2つのクリック対象が
   隣接するので、ルート側は必ずevent.stopPropagation()で親に伝播させない。 */
.mt-select-menu-row{display:flex;align-items:stretch;border-bottom:1px solid var(--line);}
.mt-select-menu-row .mt-select-menu-item{border-bottom:none;flex:1;min-width:0;}
.mt-select-route-btn{background:#fff;border:none;border-left:1px solid var(--line);color:var(--fog);
  width:34px;flex:none;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;}
.mt-select-route-btn:hover{background:#f7ecd0;color:var(--brass-light);}
@media (max-width:480px){
  .mt-seg{padding:0 9px;gap:5px;}
  .mt-select-btn{padding:0 9px;}
}
/* 一部の古い/小さめの機種（画面幅360px以下）ではここまでの調整でもまだ帯が
   収まりきらないことがあったため、さらに一段階詰める。それでも収まりきらない
   最小限のケース向けに、帯の中身だけ横スクロールできる保険は残してある。 */
@media (max-width:360px){
  .mt-seg{padding:0 4px;gap:3px;font-size:.72rem;}
  .mt-seg .mt-ic{width:15px;height:15px;}
  .mt-select-btn{padding:0 4px;font-size:.72rem;}
}
/* 現在地ボタン：帯（.map-controls-cluster）とは別の、帯のすぐ上に浮かぶ丸ボタン。
   帯と同じ真鍮パネル調の配色にして「同じ計器盤の仲間」だと分かるようにしつつ、
   帯の横幅には影響しないようにしている。追跡中は金色に光らせて状態を示す。 */
.map-locate-btn{position:absolute;bottom:calc(68px + env(safe-area-inset-bottom));right:16px;z-index:500;width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:linear-gradient(180deg,#2a3547,var(--ink-2));border:1px solid var(--brass);
  box-shadow:0 4px 14px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);
  color:var(--fog);cursor:pointer;-webkit-tap-highlight-color:transparent;}
.map-locate-btn .mt-ic{width:20px;height:20px;}
.map-locate-btn:hover{color:#fff;}
.map-locate-btn.active{color:var(--brass-light);border-color:var(--brass-light);}
.map-locate-btn:focus{outline:none;}
.map-locate-btn:focus-visible{outline:2px solid var(--fog);outline-offset:2px;}
/* 現在地マーカー：中心の点＋向きが分かったときだけ表示する三角のコーン。
   地図の地色（セピー掛かったベージュ〜緑系）に埋もれて見えにくかったため、
   コーンは彩度の高い金茶色（--brass）に変更し、白い縁取り（halo）を背後に
   重ねることでどんな地図の色の上でも輪郭がはっきり見えるようにしている。
   サイズ・不透明度も大きめに調整済み。 */
.user-location-marker{width:34px;height:34px;}
.user-location-marker .ulm-rotate{position:relative;width:100%;height:100%;transition:transform .2s linear;filter:drop-shadow(0 1px 3px rgba(0,0,0,.55));}
.user-location-marker .ulm-dot{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#2f5d5a;border:2px solid #fff;box-shadow:0 0 0 4px rgba(47,93,90,.28);z-index:2;}
/* 単純な二等辺三角形だと、特に小さいサイズでは左右対称すぎて「どちら向きか」が
   一目で分かりにくかった。後ろ側を凹ませた「矢じり（ノッチ付き矢印）」の形にする
   ことで、地図アプリの現在地表示（Googleマップなど）と同じ、先端がはっきり分かる
   見た目にしている。 */
.user-location-marker .ulm-cone-halo{position:absolute;left:50%;top:-8px;width:30px;height:36px;margin-left:-15px;background:rgba(255,255,255,.95);clip-path:polygon(50% 0%, 100% 100%, 50% 76%, 0% 100%);display:none;z-index:0;}
.user-location-marker .ulm-cone{position:absolute;left:50%;top:-5px;width:24px;height:30px;margin-left:-12px;background:var(--brass);clip-path:polygon(50% 0%, 100% 100%, 50% 76%, 0% 100%);display:none;opacity:.97;z-index:1;}
.user-location-marker.has-heading .ulm-cone-halo,
.user-location-marker.has-heading .ulm-cone{display:block;}
/* タップ後に残るブラウザ標準のフォーカスリングが、金色の「オン」表示と紛らわしかった
   ため、マウス・タッチでのクリック後は輪を出さず、キーボード操作（Tabキー）のときだけ
   細い輪を出すようにする */
.mt-seg:focus,
.mt-select-btn:focus{outline:none;}
.mt-seg:focus-visible,
.mt-select-btn:focus-visible{outline:2px solid var(--fog);outline-offset:-2px;}
/* 221Bへの直行ボタン。帯からは独立させ、現在地ボタンのさらに上に積み重ねた
   ピルにしている。地図上の特別マーカー（.leaflet-holmes-special-icon）と
   同じバーガンディ×金の配色にして、特別な項目への近道だと分かるようにしている。 */
.map-door-btn{position:absolute;bottom:calc(120px + env(safe-area-inset-bottom));right:16px;z-index:500;display:flex;align-items:center;
  gap:6px;height:40px;padding:0 14px;background:var(--burgundy);border:1.5px solid var(--brass-light);
  border-radius:20px;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.4);
  cursor:pointer;font-family:'Crimson Pro',serif;font-size:.82rem;font-weight:700;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;}
.map-door-btn:hover{filter:brightness(1.12);}
.map-door-btn:focus{outline:none;}
.map-door-btn:focus-visible{outline:2px solid var(--fog);outline-offset:2px;}
.nearby-panel{position:absolute;bottom:calc(172px + env(safe-area-inset-bottom));right:16px;z-index:500;width:min(300px,80%);background:var(--parchment);border:1px solid var(--line);border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.3);max-height:320px;overflow-y:auto;display:none;}
.nearby-panel.show{display:block;}
.nearby-panel-head{padding:10px 14px;font-size:.82rem;font-weight:600;color:var(--ink);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.nearby-panel-close{background:none;border:none;cursor:pointer;font-size:1rem;color:var(--charcoal);opacity:.6;}
.nearby-item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:#fff;border:none;border-bottom:1px solid var(--line);padding:9px 14px;font-size:.85rem;color:var(--charcoal);cursor:pointer;}
.nearby-item:hover{background:#f7ecd0;}
.nearby-item .ni-dist{font-size:.72rem;opacity:.6;white-space:nowrap;margin-left:8px;}
/* 地図タイル自体が明るいベージュ系の色合いのため、以前の金茶色(--brass)だと
   背景に紛れて見つけにくかった。UIの他の部分（ヘッダーやボタン）と同じ濃紺
   (--ink-2)にして、コントラストをはっきりさせる */
.leaflet-holmes-icon{background:var(--ink-2);border:2px solid var(--parchment);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.5);}
.holmes-cluster-icon{background:transparent;}
.cluster-icon-inner{width:34px;height:34px;border-radius:50%;background:var(--ink-2);border:2px solid var(--parchment);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Crimson Pro',serif;font-weight:700;font-size:.92rem;box-shadow:0 1px 4px rgba(0,0,0,.5);}
/* 検索・索引で選んだ項目が、ズームアウトして他のピンと合体したクラスタの中に
   隠れているとき、そのクラスタだけ分かるように輪をパルスさせる */
.holmes-cluster-icon.has-selected .cluster-icon-inner{
  box-shadow:0 0 0 3px var(--brass-light), 0 1px 4px rgba(0,0,0,.5);
  animation: cluster-selected-pulse 1.6s ease-in-out infinite;
}
@keyframes cluster-selected-pulse{
  0%,100%{ box-shadow:0 0 0 3px var(--brass-light), 0 1px 4px rgba(0,0,0,.5); }
  50%{ box-shadow:0 0 0 7px rgba(201,165,98,.4), 0 1px 4px rgba(0,0,0,.5); }
}
.leaflet-holmes-icon svg{width:14px;height:14px;}
.leaflet-holmes-icon-peripheral{background:var(--slate);opacity:.8;border:1.5px solid var(--parchment);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.4);}
.leaflet-holmes-icon-peripheral svg{width:9px;height:9px;}
.leaflet-holmes-icon-misc{background:var(--moss);opacity:.8;border:1.5px solid var(--parchment);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.4);}
.leaflet-holmes-icon-misc svg{width:9px;height:9px;}
.leaflet-holmes-special-icon{background:var(--burgundy);border:3px solid var(--brass-light);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(171,131,71,.35),0 2px 8px rgba(0,0,0,.6);}
.leaflet-holmes-special-icon svg{width:19px;height:19px;}
.place-label-special{background:var(--burgundy)!important;color:#fff!important;border:2px solid var(--brass-light)!important;font-family:'Crimson Pro',serif;font-weight:700!important;font-size:.82rem!important;padding:4px 10px!important;border-radius:2px;box-shadow:0 2px 8px rgba(0,0,0,.5)!important;pointer-events:none!important;}
.place-label-special::before{border-top-color:var(--burgundy)!important;}
.leaflet-journal-icon{background:var(--teal);border:2px solid var(--parchment);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.5);}
.leaflet-journal-icon svg{width:13px;height:13px;}
/* 訪問記録のクラスタは地点クラスタ（濃紺）と見分けられるよう、訪問記録ピン
   自体と同じteal系の色にする。has-selectedのパルス演出は地点側のみで使う
   ものなのでここでは使わない（journalMarkerClusterGroup専用のクラス）。 */
.holmes-journal-cluster-icon .cluster-icon-inner{background:var(--teal);width:30px;height:30px;font-size:.82rem;}
.place-label{background:rgba(28,36,48,.88)!important;color:var(--parchment)!important;border:1px solid var(--brass)!important;font-family:'Crimson Pro',serif;font-size:.72rem!important;padding:2px 7px!important;border-radius:2px;box-shadow:none!important;pointer-events:none!important;}
.place-label::before{border-top-color:rgba(28,36,48,.88)!important;}
.place-label-peripheral{border-color:var(--slate)!important;}
.place-label-misc{border-color:var(--moss)!important;}
.hide-place-labels .place-label{display:none;}
.hide-place-labels .place-label.force-show{display:block!important;}
.leaflet-tooltip.force-show{z-index:650!important;}
.leaflet-tooltip.spiderfied-hide{display:none!important;}
.map-area-label{background:none!important;border:none!important;box-shadow:none!important;padding:0!important;color:#3a2e1e!important;font-family:'Playfair Display',serif;font-weight:600;font-size:.82rem;letter-spacing:.03em;text-shadow:-1px -1px 0 #ece3cc,1px -1px 0 #ece3cc,-1px 1px 0 #ece3cc,1px 1px 0 #ece3cc,0 0 6px #ece3cc;pointer-events:none!important;}
.map-area-label::before{display:none!important;}

.panel{position:absolute;top:0;right:0;bottom:0;width:min(640px,92%);background:var(--parchment);color:var(--charcoal);transform:translateX(100%);transition:transform .28s ease;overflow-y:auto;border-left:3px solid var(--brass);box-shadow:-6px 0 18px rgba(0,0,0,.35);}
.panel.open{transform:translateX(0);}
.trail{display:flex;flex-wrap:wrap;gap:4px;padding:14px 20px 0;font-size:.78rem;}
.trail button{background:none;border:none;color:var(--slate);cursor:pointer;padding:2px 0;font-size:.78rem;text-decoration:underline;text-decoration-color:var(--line);}
.trail span.sep{color:var(--brass);padding:0 2px;}
/* 見た目の×自体は小さいままだったが、実際にタップできる範囲もその文字の
   大きさぶんしか無かったため、スマホだと指で狙いにくく「反応が悪い」ように
   感じられていた。タップ領域を40x40pxに広げ、×はその中央に表示する。 */
.panel-close{position:absolute;top:2px;right:2px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:none;font-size:1.4rem;color:var(--charcoal);cursor:pointer;opacity:.55;}
.panel-close:hover{opacity:1;}
.panel-body{padding:6px 24px 30px;}
.type-badge{display:inline-block;font-size:.7rem;padding:2px 9px;border-radius:2px;color:#fff;margin-bottom:10px;}
.fav-toggle-btn{float:right;background:none;border:1px solid var(--line);color:var(--slate);font-size:.8rem;padding:3px 10px;border-radius:12px;cursor:pointer;margin-bottom:10px;}
.fav-toggle-btn.active{background:var(--brass);border-color:var(--brass);color:#fff;}
.fav-toggle-btn:hover{border-color:var(--brass);}
/* ルートかごの詳細パネル内トグル。お気に入り（brass=金色）と見分けがつくよう
   ルート関連は一貫してteal（既存の.route-pick-dest.activeと同じ色）に揃えている。 */
.route-cart-toggle-btn{float:right;background:none;border:1px solid var(--line);color:var(--slate);font-size:.8rem;padding:3px 10px;border-radius:12px;cursor:pointer;margin-bottom:10px;margin-right:8px;}
.route-cart-toggle-btn.active{background:var(--teal);border-color:var(--teal);color:#fff;}
.route-cart-toggle-btn:hover{border-color:var(--teal);}
.fav-list-count{color:var(--slate);font-size:.78rem;}
.fav-list-row{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.fav-list-row label{flex:1;min-width:0;}
.fav-list-rename-btn,.fav-list-route-btn{background:none;border:1px solid var(--line);color:var(--fog);width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:.72rem;flex:none;line-height:1;padding:0;}
.fav-list-rename-btn:hover,.fav-list-route-btn:hover{border-color:var(--brass-light);color:var(--brass-light);}
.fav-subheader-actions{display:flex;align-items:center;gap:4px;flex:none;}
.fav-list-rename-input{width:100%;font-size:.85rem;padding:2px 4px;border:1px solid var(--brass-light);border-radius:3px;box-sizing:border-box;}
.badge-place{background:var(--brass);} .badge-person{background:var(--burgundy);}
.badge-work{background:var(--teal);} .badge-term{background:var(--slate);}
.badge-pastiche{background:var(--pastiche);}
.badge-peripheral{background:none;border:1px solid var(--slate);color:var(--slate)!important;}
.badge-misc{background:none;border:1px solid var(--moss);color:var(--moss)!important;}
.tag-row{margin:0 0 10px;}
.tag-chip{display:inline-block;font-size:.68rem;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--slate);background:rgba(171,131,71,0.08);margin:0 5px 5px 0;}
.share-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;}
.share-btn{display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid var(--line);color:var(--slate);font-size:.78rem;padding:4px 11px;border-radius:12px;cursor:pointer;text-decoration:none;font-family:inherit;}
.share-btn:hover{border-color:var(--brass);color:var(--ink);}
.share-btn svg{width:14px;height:14px;flex:none;}
.panel-body h3{font-family:'Playfair Display',serif;font-weight:600;font-size:1.4rem;margin:2px 0 12px;color:var(--ink);}
.panel-body img.entity-img{width:100%;border-radius:3px;margin-bottom:14px;border:1px solid var(--line);}
.photo-row{display:flex;gap:10px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;}
.photo-row .photo-block{flex:0 0 150px;position:relative;}
.photo-block{flex:1;min-width:140px;}
.photo-del-btn{position:absolute;top:4px;right:4px;z-index:5;width:20px;height:20px;border-radius:50%;background:rgba(28,36,48,.75);color:#fff;border:none;cursor:pointer;font-size:.85rem;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
.photo-del-btn:hover{background:var(--burgundy);}
.add-photo-btn{flex:0 0 80px;height:150px;border:1px dashed var(--line);border-radius:3px;background:none;color:var(--slate);cursor:pointer;font-size:.72rem;line-height:1.4;}
.add-photo-btn:hover{border-color:var(--brass);color:var(--brass);}
.photo-block img{width:100%;height:150px;object-fit:cover;border-radius:3px;border:1px solid var(--line);display:block;}
.photo-block .photo-label{font-size:.72rem;font-weight:600;color:var(--slate);margin-bottom:3px;}
.photo-credit{font-size:.68rem;color:var(--slate);line-height:1.4;margin-top:3px;}
.photo-credit a{color:var(--slate);}
.panel-body p{font-size:.96rem;line-height:1.75;margin:0 0 18px;}
.desc-toggle-btn{background:none;border:none;color:var(--brass);font-size:.8rem;cursor:pointer;padding:0;text-decoration:underline;text-decoration-color:var(--line);margin:-14px 0 18px;display:block;}
.entity-desc.collapsed{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;}
.desc-link{background:none;border:none;padding:0;font:inherit;color:var(--brass);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);}
.desc-link:hover{color:var(--burgundy);}
.desc-link-ambiguous{background:none;border:none;padding:0;font:inherit;color:var(--slate);cursor:pointer;text-decoration:underline;text-decoration-style:dashed;text-decoration-color:var(--brass);}
.desc-link-ambiguous:hover{color:var(--burgundy);}
.related h4{font-weight:600;font-size:.83rem;color:var(--slate);margin:0 0 8px;border-top:1px solid var(--line);padding-top:14px;}
.chip-row{display:flex;flex-wrap:wrap;gap:7px;}
.chip-wrap{display:inline-flex;align-items:center;gap:3px;}
.chip{font-size:.86rem;background:var(--parchment-2);border:1px solid var(--line);color:var(--charcoal);padding:5px 11px;border-radius:3px;cursor:pointer;}
.chip:hover{border-color:var(--brass);background:#f1e8cc;}
.chip-map-btn{width:26px;height:26px;flex:none;border-radius:50%;background:var(--brass);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.chip-map-btn svg{width:14px;height:14px;}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.dot-place{background:var(--brass);} .dot-person{background:var(--burgundy);}
.dot-work{background:var(--teal);} .dot-term{background:var(--slate);}
.dot-pastiche{background:var(--pastiche);}
.edit-btn{font-size:.85rem;background:none;border:1px solid var(--brass);color:var(--brass);padding:6px 13px;border-radius:3px;cursor:pointer;margin-right:8px;}
.edit-btn:hover{background:var(--brass);color:#fff;}
.map-jump-main-btn{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;background:none;border:1px solid var(--brass);color:var(--brass);padding:6px 13px;border-radius:3px;cursor:pointer;margin-bottom:14px;margin-right:8px;text-decoration:none;}
.map-jump-main-btn:hover{background:var(--brass);color:#fff;}
.map-jump-main-btn svg{width:14px;height:14px;}

.journal-section{border-top:1px solid var(--line);margin-top:18px;padding-top:14px;}
.journal-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.journal-section-head h4{font-weight:600;font-size:.83rem;color:var(--slate);margin:0;}
.add-journal-btn{font-size:.78rem;background:var(--teal);border:none;color:#fff;padding:5px 11px;border-radius:3px;cursor:pointer;}
.journal-card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:10px;}
/* Xのタイムラインのように、一覧に並ぶカードでも正方形に切り詰めず縦横比を
   保ったまま表示する（幅は容器に収め、縦長写真が並びを占領しすぎないよう
   緩めの上限だけ設ける）。詳細モーダル（.journal-card-detail）はさらに
   1枚をじっくり見せる場面なので、上限だけをもっと緩くする。 */
.journal-card img{width:auto;height:auto;max-width:100%;max-height:360px;object-fit:contain;border-radius:3px;margin:0 auto 8px;display:block;}
.journal-card-detail img{max-height:65vh;}
.journal-card .jc-place{font-weight:600;font-size:.9rem;color:var(--ink);margin-bottom:3px;}
.journal-card .jc-comment{font-size:.88rem;line-height:1.6;margin:0 0 6px;white-space:pre-wrap;}
.journal-card .jc-meta{font-size:.74rem;color:var(--slate);}
.journal-card .jc-actions{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;}
.jc-delete-btn{background:none;border:1px solid var(--burgundy);color:var(--burgundy);padding:3px 10px;border-radius:3px;font-size:.72rem;cursor:pointer;}
.jc-like-btn,.jc-reply-toggle-btn,.jc-report-btn,.jc-share-btn{background:none;border:1px solid var(--line);color:var(--slate);padding:3px 10px;border-radius:3px;font-size:.72rem;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
.jc-like-btn.liked{border-color:var(--burgundy);color:var(--burgundy);}
.jc-report-btn:hover{border-color:var(--burgundy);color:var(--burgundy);}
.jc-share-btn:hover{border-color:var(--brass);color:var(--ink);}
.jc-share-btn svg{width:12px;height:12px;flex:none;}
.jc-replies{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);}
.jc-reply{font-size:.82rem;line-height:1.6;margin-bottom:6px;}
.jc-reply-del-btn{background:none;border:none;color:var(--burgundy);font-size:.72rem;cursor:pointer;margin-left:8px;padding:0;text-decoration:underline;}
.jc-reply-form{display:flex;gap:6px;margin-top:6px;}
.jc-reply-form input{flex:1;padding:5px 8px;border:1px solid var(--line);border-radius:3px;font-size:.82rem;}
.jc-reply-form button{background:var(--brass);border:none;color:#fff;padding:0 12px;border-radius:3px;cursor:pointer;font-size:.8rem;}
.journal-card-private{border-style:dashed;background:var(--parchment-2);}
.jc-private-badge{display:inline-block;background:var(--slate);color:#fff;font-size:.68rem;padding:2px 8px;border-radius:2px;margin-bottom:8px;}
.visibility-toggle{display:flex;gap:8px;}
.vis-btn{flex:1;background:#fff;border:1px solid var(--line);color:var(--charcoal);padding:8px 10px;border-radius:3px;cursor:pointer;font-size:.85rem;}
.vis-btn.active{border-color:var(--teal);background:var(--teal);color:#fff;}
.review-section-label{font-weight:600;color:var(--brass-light);margin:16px 0 4px;font-size:.85rem;}
.empty-msg{font-size:.88rem;opacity:.6;font-style:italic;}

.modal-overlay{position:fixed;inset:0;background:rgba(28,36,48,.65);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px;}
.modal-overlay.open{display:flex;}
.modal-overlay.open.picking{display:none;}
.geo-map-pick-btn{display:block;width:100%;margin-top:6px;padding:8px 14px;text-align:center;}
.map-pick-banner{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:2100;background:var(--ink);color:#fff;border-radius:20px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;font-size:.82rem;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:calc(100vw - 32px);}
.map-pick-banner button{flex:none;background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 12px;border-radius:14px;font-size:.78rem;cursor:pointer;font-family:inherit;}
.map-pick-banner button:hover{background:rgba(255,255,255,.28);}
body.map-picking .leaflet-container{cursor:crosshair;}
/* .modal-shellは.modal本体と同じ最大幅・最大高さを持たせた「透明な外枠」。
   .modal-close-xをこの外枠基準の絶対配置にすることで、.modalの内容が
   何であっても常にその右上に✕が乗る（.modal自体は個々のモーダルの
   innerHTMLで毎回まるごと差し替わるため、✕をその中に置けない）。 */
.modal-shell{position:relative;max-width:520px;width:100%;max-height:88vh;}
.modal-close-x{position:absolute;top:6px;right:6px;z-index:1;background:none;border:none;
  color:var(--slate);font-size:1.05rem;line-height:1;cursor:pointer;padding:7px 10px;
  border-radius:3px;-webkit-tap-highlight-color:transparent;}
.modal-close-x:hover{background:rgba(43,38,32,.08);color:var(--charcoal);}
.modal{background:var(--parchment);color:var(--charcoal);border-radius:5px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 24px 26px;border-top:4px solid var(--brass);}
/* #modalBody(=.modal)はモーダルを開いた瞬間にJSからtabindex="-1"経由で
   プログラム的にフォーカスされる（キーボード操作でのフォーカスではないため、
   コンテナ全体を囲む太い輪郭は見た目上うるさいだけなので消す。個々のボタンや
   入力欄自体のフォーカスリングは通常通り表示される）。 */
#modalBody:focus{outline:none;}
.modal h3{font-family:'Playfair Display',serif;margin:0 0 4px;font-size:1.25rem;color:var(--ink);}
.modal .modal-sub{font-size:.82rem;opacity:.7;margin-bottom:16px;}
/* 使い方ガイド（openUsageGuideModal）専用。長文になるので、見出し＋本文の
   セクションを縦に並べる。.modal自体がoverflow-y:autoなので、モーダルの中で
   普通にスクロールできる。 */
.guide-section{margin-bottom:16px;}
.guide-section:last-child{margin-bottom:0;}
.guide-section-title{display:flex;align-items:center;gap:6px;font-family:'Playfair Display',serif;font-weight:600;font-size:1.02rem;color:var(--ink);margin:0 0 6px;border-top:1px solid var(--line);padding-top:14px;}
.guide-section:first-child .guide-section-title{border-top:none;padding-top:0;}
.guide-section-body{font-size:.85rem;color:var(--charcoal);line-height:1.75;}
.guide-section-body p{margin:0 0 8px;}
.guide-section-body p:last-child{margin-bottom:0;}
.guide-section-body strong{color:var(--ink);}
.guide-section-body a{color:var(--brass-light);}
/* .modal-subは「控えめな補足説明」用のスタイル（他の多くのモーダルで使用中）なので、
   ルート出発地点の確認モーダルのように、そこがモーダルの主題そのもの（ユーザーに
   決めてほしい問い）である場合はこちらを使う。文字を大きく・太く・地の色（薄い
   グレーではなく本文色）にして、下の詳細説明（.hint）よりはっきり目立たせる。 */
.modal .modal-question{font-size:1.05rem;font-weight:700;color:var(--charcoal);margin-bottom:14px;line-height:1.4;}
/* ルートの巡り方を選ぶモーダル（openRouteOriginConfirmModal）専用。3つの
   選択肢を優劣なく同じ見た目のカードとして縦に並べる（太字の見出し＋
   1〜2行の説明）。以前は2つだけ.modal-cancel/.modal-submitの実ボタンで、
   3つ目だけ地味なテキストリンクという非対称な扱いだったのを解消した。 */
.route-origin-options{display:flex;flex-direction:column;gap:10px;}
.route-origin-option{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
  border-radius:4px;padding:12px 14px;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;}
.route-origin-option:hover{background:#f7ecd0;border-color:var(--brass);}
.route-origin-option-title{display:block;font-weight:700;font-size:.95rem;color:var(--charcoal);margin-bottom:4px;}
.route-origin-option-desc{display:block;font-size:.78rem;color:var(--slate);line-height:1.55;}
/* 移動手段トグル（徒歩／電車・バス）。openRouteOriginConfirmModal上部に置く。 */
.route-mode-toggle{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.route-mode-btn{background:none;border:1px solid var(--line);color:var(--slate);padding:6px 14px;border-radius:16px;cursor:pointer;font-size:.85rem;font-family:inherit;}
.route-mode-btn.active{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600;}
.route-mode-btn:hover{border-color:var(--teal);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:.82rem;font-weight:600;color:var(--slate);margin-bottom:4px;}
.field input[type=text],.field input[type=date],.field textarea,.field select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:3px;font-size:.9rem;background:#fff;}
.field textarea{min-height:90px;resize:vertical;}
.field .hint{font-size:.74rem;opacity:.6;margin-top:3px;}
.disclosure-toggle{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--brass);font-size:.82rem;font-weight:600;cursor:pointer;padding:0;margin-bottom:4px;font-family:inherit;}
.disclosure-toggle:hover{text-decoration:underline;}
.disclosure-arrow{font-size:.7rem;display:inline-block;width:10px;}
.disclosure-body{margin-top:6px;}
/* ネイティブのinput[type=date]はモバイルだと一度日付を選ぶと戻す手段（×）が
   見当たらないことが多いため、専用のクリアボタンを横に添えている。 */
.date-clear-row{display:flex;gap:6px;align-items:stretch;}
.date-clear-row input[type=date]{flex:1;min-width:0;}
.date-clear-btn{flex:none;width:38px;background:#fff;border:1px solid var(--line);border-radius:3px;color:var(--slate);font-size:1.1rem;line-height:1;cursor:pointer;}
.date-clear-btn:hover{border-color:var(--brass);color:var(--brass);}
/* 「既存の項目を編集」モーダル専用の、索引欄に似た種別別の折りたたみ一覧。
   索引欄本体の.index-group系は暗いサイドバー向けの配色（明るい文字色）の
   ため、明るいモーダル背景では読めなくなる。同じ構造を、モーダルに合わせた
   明るい配色で作り直したもの。 */
.ees-browse-list{border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-top:2px;max-height:340px;overflow-y:auto;background:#fff;}
.ees-group-header{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:var(--parchment-2);border:none;border-bottom:1px solid var(--line);font-weight:600;font-size:.78rem;color:var(--slate);padding:8px 12px;cursor:pointer;font-family:inherit;}
.ees-group-header:hover{background:#e6d9b8;}
.ees-arrow{font-size:.7rem;display:inline-block;width:10px;color:var(--brass);}
.ees-count{margin-left:auto;font-size:.7rem;opacity:.6;font-weight:400;}
.ees-item{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);color:var(--charcoal);font-size:.86rem;padding:7px 12px;cursor:pointer;font-family:inherit;}
.ees-item:last-child{border-bottom:none;}
.ees-item:hover{background:rgba(171,131,71,.12);}
.ees-empty{padding:14px 12px;font-size:.82rem;color:var(--slate);font-style:italic;}
.geo-row{display:flex;gap:6px;}
.geo-row input{flex:1;}
.geo-search-btn{background:var(--slate);border:none;color:#fff;padding:0 14px;border-radius:3px;cursor:pointer;font-size:.85rem;white-space:nowrap;}
.geo-results{margin-top:6px;max-height:130px;overflow-y:auto;}
.geo-result-item{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:3px;padding:6px 9px;margin-bottom:5px;font-size:.82rem;cursor:pointer;}
.geo-result-item:hover{border-color:var(--brass);background:#f7ecd0;}
.geo-result-item.selected{border-color:var(--teal);background:#e7f0ef;}
.latlng-row{display:flex;gap:8px;margin-top:8px;}
.latlng-row input{width:100%;}
.checklist{max-height:140px;overflow-y:auto;border:1px solid var(--line);border-radius:3px;padding:8px 10px;background:#fff;}
.checklist label{display:block;font-size:.85rem;font-weight:400;margin:3px 0;cursor:pointer;}
/* お気に入りリスト編集モーダルの、ドラッグ並べ替え可能な行。
   ⠿ハンドルだけをドラッグ起点にし、行内のlabel（チェックボックス）は
   従来通りタップでチェックのon/offができるよう独立させてある。 */
.fle-row{display:flex;align-items:center;gap:2px;margin:3px 0;}
.fle-drag-handle{cursor:grab;touch-action:none;color:var(--fog);font-size:1.1rem;line-height:1;
  padding:4px 8px 4px 2px;flex:none;user-select:none;}
.fle-drag-handle:active{cursor:grabbing;}
.checklist .fle-row-label{display:flex;align-items:center;gap:0;font-size:.85rem;font-weight:400;
  margin:0;cursor:pointer;flex:1;min-width:0;}
.fle-row-dragging{background:#f7ecd0;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.2);position:relative;z-index:5;}
.file-input{width:100%;font-size:.85rem;padding:6px 0;}
.image-preview{margin-top:8px;}
.image-preview img{max-width:100%;max-height:160px;border-radius:3px;border:1px solid var(--line);display:block;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
.modal-cancel{background:none;border:1px solid var(--line);color:var(--charcoal);padding:7px 16px;border-radius:3px;cursor:pointer;}
.modal-submit{background:var(--brass);border:none;color:#fff;padding:7px 18px;border-radius:3px;cursor:pointer;}
.modal-submit:disabled{opacity:.45;cursor:not-allowed;}
/* 「項目の追加・編集等」モーダル（openEntityManageModal）専用。旧来は
   「＋新しい項目を追加」「編集一覧」「データをエクスポート」の3つが
   ヘッダーに個別のボタンとして並んでいて手狭だったため、1つのボタンに
   まとめ、開くとここで3択を選ぶ形にした。 */
.menu-choice-list{display:flex;flex-direction:column;gap:8px;margin:14px 0;}
.menu-choice-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:var(--parchment-2);border:1px solid var(--line);border-radius:4px;padding:10px 14px;cursor:pointer;font-family:inherit;}
.menu-choice-btn:hover{background:#e6d9b8;border-color:var(--brass);}
.menu-choice-label{font-weight:600;font-size:.92rem;color:var(--ink);}
.menu-choice-sub{font-size:.78rem;color:var(--slate);}
/* 出発地・目的地を自分で選ぶモーダル（openRoutePickStopsModal）専用。地点ごとに
   1行、右側に◎（出発地）○（目的地）の2つのボタンを並べる。地点数が多い
   （最大25件）ことを考慮し、リスト自体を内側でスクロールさせてモーダルの
   縦幅が際限なく伸びないようにしている。 */
.route-pick-list{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:4px;margin-top:10px;}
.route-pick-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;
  border-bottom:1px solid var(--line);background:#fff;}
.route-pick-row:last-child{border-bottom:none;}
.route-pick-name{font-size:.85rem;color:var(--charcoal);flex:1;min-width:0;}
.route-pick-btns{display:flex;gap:6px;flex:none;flex-wrap:wrap;}
.route-pick-btn{background:none;border:1px solid var(--line);color:var(--slate);padding:5px 9px;
  border-radius:3px;cursor:pointer;font-size:.78rem;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.route-pick-btn:hover{background:#f7ecd0;}
.route-pick-origin.active{background:var(--brass);border-color:var(--brass);color:#fff;font-weight:600;}
.route-pick-dest.active{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600;}
/* 経由地チェックボックスは◎○ボタンの下に独立した行として置きたいので、
   flex-wrapで折り返させた上でflex-basis:100%を指定する。.route-pick-btnの
   詳細度（下のメディアクエリ内でflex:1を指定している）に負けないよう、
   2クラス指定で詳細度を上げている。 */
.route-pick-btn.route-pick-waypoint{flex:1 1 100%;text-align:left;margin-top:2px;white-space:normal;}
.route-pick-waypoint.active{background:var(--parchment-2);border-color:var(--brass);color:var(--charcoal);}
/* ルートかごの浮きバー（画面左下）。中身が0件の間はdisplay:none、1件以上で.showが付く。
   右下は表示絞り込み等の帯・浮きボタンで埋まっているため、衝突しない左下に置く。 */
.route-cart-bar{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:16px;z-index:500;display:none;align-items:stretch;background:var(--ink-2);color:var(--fog);border:1px solid var(--teal);border-radius:22px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:calc(100vw - 32px);}
.route-cart-bar.show{display:flex;}
.route-cart-bar-main{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--fog);font-size:.82rem;font-weight:600;padding:9px 10px 9px 14px;cursor:pointer;white-space:nowrap;font-family:inherit;}
.route-cart-bar-count{background:var(--teal);color:#fff;border-radius:10px;padding:1px 8px;font-size:.76rem;font-weight:700;}
.route-cart-bar-clear{flex:none;background:none;border:none;border-left:1px solid rgba(230,224,209,.25);color:var(--fog);opacity:.7;font-size:.9rem;line-height:1;padding:0 12px;cursor:pointer;}
.route-cart-bar-clear:hover{opacity:1;}
/* ルートかごモーダル内の地点一覧（openRouteCartModal）。.route-pick-listと似た見た目。 */
.route-cart-list{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:4px;margin-top:10px;}
.route-cart-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:#fff;}
.route-cart-row:last-child{border-bottom:none;}
.route-cart-row-name{font-size:.85rem;color:var(--charcoal);flex:1;min-width:0;}
.route-cart-row-remove{flex:none;background:none;border:1px solid var(--line);color:var(--slate);width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:.78rem;line-height:1;padding:0;}
.route-cart-row-remove:hover{border-color:var(--burgundy);color:var(--burgundy);}
/* 経由地が上限を超えた時の区間分割モーダル（openMultiLegRouteModal）。 */
.route-leg-list{display:flex;flex-direction:column;gap:10px;margin-top:10px;max-height:360px;overflow-y:auto;}
.route-leg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:#fff;}
.route-leg-info{flex:1;min-width:0;}
.route-leg-num{display:inline-block;font-size:.72rem;font-weight:700;color:#fff;background:var(--teal);border-radius:10px;padding:1px 8px;margin-bottom:4px;}
.route-leg-desc{display:block;font-size:.85rem;color:var(--charcoal);line-height:1.5;}
.route-leg-via{display:block;font-size:.74rem;color:var(--slate);margin-top:2px;}
.route-leg-open-btn{flex:none;white-space:nowrap;}
.route-leg-open-btn.modal-submit{background:var(--teal);}
/* 開いた後も押せなくはしない（何度でも開き直せるように）。見た目だけ、
   塗りつぶしから縁取りだけの控えめな表示に変えて「開いた」と分かるようにする。 */
.route-leg-open-btn.modal-submit.opened{background:none;border:1px solid var(--teal);color:var(--teal);}
/* 「現在地」は一覧の実在の地点とは別枠なので、背景を少し変えて区別する
   （出発地専用＝○目的地ボタンを持たない一行だけの特別枠）。 */
.route-pick-row-current{background:var(--parchment-2);}
@media (max-width:480px){
  .route-pick-row{flex-direction:column;align-items:flex-start;gap:6px;}
  .route-pick-btns{width:100%;}
  .route-pick-btn{flex:1;}
}
.danger-zone{margin-top:22px;padding-top:14px;border-top:1px dashed var(--burgundy);text-align:right;}
.review-count-badge{background:var(--burgundy);color:#fff;border-radius:10px;padding:1px 7px;font-size:.72rem;margin-left:4px;}
.my-edits-count-badge{background:var(--teal);color:#fff;border-radius:10px;padding:1px 7px;font-size:.72rem;margin-left:4px;}
.review-list{max-height:420px;overflow-y:auto;margin:14px 0;}
.proposal-card{background:var(--parchment-2);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:10px;color:var(--charcoal);}
.proposal-head{font-size:.95rem;margin-bottom:2px;}
.proposal-kind{display:inline-block;background:var(--teal);color:#fff;font-size:.68rem;padding:1px 8px;border-radius:2px;margin-right:6px;}
.proposal-meta{font-size:.72rem;opacity:.65;margin-bottom:8px;}
.proposal-detail{font-size:.85rem;line-height:1.6;margin-bottom:10px;}
.proposal-actions{display:flex;gap:8px;}
/* 承認・却下履歴カード。操作ボタンの代わりにステータス表示＋項目ページへの
   リンクだけを持つので、通常の.proposal-cardより軽い見た目にしている。 */
.history-status-approved{color:var(--teal);font-weight:700;font-size:.78rem;}
.history-status-rejected{color:var(--burgundy);font-weight:700;font-size:.78rem;}
.history-card .link-btn{font-size:.8rem;}
.proposal-status{display:inline-block;font-size:.68rem;padding:1px 8px;border-radius:2px;margin-left:4px;}
.proposal-status-pending{background:var(--slate);color:#fff;}
.proposal-status-approved{background:var(--moss);color:#fff;}
.proposal-status-rejected{background:var(--burgundy);color:#fff;}
/* 編集一覧モーダル（明るい背景）専用。.alias-list-item / .alias-delete-btn は
   暗い索引サイドバー向けに color:var(--fog) で作られており、明るい背景の
   モーダルの中で使うと文字色が薄すぎて読みにくくなるため、別クラスにしている。 */
.my-draft-row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 12px;font-size:.85rem;color:var(--charcoal);background:var(--parchment-2);border:1px solid var(--line);border-radius:4px;margin-bottom:8px;}
.draft-discard-btn{background:none;border:1px solid var(--line);color:var(--slate);width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:.78rem;flex:none;line-height:1;padding:0;}
.draft-discard-btn:hover{border-color:var(--burgundy);color:var(--burgundy);}
/* 二重確認の1回目を押した直後の状態。丸いアイコンのままだと「本当に削除？」の
   文字が入らないので、その間だけ横長のピル型に広げて、誤操作でないことが
   はっきり分かる見た目（赤背景）にする。 */
.draft-discard-btn.confirming{width:auto;height:auto;border-radius:12px;padding:4px 10px;background:var(--burgundy);border-color:var(--burgundy);color:#fff;font-size:.72rem;white-space:nowrap;}
.my-draft-actions{display:flex;align-items:center;gap:8px;flex:none;}
.danger-delete-btn{background:none;border:1px solid var(--burgundy);color:var(--burgundy);padding:6px 16px;border-radius:3px;cursor:pointer;font-size:.82rem;}
.danger-delete-btn:hover:not(:disabled){background:var(--burgundy);color:#fff;}
.danger-delete-btn:disabled{opacity:.4;cursor:not-allowed;}

.timeline{position:absolute;inset:0;background:var(--parchment);color:var(--charcoal);overflow-y:auto;display:none;padding:20px 26px 60px;}
.timeline-close{position:absolute;top:14px;right:20px;background:none;border:none;font-size:1.8rem;line-height:1;color:var(--slate);cursor:pointer;padding:4px 8px;}
.timeline-close:hover{color:var(--burgundy);}
.timeline.open{display:block;}
.timeline h2{font-family:'Playfair Display',serif;font-size:1.5rem;margin:4px 0 4px;color:var(--ink);}
.timeline-note{font-size:.85rem;opacity:.7;margin-bottom:18px;}

.mybook-stats{background:var(--parchment-2);border:1px solid var(--line);border-radius:5px;padding:16px 18px;margin-bottom:20px;}
.mybook-numbers{display:flex;gap:22px;flex-wrap:wrap;font-size:.78rem;color:var(--slate);}
.mybook-numbers strong{display:block;font-size:1.35rem;color:var(--ink);font-family:'Playfair Display',serif;font-weight:600;}
.mybook-section-label{font-weight:600;color:var(--slate);margin:0 0 10px;font-size:.85rem;}
.mybook-track-head{font-family:'Playfair Display',serif;font-weight:600;font-size:.95rem;color:var(--ink);margin-bottom:8px;}

.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink-2);color:var(--parchment);padding:10px 20px;border-radius:4px;border:1px solid var(--brass);font-size:.88rem;z-index:3000;opacity:0;pointer-events:none;transition:opacity .25s ease;}
/* 通信が切れたときに常時表示する帯。トーストと違って自動で消えず、オンラインに
   戻るまで出し続ける（地図タイルや投稿の送受信が裏で失敗し続けているのに、
   利用者からは理由が分からないまま、という状態を避けるため）。 */
.offline-banner{position:fixed;top:0;left:0;right:0;z-index:4000;background:var(--burgundy);color:#fff;font-size:.82rem;text-align:center;padding:8px 14px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.25);}
.offline-banner.show{display:block;}
.lightbox-overlay{position:fixed;inset:0;background:rgba(10,13,18,.92);display:none;align-items:center;justify-content:center;z-index:5000;padding:30px;cursor:zoom-out;}
.lightbox-overlay.open{display:flex;}
.lightbox-overlay img{max-width:100%;max-height:100%;object-fit:contain;border-radius:3px;box-shadow:0 8px 30px rgba(0,0,0,.5);}
.lightbox-close{position:absolute;top:16px;right:20px;background:none;border:none;color:#fff;font-size:2rem;cursor:pointer;line-height:1;}
.photo-block img,.entity-img,.journal-card img{cursor:zoom-in;}
.toast.show{opacity:1;}
.map-latlng-popup .leaflet-popup-content-wrapper{background:var(--ink-2);color:var(--fog);border:1px solid var(--brass);border-radius:4px;}
.map-latlng-popup .leaflet-popup-tip{background:var(--ink-2);border:1px solid var(--brass);}
.map-latlng-popup .leaflet-popup-content{margin:9px 12px;}
.map-latlng-popup-coords{font-size:.72rem;color:var(--slate);margin-bottom:4px;}
.map-latlng-popup-body a{color:var(--brass-light);font-size:.85rem;text-decoration:none;font-weight:600;}
.map-latlng-popup-body a:hover{text-decoration:underline;}
.map-jump-name-popup .leaflet-popup-content-wrapper{background:var(--ink-2);color:var(--fog);border:1px solid var(--brass);border-radius:4px;}
.map-jump-name-popup .leaflet-popup-tip{background:var(--ink-2);border:1px solid var(--brass);}
.map-jump-name-popup .leaflet-popup-content{margin:9px 14px;font-weight:600;font-size:.92rem;}
/* 地名ピンをタップした時の小さいプレビューカード（タップで詳細ページへ） */
.pin-preview-popup .leaflet-popup-content-wrapper{background:var(--ink-2);color:var(--fog);border:1px solid var(--brass);border-radius:6px;padding:0;overflow:hidden;}
.pin-preview-popup .leaflet-popup-content{margin:0;width:212px !important;}
.pin-preview-popup .leaflet-popup-tip{background:var(--ink-2);border:1px solid var(--brass);}
.pin-preview-popup .leaflet-popup-close-button{color:var(--fog) !important;opacity:.75;}
.pin-preview-popup .leaflet-popup-close-button:hover{opacity:1;}
.pin-preview-card{cursor:pointer;}
.pin-preview-img{display:block;width:100%;height:104px;object-fit:cover;}
.pin-preview-body{padding:10px 12px 11px;}
.pin-preview-name{font-family:'Playfair Display',serif;font-size:.96rem;color:var(--fog);margin:0 0 4px;line-height:1.32;}
.pin-preview-desc{font-size:.74rem;color:var(--fog);opacity:.82;line-height:1.5;margin:0 0 7px;}
.pin-preview-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.pin-preview-more{font-size:.72rem;color:var(--brass-light);font-weight:600;}
.pin-preview-actions{display:flex;align-items:center;gap:6px;flex:none;}
.pin-preview-route-btn{flex:none;background:none;border:1px solid rgba(230,224,209,.35);color:var(--fog);font-size:.92rem;line-height:1;padding:4px 8px;border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.pin-preview-route-btn:hover{border-color:#5c9490;}
.pin-preview-route-btn.active{background:var(--teal);border-color:var(--teal);color:#fff;}
.pin-preview-fav-btn{flex:none;background:none;border:1px solid rgba(230,224,209,.35);color:var(--fog);font-size:.92rem;line-height:1;padding:4px 8px;border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.pin-preview-fav-btn:hover{border-color:var(--brass-light);}
.pin-preview-fav-btn.active{background:var(--brass);border-color:var(--brass);color:#fff;}

@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:56px 1fr;}
  .index{position:absolute;top:56px;left:0;bottom:0;width:240px;z-index:1000;transform:translateX(-100%);transition:transform .25s ease;}
  .index.open{transform:translateX(0);}
  .index-toggle{display:inline-block;}
  .index-close{display:inline-block;}
  .panel{width:100%;}
  .header .sub{display:none;}
  .menu-toggle{display:inline-block;}
  .action-btns{display:none;position:absolute;top:56px;right:12px;z-index:1500;background:var(--ink-2);border:1px solid var(--line);border-radius:4px;flex-direction:column;gap:6px;padding:10px;box-shadow:0 6px 16px rgba(0,0,0,.4);min-width:200px;max-width:calc(100vw - 24px);box-sizing:border-box;}
  .action-btns.open{display:flex;}
  .action-btns .hbtn{width:100%;text-align:left;}
  .action-btns .auth-area{display:flex;flex-direction:column;align-items:stretch;width:100%;gap:6px;margin-left:0;}
  .modal{padding:18px 16px 22px;}
  .timeline{padding:16px 16px 50px;}
  /* スマホ幅だと地図全体の横幅が狭くなり、中央寄せの検索ボックスの左端が
     Leafletのズームボタン（地図左上）と重なってしまっていた。検索ボックスを
     左上のズームボタン分だけ避けた範囲の中で中央寄せし直すことで解消する。 */
  .map-search{left:56px;right:12px;transform:none;width:min(320px,calc(100vw - 68px));margin:0 auto;}
}
</style>
</head>
<body>
<div class="offline-banner" id="offlineBanner" role="status" aria-live="polite">📡 オフラインです。地図タイルの読み込みなど、一部の機能が正しく動作しない可能性があります。</div>
<div class="app">
  <div class="header">
    <svg class="seal" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="#ab8347" stroke-width="2"/><circle cx="20" cy="20" r="6" fill="#ab8347"/></svg>
    <h1>ホームズ・アトラス</h1>
    <div class="header-spacer"></div>
    <button class="hbtn index-toggle" id="indexToggle">索引</button>
    <div class="action-btns" id="actionBtns">
      <button class="hbtn" id="guideBtn">📖 使い方ガイド</button>
      <button class="hbtn" id="entityManageBtn">項目の追加・編集等<span class="my-edits-count-badge" id="myEditsCountBadge"></span></button>
      <button class="hbtn" id="addJournalBtn">訪問記録・コメントの投稿</button>
      <button class="hbtn" id="timelineToggle">タイムライン</button>
      <span class="auth-area" id="authArea"></span>
    </div>
    <button class="hbtn menu-toggle" id="menuToggle">☰ メニュー</button>
  </div>

  <div class="index" id="index">
    <div class="index-toolbar">
      <div class="index-filter-wrap">
        <input type="text" id="indexFilterInput" class="index-filter-input" placeholder="索引を絞り込み…" autocomplete="off">
        <button type="button" class="index-filter-clear-btn" id="indexFilterClearBtn" title="クリア" aria-label="索引の絞り込みをクリア" style="display:none;">×</button>
      </div>
      <button class="index-close" id="indexClose" title="索引を閉じる" aria-label="索引を閉じる">×</button>
    </div>
    <div class="recent-updates" id="recentUpdatesBlock" style="display:none;">
      <div class="recent-updates-label">🕐 最近の更新</div>
      <div class="recent-updates-list" id="recentUpdatesList"></div>
    </div>
    <div class="index-scroll" id="indexScroll"></div>
  </div>

  <div class="stage">
    <div id="map"></div>
    <div class="map-status" id="mapStatus">地図タイルを読み込み中…</div>
    <div class="map-search" id="mapSearch">
      <div class="map-search-row">
        <input type="text" id="mapSearchInput" placeholder="地名やスポット名で検索" autocomplete="off">
        <button type="button" class="map-search-clear-btn" id="mapSearchClearBtn" title="クリア" aria-label="検索欄をクリア" style="display:none;">×</button>
        <button type="button" id="mapSearchBtn">検索</button>
      </div>
      <div class="map-search-results" id="mapSearchResults"></div>
    </div>
    <!-- 「真鍮パネル」デザイン：バラバラな丸皿ボタンをやめ、1本の帯（ツールバー）に
         まとめている。仕切り線と、オン状態の金色文字で「一つの計器盤」に見えるように
         し、221Bへだけは特別枠（バーガンディ色の小さなピル）として右端に残す。 -->
    <div class="map-controls-cluster" id="mapControlsCluster">
      <button class="mt-seg" id="historicToggleBtn" title="ホームズ時代の古地図（英国陸地測量部の1:10,560地形図、1888〜1913年にかけて測量）に切り替え" aria-pressed="false">
        <svg class="mt-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2V6Z"/><path d="M9 4v14M15 6v14"/></svg>
        <span id="historicToggleLabel">古地図</span>
      </button>
      <span class="mt-div"></span>
      <span class="mt-seg mt-select-wrap" id="viewFilterWrap">
        <button type="button" class="mt-select-btn" id="viewFilterBtn" title="表示する地点を絞り込む（正典登場地のみ／特定の作品の登場地のみ／訪問記録ピンの表示・非表示）" aria-haspopup="listbox" aria-expanded="false">
          <span id="viewFilterBtnLabel">表示絞り込み</span>
          <svg class="mt-ic mt-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </span>
      <span class="mt-div"></span>
      <span class="mt-seg mt-select-wrap" id="favFilterWrap">
        <button type="button" class="mt-select-btn" id="favFilterBtn" title="選んだお気に入りリストの地点だけを地図に表示する" aria-haspopup="listbox" aria-expanded="false">
          <span id="favFilterBtnLabel">お気に入り表示</span>
          <svg class="mt-ic mt-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </span>
      <span class="mt-div"></span>
      <button class="mt-seg" id="labelForceBtn" title="ズームを寄せなくても地点名を表示する（重なる場所は「〇〇 他N件」とまとめて表示）" aria-pressed="false">
        <svg class="mt-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>名称表示</span>
      </button>
    </div>
    <!-- 表示絞り込み（旧「正典のみ」トグル＋「作品選択」）はネイティブの<select>をやめ、
         自前のボタン＋一覧に置き換えている。ネイティブのselectはappearance:noneで
         見た目を消したつもりでも、スマホのブラウザによっては選択直後にブラウザ標準の
         明るい配色（白い枠）で描き直してしまうことがあり、CSSだけでは機種差を
         潰しきれなかったため。自前のボタン＋一覧なら、どの機種でも常にこちらの
         指定通りの見た目になる。一覧（#viewFilterMenu）は帯（.map-controls-cluster、
         横スクロールのためoverflow-x:autoにしている）の外に置き、帯の真上に浮かせて
         表示する（帯の中に置くと、横スクロール用のoverflow設定に巻き込まれて
         上にはみ出す部分が見えなくなってしまうため）。 -->
    <!-- 表示絞り込みメニューだけは、選んでも閉じずに複数の項目をチェックボックス感覚で
         続けて切り替えられるようにしている（他の絞り込みと違い、地点フィルターと
         訪問記録ピンの表示/非表示という独立した軸が同居しており、両方まとめて
         調整したい場面があるため）。そのため上部に固定の閉じるボタンを持つヘッダーを
         置き、実際の項目一覧（#viewFilterMenuBody）だけをスクロール領域にしている。 -->
    <div class="mt-select-menu mt-select-menu-with-header" id="viewFilterMenu" role="group" aria-label="表示絞り込み">
      <div class="mt-select-menu-header">
        <span class="mt-select-menu-title">表示絞り込み</span>
        <button type="button" class="mt-select-menu-close" id="viewFilterMenuClose" aria-label="閉じる" title="閉じる">✕</button>
      </div>
      <div class="mt-select-menu-body" id="viewFilterMenuBody"></div>
    </div>
    <!-- お気に入りリストで絞り込む一覧も同じ「帯の外に浮かせる」方式（理由はviewFilterMenuと同じ）。
         こちらは1つ選んだらすぐ地図が動いて目的が完結するので、従来通り選択即クローズのまま。 -->
    <div class="mt-select-menu" id="favFilterMenu" role="listbox"></div>
    <!-- ルートかご：お気に入りとは独立した一時的なルート作業台。かごが空の間は
         非表示（.showが付いた時だけ見える）。右側の帯・浮きボタン群と衝突しないよう
         左下に置いている。 -->
    <div class="route-cart-bar" id="routeCartBar">
      <button type="button" class="route-cart-bar-main" id="routeCartBarOpen" title="ルートかごの中身を見る">
        🧭 <span class="route-cart-bar-label">ルート作成中</span><span class="route-cart-bar-count" id="routeCartBarCount">0</span>
      </button>
      <button type="button" class="route-cart-bar-clear" id="routeCartBarClear" title="かごを空にする" aria-label="かごを空にする">✕</button>
    </div>
    <!-- 現在地ボタン・221Bへボタンは帯から独立させ、帯の真上に積み重ねた
         浮きボタンにしている。こうすることで「表示絞り込み」「古地図」の文字ラベルを
         スマホでも消さずに残せる。221Bへは特別な項目への近道なので、これまで通り
         バーガンディ色のピルのまま、現在地ボタンのさらに上に置いている。 -->
    <button class="map-locate-btn" id="locateMapBtn" title="現在地から探す" aria-label="現在地から近い場所を探す">
      <svg class="mt-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
    <button class="map-door-btn" id="bakerStreetBtn" title="221Bベーカー街のページへ一発で移動">
      <svg class="mt-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="1"/><circle cx="14.5" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
      <span>221B</span>
    </button>

let routeCart = []; // [entityId, ...]
function isInRouteCart(id){
  return routeCart.includes(id);
}
function addToRouteCart(id){
  const e = DATA[id];
  if(!e || e.type!=='place' || !e.coords) return false;
  if(routeCart.includes(id)) return true;
  if(routeCart.length >= GMAPS_ROUTE_MAX_STOPS){
    showToast(`ルートかごに入れられるのは最大${GMAPS_ROUTE_MAX_STOPS}件までです。`);
    return false;
  }
  routeCart.push(id);
  renderRouteCartBar();
  return true;
}
function removeFromRouteCart(id){
  const idx = routeCart.indexOf(id);
  if(idx===-1) return;
  routeCart.splice(idx, 1);
  renderRouteCartBar();
}
function toggleRouteCart(id){
  const e = DATA[id];
  if(!e) return;
  if(isInRouteCart(id)){
    removeFromRouteCart(id);
    showToast(`「${e.name}」をルートかごから外しました。`);
  } else {
    if(addToRouteCart(id)) showToast(`「${e.name}」をルートかごに追加しました。`);
  }
  refreshRouteCartUiFor(id);
}

  if(popupBtn && popupBtn.dataset.routeCartId===id){
    popupBtn.classList.toggle('active', on);
    popupBtn.textContent = on ? '✓' : '🧭';

async function deleteMyAccount(){

    const res = await fetch(`${SUPABASE_URL}/functions/v1/delete-account`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'apikey': SUPABASE_ANON_KEY }
    });
    if(!res.ok){
      const body = await res.json().catch(()=>({}));
      showToast('削除に失敗しました：' + (body.error || res.status));

    await supabaseClient.auth.signOut();

// 審査ダッシュボードから、問題のある投稿者のアカウントをBAN（ログイン停止）する。
// 実体はSupabase Auth標準のban_duration機能で、サーバー側（Edge Function）で
// 「呼び出した人が本当に審査担当者か」を確認してから実行する。
// 解除（unban）専用のUIは作っていないので、必要ならSupabaseダッシュボードの
// Authentication > Users から行ってください。
async function banUser(targetUserId, targetName){
  if(!targetUserId){ showToast('対象のユーザーが特定できませんでした。'); return; }
  const label = targetName || '（表示名不明）';
  if(!confirm(`「${label}」さんのアカウントをBAN（ログイン停止）します。よろしいですか？\n\n※既存の投稿は消えません。過去の投稿は今まで通り個別に削除してください。\n※解除したい場合はSupabaseダッシュボードから行う必要があります。`)) return;
  try{
    const { data: sessionData } = await supabaseClient.auth.getSession();
    const token = sessionData?.session?.access_token;
    if(!token){ showToast('ログイン状態が確認できませんでした。'); return; }
    const res = await fetch(`${SUPABASE_URL}/functions/v1/set-user-ban`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ target_user_id: targetUserId, ban: true })
    });
    if(!res.ok){
      const body = await res.json().catch(()=>({}));
      showToast('BANに失敗しました：' + (body.error || res.status));
      return;
    }
    showToast(`${label}さんをBANしました。`);
  }catch(e){
    console.error(e);
    showToast('BANに失敗しました。通信環境をご確認の上もう一度お試しください。');
  }
}

  document.getElementById('auth-google').addEventListener('click', async ()=>{
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: 'https://holmes-atlas.github.io/holmes-atlas-public/' }
    });
    if(error) showToast('Googleログインに失敗しました：' + error.message);
  });
  document.getElementById('auth-submit').addEventListener('click', async ()=>{
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    if(!email || !password){ showToast('メールアドレスとパスワードを入力してください。'); return; }
    if(isSignup){
      const name = document.getElementById('auth-name').value.trim();
      if(!name){ showToast('お名前を入力してください。'); return; }
      if(isDisplayNameTaken(name, null) && !confirm(`「${name}」という表示名は、既に使われている可能性があります。このまま登録しますか？`)) return;
      const { error } = await supabaseClient.auth.signUp({ email, password, options:{ data:{ display_name: name } } });
      if(error){ showToast('登録に失敗しました：' + error.message); return; }
      closeModal();
      showToast('登録しました。確認メールが届く場合は、案内に従ってください。');
    } else {
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if(error){
        console.error(error);
        // SupabaseはBANによる拒否も、間違ったパスワードと同じような一般的な
        // エラーとして返す場合があるため確実な判定はできないが、判別できる
        // 場合はできるだけ分かりやすい文言に出し分ける。
        const banned = error.status === 403 || /banned|suspended/i.test(error.message || '');
        showToast(banned
          ? 'ログインできませんでした。このアカウントは利用停止されています。'
          : 'ログインできませんでした。メールアドレスとパスワードをご確認ください。');
        return;
      }
      closeModal();
      showToast('ログインしました。');
    }
  });
}

function openSetNewPasswordModal(){

function asArray(v){ return Array.isArray(v) ? v : []; }
supabaseClient.auth.onAuthStateChange(async (event, session)=>{
  if(event === 'PASSWORD_RECOVERY'){ openSetNewPasswordModal(); return; }
  currentUser = session?.user || null;
  privateNotes = asArray(await safeGet(privateNotesKey()));
  favoriteLists = await resolveFavoriteLists();
  if(favListFilter && !favoriteLists.find(l=>l.id===favListFilter)){
    // ログアウト等で選択中だったリストが無くなった場合は、地図の絞り込みも解除する
    favListFilter = null;
    renderMarkers();
  }
  populateFavFilterMenu();
  renderAuthArea();
  renderIndex();
});
