    const desc = document.getElementById('f-desc').value.trim();
    if(!name || !desc){ showToast('名称と説明文は必須です。'); return; }
    const type = typeSelect.value;
    let coords = null;
    let relevance = 'core';
    if(type==='place'){
      const lat = parseFloat(document.getElementById('f-lat').value), lng = parseFloat(document.getElementById('f-lng').value);
      if(!isNaN(lat) && !isNaN(lng)) coords=[lat,lng];
      relevance = document.getElementById('f-relevance').value;
    }
    const related = Array.from(modalBody.querySelectorAll('.checklist input:checked')).map(cb=>cb.value);
    const canon = type==='work' ? (document.getElementById('f-canon').value === 'true') : undefined;
    const imgVals = readImageFieldValues(uploadedImageData);
    const draft = {type, name, desc, ...imgVals, coords, canon, relevance, related};
    if(isReviewer()){
      const newId = 'u-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      additions[newId] = draft;
      await rpcObjMerge('p-additions', newId, draft);
      related.forEach(relId=>{
        overrides[relId] = overrides[relId] || {};
        const extra = new Set(overrides[relId].extraRelated||[]);
        extra.add(newId);
        overrides[relId].extraRelated = Array.from(extra);
      });
      await Promise.all(related.map(relId=>rpcObjNestedArrayAddUnique('p-overrides', relId, 'extraRelated', newId)));
      DATA = buildData(); renderMarkers(); renderIndex(); populateViewFilterMenu();
      clearDraft('newEntity', 'new');
      closeModal(); showToast('追加しました。');
      showEntity(newId);
    } else {
      await submitProposal('new', type, null, draft);
      clearDraft('newEntity', 'new');
      closeModal(); showToast('提案を送信しました。審査担当者の確認後に反映されます。');
    }
  });
}

// 「項目の追加・編集等」→「既存の項目を編集」用のモーダル。地点ページの
// 「編集する」ボタンと違い、対象の項目ページを開かずに直接openEditModalへ
// 入れるようにする（地点・人物・作品・用語の全種別が対象）。索引欄と同じ
// 「種別ごとに折りたたまれた一覧から選ぶ」体験を、このモーダル単体でも
// 使えるよう、renderIndex()のグループ分けロジックを簡略化して流用している
// （お気に入り・関連サイト・言い換え辞書など索引欄独自の項目は対象外）。
// eesOpenGroups/eesLastQueryはこのモーダルの外（関数の外）に置き、indexOpenGroups
// と同様にページを開いている間は保持する。編集モーダルの✕やキャンセルで
// ここへ戻ってきた時（modalBackAction経由）に、絞り込み前と同じ状態
// （開いていたグループ・入力していた検索語）へ復元できるようにするため。
const eesLabels = {place:'地名', person:'人物', work:'作品（正典）', 'work-pastiche':'作品（正典外）', term:'用語'};
let eesOpenGroups = new Set();
let eesLastQuery = '';
function openEditEntitySearchModal(){
  modalBody.innerHTML = `
    <h3>既存の項目を編集</h3>
    <div class="modal-sub">編集したい地名・人物・作品・用語を、名称で絞り込むか、下の一覧から選んでください。</div>
    <div class="field"><input type="text" id="ees-query" placeholder="名称で絞り込み" autocomplete="off" value="${escapeAttr(eesLastQuery)}"></div>
    <div class="ees-browse-list" id="ees-browse"></div>
    <div class="modal-actions"><button class="modal-cancel" id="ees-cancel">キャンセル</button></div>`;
  overlay.classList.add('open');
  const eesQuery = document.getElementById('ees-query');
  const eesBrowse = document.getElementById('ees-browse');
  function renderEesBrowse(rawQuery){
    const q = rawQuery.trim();
    const groups = {place:[], person:[], work:[], 'work-pastiche':[], term:[]};
    Object.keys(DATA).forEach(id=>{
      const e = DATA[id];
      if(q && !fuzzyMatch(e.name, q)) return;
      if(e.type==='work'){ (e.canon ? groups.work : groups['work-pastiche']).push(id); }
      else groups[e.type].push(id);
    });
    Object.values(groups).forEach(arr=>arr.sort((a,b)=>DATA[a].name.localeCompare(DATA[b].name,'ja')));
    const totalMatches = Object.values(groups).reduce((a,arr)=>a+arr.length, 0);
    let html = '';
    if(q && totalMatches===0){
      html = `<div class="ees-empty">「${escapeHtml(q)}」に一致する項目が見つかりませんでした。</div>`;
    } else {
      ['place','person','work','work-pastiche','term'].forEach(t=>{
        if(groups[t].length===0) return;
        const open = q ? true : eesOpenGroups.has(t);
        html += `<div class="ees-group">
          <button type="button" class="ees-group-header" data-eesg="${t}" aria-expanded="${open?'true':'false'}"><span class="ees-arrow">${open?'▾':'▸'}</span>${eesLabels[t]}<span class="ees-count">${groups[t].length}</span></button>
          <div class="ees-group-items" style="display:${open?'block':'none'}">`;
        groups[t].forEach(id=>{
          html += `<button type="button" class="ees-item" data-eesid="${id}">${escapeHtml(DATA[id].name)}</button>`;
        });
        html += `</div></div>`;
      });
    }
    eesBrowse.innerHTML = html;
    eesBrowse.querySelectorAll('[data-eesg]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const g = btn.dataset.eesg;
        if(eesOpenGroups.has(g)) eesOpenGroups.delete(g); else eesOpenGroups.add(g);
        renderEesBrowse(eesQuery.value);
      });
    });
    eesBrowse.querySelectorAll('[data-eesid]').forEach(btn=>{
      btn.addEventListener('click', ()=>openEditModal(btn.dataset.eesid, {onBack: openEditEntitySearchModal}));
    });
  }
  eesQuery.addEventListener('input', ()=>{ eesLastQuery = eesQuery.value; renderEesBrowse(eesLastQuery); });
  renderEesBrowse(eesLastQuery);
  eesQuery.focus();
  document.getElementById('ees-cancel').addEventListener('click', closeModal);
}

        <option value="peripheral" ${e.relevance==='peripheral'?'selected':''}>周辺情報（伝記的・ファン向けなど）</option>
        <option value="misc" ${e.relevance==='misc'?'selected':''}>その他（ホームズと直結しないが集めたい情報）</option>
      </select>

    <div class="field"><label>関連付ける項目</label><div class="checklist">${relatedChecklist(targetId, e.related||[])}</div></div>

  overlay.classList.add('open');

  const editEntityDraftFields = ['f-name','f-desc','f-image','f-image-credit','f-image-license','f-image-source'].concat(e.type==='place' ? ['f-lat','f-lng','f-relevance'] : []);
  // ★以前は「下書きが残っています［復元する／破棄する］」というバナーを出して

  // あくまでこの編集フォームの入力欄だけを、前回の一時保存の状態に戻すだけ）。
  const editEntityDraft = loadDraft('editEntity', targetId);
  if(editEntityDraft){
    applyDraftFields(editEntityDraft.data, editEntityDraftFields);
  }
  wireDraftAutosave('editEntity', targetId, editEntityDraftFields);
  if(e.type==='place'){

    if(isReviewer()){
      overrides[targetId] = Object.assign(overrides[targetId] || {}, draft);
      await rpcObjMerge('p-overrides', targetId, draft);
      DATA = buildData(); renderMarkers(); renderIndex(); populateViewFilterMenu();
      clearDraft('editEntity', targetId);
      closeModal(); showToast('保存しました。');

      clearDraft('editEntity', targetId);
      closeModal(); showToast('編集案を送信しました。審査担当者の確認後に反映されます。');
    }

function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function csvEscape(v){
  if(v===null || v===undefined) return '';
  const s = String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function exportAsJSON(){
  const out = {};
  Object.keys(DATA).forEach(id=>{ out[id] = {id, ...DATA[id]}; });
  downloadFile('holmes-atlas-data.json', JSON.stringify(out, null, 2), 'application/json');
}
function exportAsCSV(){
  const headers = ['id','type','name','desc','lat','lng','canon_or_pastiche','relevance','related'];
  const rows = [headers.join(',')];
  Object.keys(DATA).forEach(id=>{
    const e = DATA[id];
    const row = [
      id, e.type, e.name, e.desc,
      e.coords ? e.coords[0] : '', e.coords ? e.coords[1] : '',
      e.type==='work' ? (e.canon ? '正典' : '正典外') : '',
      e.type==='place' ? (e.relevance || 'core') : '',
      (e.related||[]).join(';')
    ].map(csvEscape);
    rows.push(row.join(','));
  });
  downloadFile('holmes-atlas-data.csv', '\uFEFF' + rows.join('\r\n'), 'text/csv;charset=utf-8;');
}

function timeAgoText(ts){
  const diffMin = Math.round((Date.now() - ts) / 60000);
  if(diffMin < 1) return 'たった今';
  if(diffMin < 60) return `${diffMin}分前`;
  const diffH = Math.round(diffMin / 60);
  if(diffH < 24) return `${diffH}時間前`;
  const diffD = Math.round(diffH / 24);
  if(diffD < 30) return `${diffD}日前`;
  return fmtDate(ts);
}

// ---------- 編集一覧（自分の投稿・下書きの一覧） ----------
// 「すでに送信した提案」と「まだ送信していない下書き（この端末のlocalStorageのみ）」を
// まとめて見られる、一般会員向けの一覧。審査ダッシュボード（openReviewDashboard）とは
// 違い、他人の投稿は見えず、承認・却下のような審査担当者専用の操作も一切出さない
// （うっかり一般会員に承認ボタンを見せてしまうと事故のもとになるため、あえて
// renderProposalCardは使い回さず、読み取り専用の別関数として分けている）。
const DRAFT_KEY_PREFIX = 'holmes-atlas-draft:';
function myDraftEntries(){
  const uid = currentUser ? currentUser.id : 'anon';
  const prefix = DRAFT_KEY_PREFIX + uid + ':';
  let keys;
  try{
    if(localStorage.getItem(draftIndexKey(uid)) === null){
      // 索引がまだ存在しない場合（この索引方式を導入する前から下書きがある会員、
      // など）に限り、最初の1回だけ従来通りlocalStorage全体を走査して索引を
      // 作り直す。以降はsaveDraft/clearDraftが索引を保守するので、この全件走査は
      // 二度と発生しない。
      keys = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(prefix)) keys.push(k);
      }
      writeDraftIndex(uid, keys);
    } else {
      keys = readDraftIndex(uid);
    }
  }catch(e){ keys = []; }
  const out = [];
  keys.forEach(key=>{
    if(!key || !key.startsWith(prefix)) return; // 別会員分など、万一紛れ込んだキーは無視
    const rest = key.slice(prefix.length); // "<formType>:<id>"
    const sepIdx = rest.indexOf(':');
    if(sepIdx<0) return;
    const formType = rest.slice(0, sepIdx);
    const id = rest.slice(sepIdx+1);
    let parsed;
    try{ parsed = JSON.parse(localStorage.getItem(key)); }catch(e){ return; }
    if(!parsed || !parsed.data) return;
    out.push({formType, id, data:parsed.data, savedAt:parsed.savedAt||0, key});
  });
  out.sort((a,b)=>b.savedAt-a.savedAt);
  return out;
}
function draftDisplayInfo(entry){
  const savedAgo = Math.max(1, Math.round((Date.now() - entry.savedAt) / 60000));
  const savedAgoText = savedAgo < 60 ? `${savedAgo}分前` : `${Math.round(savedAgo/60)}時間前`;
  if(entry.formType === 'newEntity'){
    return { kindLabel:'新規追加', name: entry.data['f-name'] || '（名称未入力）', savedAgoText, canContinue:true };
  }
  if(entry.formType === 'editEntity'){
    const target = DATA[entry.id];
    return { kindLabel:'編集', name: target ? target.name : `（削除済みの項目：${entry.id}）`, savedAgoText, canContinue: !!target };
  }
  if(entry.formType === 'journal'){
    const isNote = entry.id !== 'new' && DATA[entry.id] && DATA[entry.id].type !== 'place';
    return { kindLabel: isNote ? '感想' : '訪問記録', name: entry.data['j-name'] || '（名称未入力）', savedAgoText, canContinue:true };
  }
  return { kindLabel: entry.formType, name: entry.id, savedAgoText, canContinue:false };
}
function continueDraft(entry){
  if(entry.formType === 'newEntity'){ openEntityModal(); return; }
  if(entry.formType === 'editEntity'){ if(DATA[entry.id]) openEditModal(entry.id); return; }
  if(entry.formType === 'journal'){ openJournalModal(entry.id !== 'new' ? {entityId: entry.id} : {}); return; }
}
function renderMyDraftRow(entry){
  const info = draftDisplayInfo(entry);
  return `<div class="my-draft-row" data-draft-row="${escapeAttr(entry.key)}">

}

function openMyEditsModal(){
  const drafts = myDraftEntries();
  const myProposals = proposals.filter(p=>p.authorId===currentUser.id).sort((a,b)=>b.createdAt-a.createdAt);
  modalBody.innerHTML = `
    <h3>編集一覧</h3>

  overlay.classList.add('open');

  document.querySelectorAll('#my-drafts-list [data-draft-continue]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const entry = drafts.find(d=>d.key===btn.dataset.draftContinue);
      if(entry) continueDraft(entry);
    });
  });
  // 下書きの削除は二重確認方式にする：1回目のクリックでは消さず、ボタンを
  // 「本当に削除？」という横長の赤いボタンに一旦差し替えるだけにする。その状態の
  // 間にもう一度押した時だけ実際に削除する（誤タップ防止）。4秒以内に押されなければ、
  // 元の🗑アイコンに自動的に戻る。
  document.querySelectorAll('#my-drafts-list [data-draft-discard]').forEach(btn=>{
    let revertTimer = null;
    btn.addEventListener('click', ()=>{
      if(!btn.classList.contains('confirming')){
        btn.classList.add('confirming');
        btn.textContent = '本当に削除？';
        revertTimer = setTimeout(()=>{
          btn.classList.remove('confirming');
          btn.textContent = '🗑';
        }, 4000);
        return;
      }
      clearTimeout(revertTimer);
      const entry = drafts.find(d=>d.key===btn.dataset.draftDiscard);
      if(entry) clearDraft(entry.formType, entry.id);
      btn.closest('.my-draft-row')?.remove();
      showToast('下書きを削除しました。');
      const list = document.getElementById('my-drafts-list');
      if(list && !list.querySelector('.my-draft-row')){
        list.innerHTML = '<div class="alias-list-empty">編集中の下書きはありません。</div>';
      }
    });
  });
}

const REVIEW_HISTORY_LIMIT = 50;
function openReviewDashboard(){
  const pending = proposals.filter(p=>p.status==='pending').sort((a,b)=>a.createdAt-b.createdAt);
  const pendingReports = reports.filter(r=>r.status==='pending').sort((a,b)=>a.createdAt-b.createdAt);
  const history = proposals.filter(p=>p.status==='approved' || p.status==='rejected')
    .sort((a,b)=>(b.resolvedAt||b.createdAt)-(a.resolvedAt||a.createdAt))
    .slice(0, REVIEW_HISTORY_LIMIT);
  modalBody.innerHTML = `
    <h3>審査ダッシュボード</h3>
    <div class="modal-sub">${pending.length}件の提案、${pendingReports.length}件の通報があります。</div>
    <div class="review-section-label">提案</div>
    <div class="review-list">
      ${pending.length===0 ? '<div class="alias-list-empty">今のところ提案はありません。</div>' : pending.map(p=>renderProposalCard(p)).join('')}
    </div>
    <div class="review-section-label">通報</div>
    <div class="review-list">
      ${pendingReports.length===0 ? '<div class="alias-list-empty">今のところ通報はありません。</div>' : pendingReports.map(r=>renderReportCard(r)).join('')}
    </div>
    <div class="review-section-label">承認・却下履歴（直近${REVIEW_HISTORY_LIMIT}件）</div>
    <div class="review-list">
      ${history.length===0 ? '<div class="alias-list-empty">まだ履歴はありません。</div>' : history.map(p=>renderHistoryCard(p)).join('')}
    </div>
    <div class="modal-actions"><button class="modal-cancel" id="review-close">閉じる</button></div>`;
  overlay.classList.add('open');
  document.getElementById('review-close').addEventListener('click', closeModal);
  pendingReports.forEach(r=>{
    document.getElementById('report-delete-'+r.id)?.addEventListener('click', ()=>resolveReport(r.id, true));
    document.getElementById('report-dismiss-'+r.id)?.addEventListener('click', ()=>resolveReport(r.id, false));
    const j = journal.find(x=>x.id===r.journalId);
    if(j) document.getElementById('report-ban-'+r.id)?.addEventListener('click', ()=>banUser(j.authorId, j.authorName));
  });
  pending.forEach(p=>{
    document.getElementById('approve-'+p.id)?.addEventListener('click', ()=>approveProposal(p.id));

  });
  modalBody.querySelectorAll('[data-history-goto]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const targetId = btn.dataset.historyGoto;
      closeModal();
      showEntity(targetId);
    });
  });

    <div class="proposal-actions">

}
async function approveProposal(propId){
  const p = proposals.find(x=>x.id===propId);
  if(!p) return;
  if(p.kind==='alias'){
    customAliases[p.draft.key] = p.draft.en;
    await rpcObjSet('p-aliases', p.draft.key, p.draft.en);
  } else if(p.kind==='new'){
    const newId = 'u-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    additions[newId] = p.draft;
    await rpcObjMerge('p-additions', newId, p.draft);
    (p.draft.related||[]).forEach(relId=>{
      overrides[relId] = overrides[relId] || {};
      const extra = new Set(overrides[relId].extraRelated||[]);
      extra.add(newId);
      overrides[relId].extraRelated = Array.from(extra);
    });
    await Promise.all((p.draft.related||[]).map(relId=>rpcObjNestedArrayAddUnique('p-overrides', relId, 'extraRelated', newId)));
    p.newEntityId = newId;
  } else if(p.kind==='photo'){
    overrides[p.targetId] = overrides[p.targetId] || {};
    overrides[p.targetId].extraPhotos = overrides[p.targetId].extraPhotos || [];
    overrides[p.targetId].extraPhotos.push(p.draft);
    await rpcObjNestedArrayAppend('p-overrides', p.targetId, 'extraPhotos', p.draft);
  } else {
    overrides[p.targetId] = Object.assign(overrides[p.targetId] || {}, p.draft);
    await rpcObjMerge('p-overrides', p.targetId, p.draft);
  }
  p.status = 'approved';
  p.resolvedAt = Date.now();
  // 履歴（審査ダッシュボードの「承認・却下履歴」）から項目ページへ飛べるように、
  // 承認日時と、新規追加の場合は生成したentityIdもp-proposals側に残しておく。
  const approvePatch = {status:'approved', resolvedAt:p.resolvedAt};
  if(p.kind==='new') approvePatch.newEntityId = p.newEntityId;
  await rpcArrPatch('p-proposals', propId, approvePatch);
  DATA = buildData(); renderMarkers(); renderIndex(); populateViewFilterMenu();
  showToast('承認しました。');
  updateReviewCountBadge();
  updateMyEditsCountBadge();
  renderRecentUpdates();
  openReviewDashboard();
}
async function rejectProposal(propId){
  const p = proposals.find(x=>x.id===propId);
  if(!p) return;
  p.status = 'rejected';
  p.resolvedAt = Date.now();
  await rpcArrPatch('p-proposals', propId, {status:'rejected', resolvedAt:p.resolvedAt});
  showToast('却下しました。');
  updateReviewCountBadge();
  updateMyEditsCountBadge();
  openReviewDashboard();
}

async function deleteEntity(targetId){
  if(additions[targetId]){
    delete additions[targetId];
    await rpcObjDelete('p-additions', targetId);
  } else {
    overrides[targetId] = overrides[targetId] || {};
    overrides[targetId].deleted = true;
    await rpcObjMerge('p-overrides', targetId, {deleted:true});
  }
  // ここだけは複数のリスト・複数のメモを一度にまたいで変更する一括クリーンアップ
  // （項目が完全に削除された時、それを含んでいた全リスト・全メモから同時に外す）なので、
  // 「1件だけ」を前提にしたRPCでは表現できない。レビュアーによる項目削除自体が
  // 頻繁な操作ではないため、ここは従来通りsafeSet（丸ごと上書き）のままにしてある。
  favoriteLists.forEach(l=>{ l.entityIds = l.entityIds.filter(x=>x!==targetId); });
  await safeSet(favoritesKey(), favoriteLists);
  privateNotes = privateNotes.filter(n=>n.entityId!==targetId);
  await safeSet(privateNotesKey(), privateNotes);
  DATA = buildData();
  renderMarkers(); renderIndex(); populateViewFilterMenu();
  panel.classList.remove('open');
  showToast('項目を削除しました。');
}

// ⠿ハンドルを掴んでのドラッグ並べ替え（マウス・タッチどちらもPointer Eventsで
// 統一的に扱う）。移動中はpointermoveのたびに、指/カーソルの位置と他の行の
// 中間点を比較して、ドラッグ中の行をDOM上で挿入し直す（差分更新ではなく毎回
// 作り直す方式にすることで、複雑な入れ替えロジックによるバグを避けている）。
// 離した時点のDOM順がそのまま新しい並び順になる。
// ★注意：pointermove/pointerupはhandle.setPointerCapture()で掴んだ要素自身に
// 付けるのではなく、documentに付けている。ドラッグ中にinsertBefore/appendChildで
// DOM上の位置を動かす行の"内部"にhandleがあるため、もしhandle自身にポインタ
// キャプチャを持たせると、その行を動かした瞬間（ブラウザ内部では一旦切り離して
// 再接続する扱いになる）にキャプチャが暗黙的に外れてしまい、2回目以降の
// pointermove／pointerupが届かなくなる（＝1回動かしただけでドラッグが
// 効かなくなる）不具合が実際に発生した。documentに付けておけばこの問題を避けられる。
function wireFavoriteListDragReorder(listEl, onReorder){
  if(!listEl) return;
  listEl.querySelectorAll('.fle-drag-handle').forEach(handle=>{
    handle.addEventListener('pointerdown', (ev)=>{
      ev.preventDefault();
      const row = handle.closest('.fle-row');
      if(!row) return;
      row.classList.add('fle-row-dragging');
      const pointerId = ev.pointerId;
      const onMove = (ev2)=>{
        if(ev2.pointerId !== pointerId) return;
        const others = Array.from(listEl.querySelectorAll('.fle-row')).filter(r=>r!==row);
        const y = ev2.clientY;
        let target = null;
        for(const r of others){
          const rect = r.getBoundingClientRect();
          if(y < rect.top + rect.height/2){ target = r; break; }
        }
        if(target) listEl.insertBefore(row, target);
        else listEl.appendChild(row);
      };
      const onUp = (ev2)=>{
        if(ev2.pointerId !== pointerId) return;
        row.classList.remove('fle-row-dragging');
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);
        const newOrder = Array.from(listEl.querySelectorAll('.fle-row')).map(r=>r.dataset.fleRow);
        onReorder(newOrder);
      };
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  });
}
// お気に入りリストそのものを編集するモーダル（索引の★お気に入り内、各フォルダの

function openFavoriteListEditModal(listId){
  const list = favoriteLists.find(l=>l.id===listId);
  if(!list) return;
  // ×ボタンでの即削除は、誤タップした時に戻す手段がなく怖いという声があったため、

  // （1）チェックを外してもその場で項目自体は消えず、間違えたらすぐ再チェックして
  // 元に戻せる、（2）見た目も「削除」ではなく「チェックのon/off」なので、誤操作の
  // 心理的なハードルが下がる、という2点を狙っている。
  // 並び順はGoogleマップのルート表示（🧭ボタン）で出発地→目的地の順番として
  // そのまま使われるため、ここでは名前順に並べ替えず、リストに入っている順番
  // （＝ドラッグで並べ替えた順番）をそのまま表示する。
  const itemsHtml = () => {
    const items = list.entityIds.map(id=>({id, e:DATA[id]})).filter(x=>x.e);

    return items.map(({id,e})=>`<div class="fle-row" data-fle-row="${id}">

      <label class="fle-row-label"><input type="checkbox" data-fle-item="${id}" checked> <span class="dot dot-${entityClass(e)}"></span>${escapeHtml(e.name)}<span class="fav-list-count">（${entityLabel(e)}）</span></label>
    </div>`).join('');
  };
  modalBody.innerHTML = `
    <h3>リストを編集</h3>
    <div class="modal-sub">名前の変更や、入っている項目の追加・削除ができます。チェックを外すとリストから外れます（間違えたらそのまま再チェックすれば元に戻せます）。⠿を掴んでドラッグすると順番を変えられます。この順番がGoogleマップのルート表示（出発地→目的地）にそのまま使われます。</div>
    <div class="field">
      <label>リスト名</label>
      <input type="text" id="fle-name-input" value="${escapeAttr(list.name)}">
    </div>
    <div class="field">
      <label>項目を追加</label>
      <input type="text" id="fle-add-input" placeholder="地名・人物・作品などを検索" autocomplete="off">
      <div class="map-search-results" id="fle-add-results"></div>
    </div>
    <div class="field">
      <label>入っている項目（<span id="fle-item-count">${list.entityIds.length}</span>件）</label>
      <div class="checklist" id="fle-item-list" style="max-height:240px;">${itemsHtml()}</div>
    </div>
    <div class="modal-actions"><button class="modal-cancel" id="fle-close-btn">確定</button></div>`;
  overlay.classList.add('open');
  document.getElementById('fle-close-btn').addEventListener('click', closeModal);
  wireFavoriteListDragReorder(document.getElementById('fle-item-list'), async (newOrder)=>{
    list.entityIds = newOrder;
    // 並べ替えはentityIds全体の順番を丸ごと置き換える操作なので、そのリスト1件分の
    // entityIdsフィールドだけをpatchする（他のリストには触れない）。
    await rpcArrPatch(favoritesKey(), listId, {entityIds: newOrder});
    renderIndex();
    if(favListFilter === listId) renderMarkers();
  });

  const nameInput = document.getElementById('fle-name-input');
  const commitName = async ()=>{
    const newName = nameInput.value.trim();
    if(newName && newName !== list.name){
      list.name = newName;
      await rpcArrPatch(favoritesKey(), listId, {name: newName});
      if(favListFilter === listId) setFavFilterLabel(newName, true);
      renderIndex();
    } else {
      nameInput.value = list.name; // 空欄のまま外した場合などは、元の名前に戻す
    }
  };
  nameInput.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter'){ ev.preventDefault(); nameInput.blur(); } });
  nameInput.addEventListener('blur', commitName);

  // ★チェックの変更時は、あえてモーダル全体を作り直さない。作り直してしまうと
  // 外した項目がチェックリストから消えてしまい、「間違えたらすぐ再チェックして
  // 戻す」ということができなくなるため。件数表示だけその場で更新する。
  document.querySelectorAll('#fle-item-list [data-fle-item]').forEach(cb=>{
    cb.addEventListener('change', async ()=>{
      const id = cb.dataset.fleItem;
      if(cb.checked){ if(!list.entityIds.includes(id)) list.entityIds.push(id); }
      else { list.entityIds = list.entityIds.filter(x=>x!==id); }
      await rpcArrToggleMember(favoritesKey(), listId, 'entityIds', id);

      if(countEl) countEl.textContent = list.entityIds.length;
      renderIndex();
      if(favListFilter === listId) renderMarkers();
    });
  });

  const addInput = document.getElementById('fle-add-input');
  const addResults = document.getElementById('fle-add-results');
  // DATA全件を対象にしたfuzzyMatch走査＋結果DOMの再構築は、地図検索・索引の
  // 絞り込み欄と同じくキー入力のたびに実行するとタイプ中のカクつきに
  // つながるため、同じ共通ヘルパーで軽くデバウンスする。
  const runAddSearch = debounce((q)=>{
    const matchIds = Object.keys(DATA)
      .filter(id=>!list.entityIds.includes(id) && fuzzyMatch(DATA[id].name, q))
      .slice(0, 8);
    if(matchIds.length===0){
      addResults.innerHTML = `<div class="map-search-section" style="background:none;">見つかりませんでした</div>`;
      addResults.classList.add('show');

    addResults.innerHTML = matchIds.map(id=>`<button type="button" class="map-search-item" data-fle-add="${id}"><span class="dot dot-${entityClass(DATA[id])}"></span>${escapeHtml(DATA[id].name)}<span class="msi-sub">${entityLabel(DATA[id])}</span></button>`).join('');
    addResults.classList.add('show');
    addResults.querySelectorAll('[data-fle-add]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.fleAdd;
        if(!list.entityIds.includes(id)) list.entityIds.push(id);
        // 検索結果は元々「まだこのリストに入っていない項目」だけに絞ってあるので、
        // 単純追加（atlas_arr_nested_append）でよい（重複を心配してtoggleにすると、
        // もし他の端末で既に追加済みだった場合に誤って外してしまう）。
        await rpcArrNestedAppend(favoritesKey(), listId, 'entityIds', id);
        renderIndex();
        if(favListFilter === listId) renderMarkers();
        openFavoriteListEditModal(listId);
      });
    });
  }, 100);
  addInput.addEventListener('input', ()=>{

    const runJournalLocalGeoSearch = debounce((q)=>{

    jGeoQuery.addEventListener('input', ()=>{

  document.getElementById('j-cancel').addEventListener('click', closeModal);
  document.getElementById('j-save-draft').addEventListener('click', ()=>{

  document.getElementById('j-submit').addEventListener('click', async ()=>{

    const record = {
      id: 'j-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),

      createdAt: Date.now(),

      likedBy: [], replies: []
    };
    if(visibility === 'private'){
      const isFirstEverNote = privateNotes.length === 0; // p-notes:<userId>の行自体がまだ無い可能性がある
      privateNotes.push(record);
      // 2件目以降は「配列に1件追加するだけ」の原子的操作で済むが、本当に最初の1件目だけは
      // 行自体がまだ存在しない可能性があるため、行の新規作成も行うsafeSet（upsert）を使う。
      if(isFirstEverNote) await safeSet(privateNotesKey(), privateNotes);
      else await rpcArrAppend(privateNotesKey(), record);
    } else {
      journal.push(record);
      await rpcArrAppendLimited('p-journal', record);
    }
    clearDraft('journal', journalDraftId);
    closeModal(); showToast('保存しました。');
    renderJournalMarkers();
    if(prefill.entityId) showEntity(prefill.entityId, {fromTrail:true});
    else if(coords) flyToNav(coords, zoomForCoords(coords,null), {duration:0.7});
  });
}

async function deleteJournal(id){
  const inPublic = journal.find(x=>x.id===id);
  if(inPublic){
    if(!currentUser || (currentUser.id !== inPublic.authorId && !isReviewer())){ showToast('この投稿を削除する権限がありません。'); return; }
    if(!confirm('この記録を削除します。よろしいですか？')) return;
    journal = journal.filter(x=>x.id!==id);
    await rpcArrRemove('p-journal', id);
    showToast('削除しました。');
    refreshJournalViews();
    return;
  }
  const inPrivate = privateNotes.find(x=>x.id===id);
  if(!inPrivate) return;
  if(!currentUser || currentUser.id !== inPrivate.authorId){ showToast('この投稿を削除する権限がありません。'); return; }
  if(!confirm('この記録を削除します。よろしいですか？')) return;
  privateNotes = privateNotes.filter(x=>x.id!==id);
  await rpcArrRemove(privateNotesKey(), id);
  showToast('削除しました。');
  refreshJournalViews();
}
async function toggleJournalLike(id){
  if(!currentUser){ showToast('いいねにはログインが必要です。'); return; }

  if(!j) return;
  j.likedBy = j.likedBy || [];
  const idx = j.likedBy.indexOf(currentUser.id);
  if(idx>=0) j.likedBy.splice(idx,1); else j.likedBy.push(currentUser.id);
  await rpcArrToggleMember('p-journal', id, 'likedBy', currentUser.id);
  refreshJournalViews();
}

  j.replies = j.replies || [];

const mapSearchInput = document.getElementById('mapSearchInput');

let externalMarker = null;
function normalizeSearchStr(s){
  return s.toLowerCase().replace(/[・･\s\-—–_,、。]/g,'');
}
function fuzzyMatch(target, query){
  const t = normalizeSearchStr(target), q = normalizeSearchStr(query);
  if(!q) return false;
  if(t.includes(q)) return true;
  if(q.length < 2) return false;
  let ti=0, matched=0;
  for(const ch of q){
    const idx = t.indexOf(ch, ti);
    if(idx>=0){ matched++; ti = idx+1; }
  }
  return (matched / q.length) >= 0.7;
}
function localMatches(q){
  return Object.keys(DATA).filter(id=>fuzzyMatch(DATA[id].name, q)).slice(0,6);
}
// 訪問記録の「位置を検索する」など、座標が必要な場面専用。地点（place）かつ
// 座標を持つ項目だけに絞ったlocalMatches。
function localPlaceMatches(q){
  return Object.keys(DATA).filter(id=>DATA[id].type==='place' && DATA[id].coords && fuzzyMatch(DATA[id].name, q)).slice(0,6);
}

function zoomForSearchResult(r){
  const types = r.placeType || [];
  if(types.includes('country')) return 5;
  if(types.includes('region') || types.includes('subregion') || types.includes('county')) return 7;
  if(types.includes('place')) return 10;
  if(types.includes('postal_code') || types.includes('locality') || types.includes('neighborhood') || types.includes('district') || types.includes('municipal_district')) return 13;
  if(types.includes('address') || types.includes('street') || types.includes('poi') || types.includes('poi.landmark')) return 16;
  // place_typeが取れない場合は、表記の細かさ（カンマ区切りの数）から推定
  const parts = (r.display_name||'').split(/,|、/).map(s=>s.trim()).filter(Boolean);
  if(parts.length <= 1) return 6;
  if(parts.length === 2) return 9;
  return 15;
}

let searchDebounce;
// 検索結果から項目を選んで地図を移動させた後も、その直前に予約されていた
// 外部ジオコーディングの遅延実行（searchDebounce）やローカル検索の
// デバウンス（runLocalMapSearch）が消えずに残っていると、数百ms後に
// 古い検索結果が勝手に再描画され、閉じたはずの候補一覧が地図の上に
// 再度浮かんでくる不具合になる。結果を選んで閉じる箇所では必ずこれを呼び、
// 予約済みの再描画を握りつぶす。
function cancelPendingMapSearch(){
  clearTimeout(searchDebounce);

}

  // 前のアカウントの検索履歴が見えないように）。未ログイン時は共通の匿名枠を使う。
  return 'holmes-atlas-recent-searches:' + (currentUser ? currentUser.id : 'anon');

function getRecentSearches(){

// 同じ考え方で軽くデバウンスしてから描画する（外部ジオコーディングの方は

// ---------- 現在地から近い場所（＋歩いている向きの表示） ----------
// ボタンを押すたびに「追跡開始／終了」をトグルする。開始中は位置情報を継続取得し
// (watchPosition)、端末のコンパスセンサーが使えれば、現在地マーカーに向きを示す
// 三角のコーンを重ねて回転させる。精度は端末・ブラウザ次第でまちまちなので、
// コンパスが取れない場合は普通の点だけを表示する（無理に何かを取り繕わない）。
const locateMapBtn = document.getElementById('locateMapBtn');
const nearbyPanel = document.getElementById('nearbyPanel');
let userLocationMarker = null;
let geoWatchId = null;
let headingHandlerAttached = false;
let hasCenteredOnFirstFix = false;
function formatDist(km){ return km<1 ? Math.round(km*1000)+'m' : km.toFixed(1)+'km'; }

// iOS Safari 13+は、向きセンサーの利用に明示的なユーザー許可（ボタン等の操作直後のみ
// 呼び出し可能）が必要。それ以外の環境ではこの許可自体が存在しないので素通りする。
async function ensureOrientationPermission(){
  if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
    try{
      const result = await DeviceOrientationEvent.requestPermission();
      return result === 'granted';
    }catch(e){ return false; }
  }
  return true;
}

// ブラウザ・端末によって向き（コンパス方位）の取り方がバラバラなので、分かる範囲で
// 正規化する。どれも使えない場合はnullを返し、呼び出し側は「向きは表示しない」を選ぶ。
function normalizeHeadingFromEvent(event){
  if(typeof event.webkitCompassHeading === 'number' && !isNaN(event.webkitCompassHeading)){
    return event.webkitCompassHeading; // iOS Safari独自：北を0とする真方位に近い値
  }
  if(event.absolute && typeof event.alpha === 'number'){
    return (360 - event.alpha) % 360; // 一部のAndroid/Chrome。端末によっては精度が粗い
  }
  return null;
}

function handleOrientation(event){
  const heading = normalizeHeadingFromEvent(event);
  if(heading===null || !userLocationMarker) return;
  const el = userLocationMarker.getElement();
  if(!el) return;
  const rotateEl = el.querySelector('.ulm-rotate');
  if(rotateEl) rotateEl.style.transform = 'rotate(' + heading + 'deg)';
  el.classList.add('has-heading');
}

function stopLocationTracking(silent){
  if(geoWatchId !== null){ navigator.geolocation.clearWatch(geoWatchId); geoWatchId = null; }
  if(headingHandlerAttached){
    window.removeEventListener('deviceorientationabsolute', handleOrientation);
    window.removeEventListener('deviceorientation', handleOrientation);
    headingHandlerAttached = false;
  }
  if(userLocationMarker){ map.removeLayer(userLocationMarker); userLocationMarker = null; }
  locateMapBtn.classList.remove('active');
  locateMapBtn.setAttribute('title', '現在地から探す');
  locateMapBtn.setAttribute('aria-label', '現在地から近い場所を探す');
  hasCenteredOnFirstFix = false;
  if(!silent) showToast('現在地の追跡を終了しました。');
}

function ensureUserLocationMarker(userCoords){
  if(userLocationMarker){ userLocationMarker.setLatLng(userCoords); return; }
  userLocationMarker = L.marker(userCoords, {
    icon: L.divIcon({
      className: 'user-location-marker',
      html: '<div class="ulm-rotate"><div class="ulm-cone-halo"></div><div class="ulm-cone"></div><div class="ulm-dot"></div></div>',
      iconSize: [34,34], iconAnchor: [17,17]
    }),
    zIndexOffset: 1000
  }).addTo(map);
  userLocationMarker.bindTooltip('現在地', {direction:'top', offset:[0,-14]});
}

function handleFirstFix(userCoords){
  panel.classList.remove('open'); timelineEl.classList.remove('open');
  const nearby = Object.keys(DATA).filter(id=>DATA[id].type==='place' && DATA[id].coords)
    .map(id=>({id, dist: haversineKm(userCoords, DATA[id].coords)})).sort((a,b)=>a.dist-b.dist).slice(0,8);
  if(nearby.length===0 || nearby[0].dist>300){
    flyToNav(userCoords, 12, {duration:0.8});
    showToast('現在地の近くに登録済みの場所は見つかりませんでした。');
    nearbyPanel.classList.remove('show');
    return;
  }
  nearbyPanel.innerHTML = `<div class="nearby-panel-head">現在地から近い場所<button type="button" class="nearby-panel-close" id="nearbyPanelClose" title="閉じる" aria-label="近くの場所の一覧を閉じる">×</button></div>
    ${nearby.map(n=>`<button type="button" class="nearby-item" data-id="${n.id}"><span>${escapeHtml(DATA[n.id].name)}</span><span class="ni-dist">${formatDist(n.dist)}</span></button>`).join('')}`;
  nearbyPanel.classList.add('show');
  nearbyPanel.querySelectorAll('[data-id]').forEach(btn=>btn.addEventListener('click', ()=>{ nearbyPanel.classList.remove('show'); showEntity(btn.dataset.id); }));
  document.getElementById('nearbyPanelClose').addEventListener('click', ()=>nearbyPanel.classList.remove('show'));
  flyToNav(userCoords, 11, {duration:0.8});
}

function onLocationUpdate(pos){
  const userCoords = [pos.coords.latitude, pos.coords.longitude];
  ensureUserLocationMarker(userCoords);
  if(!hasCenteredOnFirstFix){
    hasCenteredOnFirstFix = true;
    handleFirstFix(userCoords);
  }
}

locateMapBtn.addEventListener('click', async ()=>{
  if(geoWatchId !== null){ stopLocationTracking(); return; }
  if(!navigator.geolocation){ showToast('お使いのブラウザは位置情報に対応していません。'); return; }
  showToast('現在地を取得しています…');
  const orientationOk = await ensureOrientationPermission();
  if(!orientationOk) showToast('向き（コンパス）の利用が許可されなかったため、位置のみ表示します。');
  window.addEventListener('deviceorientationabsolute', handleOrientation);
  window.addEventListener('deviceorientation', handleOrientation);
  headingHandlerAttached = true;
  locateMapBtn.classList.add('active');
  locateMapBtn.setAttribute('title', '現在地の追跡を終了');
  locateMapBtn.setAttribute('aria-label', '現在地の追跡を終了する');
  geoWatchId = navigator.geolocation.watchPosition(onLocationUpdate, onLocationError, {enableHighAccuracy:true, timeout:10000, maximumAge:5000});
});
function onLocationError(err){
  let msg = '現在地を取得できませんでした。';
  if(err.code===err.PERMISSION_DENIED) msg='位置情報の利用が許可されませんでした。';
  else if(err.code===err.POSITION_UNAVAILABLE) msg='現在地を特定できませんでした。';
  else if(err.code===err.TIMEOUT) msg='タイムアウトしました。';
  if(location.protocol==='file:') msg += '（file://で開いている場合、使えないことがあります）';
  showToast(msg);
  stopLocationTracking(true);
}
document.addEventListener('click', (ev)=>{ if(!ev.target.closest('.nearby-panel') && !ev.target.closest('#locateMapBtn')) nearbyPanel.classList.remove('show'); });

// ---------- 索引トグル・モバイルメニュー ----------
document.getElementById('indexToggle').addEventListener('click', ()=>document.getElementById('index').classList.toggle('open'));
document.getElementById('indexClose').addEventListener('click', ()=>document.getElementById('index').classList.remove('open'));
document.getElementById('guideBtn').addEventListener('click', openUsageGuideModal);

// ---------- 索引の絞り込みボックス ----------
// #indexFilterInput は毎回のrenderIndex()で作り直されない静的な要素なので、
// 1文字打つたびに再描画してもフォーカスが飛ばない（描画対象は#indexScrollのみ）。
{
  const indexFilterInput = document.getElementById('indexFilterInput');
  const indexFilterClearBtn = document.getElementById('indexFilterClearBtn');
  const runIndexFilter = debounce((val)=>{
    indexFilterQuery = val;
    renderIndex();
  }, 120);
  indexFilterInput.addEventListener('input', ()=>{
    indexFilterClearBtn.style.display = indexFilterInput.value ? 'inline-block' : 'none';
    runIndexFilter(indexFilterInput.value);
  });
  indexFilterClearBtn.addEventListener('click', ()=>{
    runIndexFilter.cancel(); // 直前の入力に対するデバウンス待ちが後から発火して上書きしないよう先に止める
    indexFilterInput.value = '';
    indexFilterClearBtn.style.display = 'none';
    indexFilterQuery = '';
    renderIndex();
    indexFilterInput.focus();
  });
}
const actionBtnsEl = document.getElementById('actionBtns');
document.getElementById('menuToggle').addEventListener('click', (ev)=>{ ev.stopPropagation(); actionBtnsEl.classList.toggle('open'); });
actionBtnsEl.querySelectorAll('.hbtn').forEach(btn=>btn.addEventListener('click', ()=>actionBtnsEl.classList.remove('open')));
document.addEventListener('click', (ev)=>{ if(!ev.target.closest('.action-btns') && !ev.target.closest('.menu-toggle')) actionBtnsEl.classList.remove('open'); });

// ---------- 初期化 ----------
(async function init(){
  if(SUPABASE_URL.includes('YOUR_SUPABASE') || SUPABASE_ANON_KEY.includes('YOUR_SUPABASE')){
    showToast('⚠ Supabaseの設定が未入力です。保存機能が動きません。');
  }
  const { data: { session } } = await supabaseClient.auth.getSession();
  currentUser = session?.user || null;
  await loadReviewers();
  renderAuthArea();
  await loadAll();
  DATA = buildData();
  renderMarkers();
  renderJournalMarkers();
  renderIndex();
  populateViewFilterMenu();
  populateFavFilterMenu();
  renderRecentUpdates();
  // renderAuthArea()は上でloadAll()より先に呼んでいるため、その時点ではproposals/reportsが
  // まだ空で、審査バッジ・編集一覧バッジのどちらも0件のまま出てしまっていた。
  // loadAll()完了後にここで数え直す。
  updateReviewCountBadge();
  updateMyEditsCountBadge();
  // URLに ?id=項目ID が付いていれば、その項目の詳細を開いた状態で起動する
  // （SNSなどで共有された個別ページのリンクから直接開けるようにするため）
  const initialEntityId = new URLSearchParams(location.search).get('id');
  if(initialEntityId && DATA[initialEntityId]) showEntity(initialEntityId, {skipUrlUpdate:true});
  // URLに ?journal=記録ID が付いていれば、その訪問記録を開いた状態で起動する
  const initialJournalId = new URLSearchParams(location.search).get('journal');
  if(initialJournalId && journal.find(x=>x.id===initialJournalId)) openJournalDetail(initialJournalId, {skipUrlUpdate:true});
})();
</script>
