    desc:"1805年のトラファルガー海戦の勝利を記念し、1830年代から40年代にかけて整備された広場。中央にそびえるネルソン提督記念柱は1843年完成、高さ約52メートル。台座を守る4頭のブロンズの獅子像は彫刻家エドウィン・ランドシーアの手で1867年に加えられた。すぐ南東の[[charing-cross|チャリング・クロス]]とともに、ロンドンの実質的な中心点として長く案内図の基準に使われてきた広場である。",
    related:["holmes","charing-cross"]},
  "whitehall": {type:"place", name:"ホワイトホール", coords:[51.5033,-0.1276], image:null,
    desc:"ウェストミンスターを南北に貫く官庁街の目抜き通り。この一帯にあった王宮ホワイトホール宮殿（1698年の火災でバンケティング・ハウスを除き焼失）にちなむ地名で、現在は[[foreign-office|英国外務省]]をはじめとする主要官庁が軒を連ねる。国家機密の流出を描く[[naval-treaty-work|『海軍条約文書事件』]]や[[second-stain-work|『第二の汚点』]]など、正典中で「国家の中枢」を象徴する舞台として繰り返し言及される。",
    related:["foreign-office","naval-treaty-work","second-stain-work"]},
  "foreign-office": {type:"place", name:"英国外務省", coords:[51.5029,-0.1281], image:null,
    desc:"1868年、建築家ジョージ・ギルバート・スコットの設計で完成した外務省庁舎。[[naval-treaty-work|『海軍条約文書事件』]]では、ここに勤める外務省員パーシー・フェルプスが、夜遅くに極秘の条約書類を清書していた隙に原本を盗まれてしまう。国家機密の流出という主題は[[second-stain-work|『第二の汚点』]]でも繰り返され、正典における「国家の中枢」のイメージを担う建物である。",
    related:["whitehall","holmes","second-stain-work","naval-treaty-work"]},
  "buckingham-palace": {type:"place", name:"バッキンガム宮殿", coords:[51.5014,-0.1419], image:null,
    photos:[{url:"https://commons.wikimedia.org/wiki/Special:FilePath/Buckingham_Palace_%2816361644386%29.jpg", year:"1900年頃", credit:"E. Wrench & Co.", license:"Public Domain", sourceUrl:"https://commons.wikimedia.org/wiki/File:Buckingham_Palace_%2816361644386%29.jpg"},{url:"https://commons.wikimedia.org/wiki/Special:FilePath/Buckingham_Palace%2C_London_-_April_2009.jpg", year:"2009年", credit:"Diliff", license:"CC BY-SA 3.0", sourceUrl:"https://commons.wikimedia.org/wiki/File:Buckingham_Palace%2C_London_-_April_2009.jpg"}],
    desc:"1703年にバッキンガム公爵の邸宅として建てられ、1761年にジョージ3世が購入。ジョージ4世の代に建築家ジョン・ナッシュの手で宮殿として大規模に改築され、1837年のヴィクトリア女王即位以降、英国君主の公式ロンドン居所となった。[[scandal-in-bohemia|『ボヘミアの醜聞』]]に登場するボヘミア国王のように、正典には身分を明かせぬ高貴な依頼人がしばしば現れるが、彼らはこうした宮殿の主に連なる存在として描かれる。",
    related:["holmes","scandal-in-bohemia"]},
  "westminster-bridge": {type:"place", name:"ウェストミンスター橋とビッグベン", coords:[51.5007,-0.1246], image:null,
    photos:[{url:"https://commons.wikimedia.org/wiki/Special:FilePath/Koetsen_op_Westminster_Bridge_in_Londen_Westminster_Bridge_%28titel_op_object%29%2C_RP-F-F01856-B.jpg", year:"1870〜1900年頃", credit:"Rijksmuseum", license:"CC0", sourceUrl:"https://commons.wikimedia.org/wiki/File:Koetsen_op_Westminster_Bridge_in_Londen_Westminster_Bridge_%28titel_op_object%29%2C_RP-F-F01856-B.jpg"},{url:"https://commons.wikimedia.org/wiki/Special:FilePath/Westminster_Bridge_and_Houses_of_Parliament_London_England_c._1900.jpg", year:"1900年頃", credit:"American Stereoscopic Company", license:"Public Domain", sourceUrl:"https://commons.wikimedia.org/wiki/File:Westminster_Bridge_and_Houses_of_Parliament_London_England_c._1900.jpg"},{url:"https://commons.wikimedia.org/wiki/Special:FilePath/Reflections_on_the_Thames%2C_Westminster_-_Grimshaw%2C_John_Atkinson.jpg", year:"1880年（絵画）", credit:"John Atkinson Grimshaw", license:"Public Domain", sourceUrl:"https://commons.wikimedia.org/wiki/File:Reflections_on_the_Thames%2C_Westminster_-_Grimshaw%2C_John_Atkinson.jpg"},{url:"https://commons.wikimedia.org/wiki/Special:FilePath/London%2C_Palace_of_Westminster_--_2016_--_4800.jpg", year:"2016年", credit:"Dietmar Rabich", license:"CC BY-SA 4.0", sourceUrl:"https://commons.wikimedia.org/wiki/File:London%2C_Palace_of_Westminster_--_2016_--_4800.jpg"}],
    desc:"1862年に架け替えられた現在の橋は、ロンドン橋に次いで2番目に古いテムズ河の橋で、橋桁は国会議事堂の座席と同じ緑色に塗られている。すぐ北にそびえる大時計塔（通称ビッグベン、正式名エリザベス・タワー）は1859年に完成した。[[whitehall|ホワイトホール]]や[[foreign-office|英国外務省]]など、正典で国家機密が絡む事件の舞台となる官庁街のすぐ南に位置する。",
    related:["holmes","whitehall","foreign-office"]},
  "charing-cross": {type:"place", name:"チャリング・クロス", coords:[51.5074,-0.1223], image:null,
    photos:[{url:"https://commons.wikimedia.org/wiki/Special:FilePath/Charing_Cross_Station_-_geograph.org.uk_-_4304382.jpg", year:"2014年", credit:"N Chadwick", license:"CC BY-SA 2.0", sourceUrl:"https://commons.wikimedia.org/wiki/File:Charing_Cross_Station_-_geograph.org.uk_-_4304382.jpg"}],
    desc:"「ロンドンの中心点」とされる交差点。1290年、エドワード1世が王妃エレアノールの柩を弔って各地に建てた記念十字架の最後の一基がこの地にあったことに由来し、現在駅前に立つのは1865年制作の複製である。イギリスでは古くから、ロンドンまでの道路標識の距離はこの地点を基準に記されてきた。1864年開業のチャリング・クロス駅前は、[[watson|ワトスン]]がアフガニスタンから帰還した直後に投宿したという[[watsons-hotel-golden-cross|ゴールデン・クロス・ホテル]]にもほど近く、正典の世界と実在のロンドンが重なる地点のひとつである。",
    related:["holmes","watson","scotland-yard","watsons-hotel-golden-cross"]},
  "sherlock-holmes-pub": {type:"place", relevance:"peripheral", name:"パブ「ザ・シャーロック・ホームズ」", coords:[51.5079,-0.1257], image:null,
    photos:[{url:"https://commons.wikimedia.org/wiki/Special:FilePath/Sherlock_Holmes%2C_Charing_Cross%2C_WC2.jpg", year:"2025年", credit:"Ewan-M", license:"CC BY-SA 4.0", sourceUrl:"https://commons.wikimedia.org/wiki/File:Sherlock_Holmes%2C_Charing_Cross%2C_WC2.jpg"}],
    desc:"もとは「ノーサンバーランド・アームズ」という名のパブだったが、1951年の英国フェスティバル（ブリテン祭）で組まれたホームズ展の目玉だった書斎の再現セットを、閉幕後にそのまま引き取ったのを機に現在の店名へ改称した。2階には暖炉や書物、変装道具まで再現された「[[baker-street|ベーカー街221B]]の居間」がそのまま展示されている。",
    related:["holmes","watson","baker-street"]},
  "lyceum-theatre": {type:"place", name:"ライシーアム劇場", coords:[51.5112,-0.1200], image:null,
    desc:"[[sign-of-four|『四つの署名』]]で、メアリー・モースタンがホームズとワトスンに待ち合わせを指示する場面の舞台。現在の建物は建築家サミュエル・ビーズリーにより1834年に再建されたもので、正面の大きな柱廊玄関が目印。ちょうど正典と同時代、名優ヘンリー・アーヴィングが座長を務めた劇場でもあり、その支配人だったブラム・ストーカーが『ドラキュラ』を書いたのもこの頃である。",
    related:["sign-of-four","holmes","watson"]},
  "covent-garden": {type:"place", name:"コヴェント・ガーデン", coords:[51.5117,-0.1240], image:null,
    photos:[{url:"https://commons.wikimedia.org/wiki/Special:FilePath/London%2C_Covent_Garden_--_2016_--_4878.jpg", year:"2016年", credit:"Dietmar Rabich", license:"CC BY-SA 4.0", sourceUrl:"https://commons.wikimedia.org/wiki/File:London%2C_Covent_Garden_--_2016_--_4878.jpg"}],
    desc:"かつてロンドン随一の青果市場として栄えた界隈。1670年代の勅許以来、青果と花卉を扱う卸売市場としてこの地に約300年立地し、市場機能は1974年にナイン・エルムズへ移された。[[blue-carbuncle-work|『青いガーネット』]]では、クリスマスの夜に見つかった帽子と鵞鳥の持ち主を追う[[holmes|ホームズ]]が、この市場の鵞鳥商ブレッキンリッジを訪ね、賭けを持ちかけて仕入れ先を聞き出す名場面の舞台となった。",
    related:["holmes","blue-carbuncle-work"]},
  "bow-street": {type:"place", name:"ボウ街", coords:[51.5129,-0.1198], image:null,
    desc:"1749年、小説家でもあった治安判事ヘンリー・フィールディングが自ら組織した「ボウ街ランナーズ」の拠点となった通り。私服の捜査官が捜査から逮捕までを担う、ロンドン最初の組織的な警察活動の先駆けとされ、1829年の[[scotland-yard|ロンドン警視庁]]創設後もボウ街警察裁判所として正典の時代を通じて機能し続けた。[[holmes|ホームズ]]が解決した事件の被疑者たちも、法的には最終的にこうした治安判事の裁きを経て裁判に送られたはずである。",
    related:["scotland-yard","holmes"]},
  "british-museum": {type:"place", name:"大英博物館", coords:[51.5194,-0.1270], image:null,
    photos:[{url:"https://commons.wikimedia.org/wiki/Special:FilePath/British_Museum%2C_London%2C_England-LCCN2002696924.jpg", year:"1890〜1900年頃", credit:"Photochrom Print Collection", license:"Public Domain", sourceUrl:"https://commons.wikimedia.org/wiki/File:British_Museum%2C_London%2C_England-LCCN2002696924.jpg"},{url:"https://commons.wikimedia.org/wiki/Special:FilePath/Front_entrance_of_the_British_Museum%2C_London-geograph-3326706.jpg", year:"2013年", credit:"Rob Purvis", license:"CC BY-SA 2.0", sourceUrl:"https://commons.wikimedia.org/wiki/File:Front_entrance_of_the_British_Museum%2C_London-geograph-3326706.jpg"}],
    desc:"1753年、収集家ハンス・スローン卿の遺贈品を基礎に設立された、世界最古の国立公共博物館。現在のブルームズベリーの建物は1823年から約30年かけて建設され、1857年には円形の閲覧室（リーディング・ルーム）が完成した。[[musgrave-ritual|『マスグレーヴ家の儀式』]]によれば、開業したての[[holmes|ホームズ]]はすぐ裏手の[[montague-street|モンタギュー街]]に間借りし、暇な時間はこの閲覧室に通って知識を蓄えていたという。",
    related:["montague-street","holmes","musgrave-ritual"]},
  "montague-street": {type:"place", name:"モンタギュー街", coords:[51.5205,-0.1256], image:null,
    desc:"[[musgrave-ritual|『マスグレーヴ家の儀式』]]で[[holmes|ホームズ]]自身が回想する、探偵業を始めたばかりの頃の住まい。大英博物館の角を曲がってすぐの場所で、暇な時間は同館の閲覧室に通い、捜査に役立ちそうな諸学問を独学していたという。旧友から儀式の謎を持ち込まれたのも、まだこの部屋に暮らしていた時期である。同じ回想で語られる最初期の事件[[gloria-scott-work|『グロリア・スコット号』]]とあわせ、[[baker-street|ベーカー街]]移住前のホームズ像を伝える数少ない記録となっている。",
    related:["british-museum","holmes","musgrave-ritual","gloria-scott-work","baker-street"]},
  "museum-tavern": {type:"place", relevance:"peripheral", name:"パブ「ミュージアム・タヴァーン」", coords:[51.5188,-0.1265], image:null,
    photos:[{url:"https://commons.wikimedia.org/wiki/Special:FilePath/Museum_Tavern%2C_49_Great_Russell_Street_-_geograph.org.uk_-_1156588.jpg", year:"2009年", credit:"Oxyman", license:"CC BY-SA 2.0", sourceUrl:"https://commons.wikimedia.org/wiki/File:Museum_Tavern%2C_49_Great_Russell_Street_-_geograph.org.uk_-_1156588.jpg"}],
    desc:"大英博物館の正面にある実在のパブ。1723年創業と伝わり、博物館の新しい正面玄関が完成した1850年代に現在の店名へ改称されたとされる。閲覧室に通う研究者や物書きの憩いの場としても知られ、『資本論』執筆中のカール・マルクスも常連だったという逸話が残る。[[holmes|ホームズ]]が[[montague-street|モンタギュー街]]に暮らした時期、閲覧室帰りに立ち寄っていても不思議はない立地である。",
    related:["british-museum","holmes","montague-street"]},
  "royal-albert-hall": {type:"place", name:"アルバート・ホール", coords:[51.5009,-0.1773], image:null,
    desc:"1871年、ヴィクトリア女王が早世した夫アルバート公を記念して開館した円形の音楽ホール。設計は工兵隊技師のフランシス・フォークとヘンリー・スコット。すぐ南にはヴィクトリア&アルバート博物館や自然史博物館が並び、19世紀に整備された文化地区「アルバートポリス」の一角をなす。",
    related:["holmes"]},
  "crowborough": {type:"place", relevance:"peripheral", name:"クロウボロ", coords:[51.0524,0.1547], image:null,
    desc:"東サセックスの町。[[conan-doyle|コナン・ドイル]]が1907年に購入し、1930年に世を去るまで暮らした邸宅「ウィンドルシャム」があった地。晩年の代表作『[[his-last-bow-work|最後の挨拶]]』をはじめ、心霊主義への傾倒を深めた時期の著作の多くは、この地の書斎で書かれた。",
    related:["conan-doyle","his-last-bow-work"]},
  "birmingham-stockbrokers-clerk": {type:"place", name:"バーミンガム（コーポレーション街）", coords:[52.4814,-1.8998], image:null,
    desc:"『[[stockbrokers-clerk-work|株式仲買店員]]』で、証券会社員ホール・パイクロフトが好待遇の転職先として紹介される「フランコ・ミッドランド金物会社」の事務所（コーポレーション街126B）が置かれていたとされる街。実際には、ロンドンの証券会社から彼を引き離している間にその名を騙って詐欺を働くための、実体のない架空の会社だった。コーポレーション街は1870年代以降に整備された、バーミンガムを代表するビジネス街である。",
    related:["holmes","watson","stockbrokers-clerk-work"]},
  "croydon-cardboard-box": {type:"place", name:"クロイドン（クロス街）", coords:[51.3722,-0.1058], image:null,
    desc:"『[[cardboard-box-work|ボール箱]]』で、独身の中年女性スーザン・クッシングが暮らしていた地区。ある日、彼女のもとに人間の耳が2つ入った不気味な小包が届いたことから事件が始まる。クロイドンは19世紀後半、鉄道の発達により中流階級のベッドタウンとして急速に発展した、ロンドン南郊の町である。",
    related:["holmes","watson","cardboard-box-work"]},
  "farnham-solitary-cyclist": {type:"place", name:"ファーナム（サリー州）", coords:[51.2145,-0.7996], image:null,
    desc:"『[[solitary-cyclist-work|美しき自転車乗り]]』で、音楽教師ヴァイオレット・スミスが自転車通勤の道すがら、正体不明の男につけ回されるようになる舞台。彼女はファーナム駅から、雇い主の屋敷チャーリントン・ホールまでの道のりを自転車で行き来していた。1885年に「安全型自転車」が発明されて以降、自転車は19世紀末の若い女性にとって新しい自由と機動力の象徴となった。",
    related:["holmes","watson","solitary-cyclist-work"]},
  "forest-row-black-peter": {type:"place", name:"フォレスト・ロウ（サセックス州）", coords:[51.1005,0.0343], image:null,
    desc:"『[[black-peter-work|黒ピーター]]』の舞台。元捕鯨船船長ピーター・キャリーが、母屋とは別に建てた小屋「ウッドマンズ・リー」で銛に胸を刺し貫かれて発見される。粗暴で家族に恐れられていた彼のあだ名「ブラック・ピーター」がそのまま作品名になった。フォレスト・ロウはサセックスの田園地帯にある小さな村で、正典には珍しく荒々しい海の男の過去が持ち込まれる異色の一編の舞台である。",
    related:["holmes","watson","black-peter-work"]},
  "ryder-street-three-garridebs": {type:"place", relevance:"peripheral", name:"ライダー街（セント・ジェームズ）", coords:[51.5062,-0.1394], image:null,
    desc:"『[[three-garridebs-work|三人ガリデブ]]』で、老収集家ネイサン・ガリデブが暮らしていたとされる通り。「あなたと同じ名字の人物があと2人見つかれば大金が手に入る」という荒唐無稽な話を持ちかけられた彼は、正典の中でも屈指のお人好しな依頼人として描かれる。セント・ジェームズはピカデリーとグリーン・パークに挟まれた高級住宅・紳士クラブ街で、独り身の資産家が住むにふさわしい落ち着いた立地である。",
    related:["holmes","watson","three-garridebs-work"]},

  "mycroft-holmes": {type:"person", name:"マイクロフト・ホームズ", image:null,
    desc:"[[holmes|シャーロック]]の7歳年上の兄。弟以上の観察力と推理力を持ちながら実地の捜査には関心を示さず、英国政府の機密に深く関わる要職に就く。私語厳禁の社交倶楽部[[diogenes-club|ディオゲネス・クラブ]]の創設会員の一人で、規則的な生活を好み、自宅と職場とクラブの間しかほとんど移動しない。時に「英国政府そのもの」と評されるほどの存在感を持つ。",
    related:["holmes","pall-mall"]},
  "conan-doyle": {type:"person", name:"アーサー・コナン・ドイル", image:null,
    desc:"1859年5月22日、[[edinburgh|エディンバラ]]生まれ。9歳でイエズス会系の予備校ホッダーに入り、1870年から[[stonyhurst-college|ストーニーハースト・カレッジ]]で5年間学んだのち、語学力を磨くためオーストリアのフェルトキルヒへ1年間留学した。1876年にエディンバラ大学医学部へ進学し、外科医ジョゼフ・ベルに師事する。一目見ただけで患者の職業や経歴を言い当てるベルの観察眼に強く影響を受け、のちのシャーロック・ホームズ像の着想源になったとされる。1881年の卒業後、船医としての航海などを経て[[portsmouth-doyle|ポーツマス]]で開業医となり、患者を待つ合間に書いた『緋色の研究』でホームズを世に送り出した。のちロンドンでも[[conan-doyle-surgery-wimpole|眼科医として開業]]したが長続きせず、次第に作家業へと軸足を移していく。晩年は[[crowborough|クロウバラ]]の邸宅で過ごし、1930年に71歳で死去した。",
    related:["edinburgh","holmes","canon-term","crowborough","portsmouth-doyle","conan-doyle-surgery-wimpole","stonyhurst-college"]},
  "holmes": {type:"person", name:"シャーロック・ホームズ", image:null,
    desc:"鋭い観察眼と演繹的推理によって数々の難事件を解決する私立探偵。[[baker-street|ベーカー街221B]]の下宿に[[watson|ワトスン]]と暮らし、化学実験や変装術のほか、ボクシングや剣術にも通じる異才の持ち主として描かれる。捜査に没頭する快活さと、事件のない時期の気力の落差が激しく、退屈をまぎらわすために薬物に手を伸ばす一面も語られる。宿敵[[moriarty|モリアーティ教授]]との対決の末、[[reichenbach|ライヘンバッハの滝]]で命を落としたかに見えたが、実は生き延びており、後に探偵業へ復帰する。7歳年上の兄[[mycroft-holmes|マイクロフト]]は英国政府の要職にあり、兄弟そろって並外れた観察力・推理力を誇る。晩年は探偵業を退き、田舎で養蜂を営みながら暮らしたと伝えられる。",
    related:["baker-street","st-barts","watson","moriarty","mrs-hudson","study-in-scarlet","hound-baskervilles","final-problem","seven-percent-solution","herlock-sholmes","beekeepers-apprentice","sign-of-four","musgrave-ritual","mycroft-holmes","montague-street","sherlock-holmes-pub","lyceum-theatre","baker-street-station","irene-adler","scandal-in-bohemia","st-johns-wood-briony-lodge","piccadilly-circus"]},
  "watson": {type:"person", name:"ジョン・H・ワトスン医師", image:null,
    desc:"アフガニスタン戦争に軍医として従軍し、マイワンドの戦いで負傷して除隊、療養のためロンドンに戻ったところ、旧知の紹介で[[holmes|ホームズ]]と出会い、[[baker-street|ベーカー街221B]]で同居を始める。医学的な知識に加え、行動力と誠実な人柄からホームズの捜査に欠かせない相棒となった。多くの事件の記録を手記としてまとめ、世に発表した語り手でもある。結婚後もホームズとの親交は変わらず続き、[[hound-baskervilles|『バスカヴィル家の犬』]]では代理として単独でダートムーアへ赴くなど、時に探偵役を任されることもあった。",
    related:["baker-street","st-barts","holmes","study-in-scarlet","hound-baskervilles"]},
  "moriarty": {type:"person", name:"モリアーティ教授", image:null,
    desc:"元大学教授で、若くして『二項定理に関する論文』を著すなど非凡な数学の才を持ちながら、その頭脳を犯罪組織の統率に用いる「犯罪界のナポレオン」。表舞台に立つことはほとんどなく、ロンドンの様々な犯罪の糸を裏で引く黒幕として[[holmes|ホームズ]]に恐れられた。両者の対決は[[final-problem|『最後の事件』]]で頂点を迎え、[[reichenbach|ライヘンバッハの滝]]で相討ちになったかに見える結末を迎える。",

  "mrs-hudson": {type:"person", name:"ハドスン夫人", image:null,

  "lestrade": {type:"person", name:"レストレード警部", image:null,

    related:["scotland-yard","holmes"]},
  "mary-russell": {type:"person", name:"メアリー・ラッセル", image:null,
    desc:"ローリー・R・キングによるパスティーシュ・シリーズの主人公。[[sussex|サセックス]]で養蜂をしながら隠棲する引退後のホームズと若くして出会い、その弟子となって数々の事件を共に解決していく。シリーズ第一作『[[beekeepers-apprentice|パイプの吸える椅子]]』に始まり、正典を大胆に補完しながらも敬意を払った翻案として高く評価されている。作品を重ねるごとに深まっていく二人の関係も、シリーズを通じた読みどころの一つ。",

  "musgrave-ritual": {type:"work", canon:true, name:"『マスグレーヴ家の儀式』", image:null,

  "hound-baskervilles": {type:"work", canon:true, name:"『バスカヴィル家の犬』", image:null,

  "final-problem": {type:"work", canon:true, name:"『最後の事件』", image:null,

  "pastiche-term": {type:"term", name:"パスティーシュとは", image:null,

  "canon-term": {type:"term", name:"正典（Canon）とは", image:null,

  "persian-slipper": {type:"term", tags:["小道具"], name:"ペルシャ・スリッパ", image:null,

  "seven-percent-solution-syringe": {type:"term", tags:["小道具","医学・科学"], name:"注射器と7パーセント溶液", image:null,

  "tobacco-ash-monograph": {type:"term", tags:["小道具","推理法・思考法"], name:"たばこの灰の研究", image:null,
    desc:"ホームズが著したとされる論文「140種の葉巻・パイプ・紙巻きたばこの灰の判別法について」。[[study-in-scarlet|『緋色の研究』]]などで言及され、現場に落ちた灰の色や形状から、犯人が吸っていたたばこの銘柄まで割り出してみせる。専門分野を極端に狭く深く掘り下げる一方、天文学の知識には無頓着という、ホームズの偏った博識ぶりを象徴する逸話のひとつ。",

  "science-of-deduction": {type:"term", tags:["推理法・思考法"], name:"演繹法（The Science of Deduction）", image:null,
    desc:"結果や痕跡から、そこに至った原因や経緯を遡って特定する、ホームズ流の推理の核。[[study-in-scarlet|『緋色の研究』]]で[[watson|ワトスン]]が偶然目にする雑誌記事「生活の書」は、ホームズ自身が書いたこの推理法についての論文だった。一滴の水からナイアガラの滝やアトランティック海の存在を推理できる、という記事中の一節を、ワトスンは当初「妄言だ」と切って捨てている。",

  "see-vs-observe": {type:"term", tags:["推理法・思考法"], name:"観察と推理の違い", image:null,
    desc:"「見る（see）」ことと「観察する（observe）」ことは違う、というホームズの持論。[[scandal-in-bohemia|『ボヘミアの醜聞』]]では、221Bの階段を何百回と上り下りしてきたはずの[[watson|ワトスン]]が、その段数を答えられない場面が代表例として語られる。同じものを目にしていても、意識して見なければ情報として記憶に残らない、という観察法の基本を端的に示すやり取りである。",

  "disguise-art": {type:"term", tags:["推理法・思考法"], name:"変装術", image:null,

async function safeGet(key){
  if(!key) return null;
  try{
    const { data, error } = await supabaseClient.from('atlas_data').select('value').eq('key', key).maybeSingle();
    if(error || !data) return null;
    return data.value;
  }catch(e){ return null; }
}
async function safeSet(key, value){
  if(!key) return false;
  try{
    const { error } = await supabaseClient.from('atlas_data').upsert({ key, value, updated_at: new Date().toISOString() });
    if(error){ console.error(error); showToast('保存に失敗しました。'); return false; }
    return true;
  }catch(e){ console.error(e); showToast('保存に失敗しました。'); return false; }
}
// ---------- 原子的な部分更新（同時書き込みでの上書き事故対策） ----------
// atlas_data を「丸ごと読み込み→JSで直す→丸ごと書き戻す」のではなく、
// Postgres側の関数（RPC）で「1件だけ」操作することで、複数人が同時に
// 書き込んでも自動的に順番に処理され、互いの変更を消し合わないようにする。
async function callRpc(fn, args){
  try{
    const { error } = await supabaseClient.rpc(fn, args);
    if(error){
      console.error(error);
      if(error.message && error.message.includes('rate_limited')){
        showToast('投稿の間隔が短すぎます。少し時間を空けてからもう一度お試しください。');
      } else {
        showToast('保存に失敗しました。');
      }
      return false;
    }
    return true;
  }catch(e){ console.error(e); showToast('保存に失敗しました。'); return false; }
}

      photos: [...((a.photos || (a.photoOld||a.photoNow ? [a.photoOld,a.photoNow].filter(Boolean) : [])) || []), ...(ov.extraPhotos||[])],
      canon: ov.canon !== undefined ? ov.canon : (a.canon !== undefined ? a.canon : true),

function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// 入力のたびに重い処理（DATA全件を対象にしたfuzzyMatch走査や、それに伴う
// 検索結果DOMの再構築）を実行すると、項目数が今後増えた時にタイプ中の
// カクつきにつながる。索引の絞り込み欄では既にこの考え方で個別にデバウンス
// していたが、地図検索・お気に入りリストへの項目追加検索は未対応だったため、
// 共通のヘルパーに揃えて、検索系の入力欄すべてで同じように一呼吸置いてから
// 処理するようにする。
function debounce(fn, delay){
  let t = null;
  const debounced = (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), delay);
  };
  debounced.cancel = () => clearTimeout(t);
  return debounced;
}

// ---------- 説明文中の [[リンク]] 記法 ----------
function findLinkCandidates(token){
  if(DATA[token]) return [token]; // 明示的なID指定（曖昧さ解消済み）
  const exactMatches = Object.keys(DATA).filter(id=>DATA[id].name === token);
  if(exactMatches.length) return exactMatches;
  return Object.keys(DATA).filter(id=>fuzzyMatch(DATA[id].name, token));
}
function parseDescSegments(desc){
  // 日本語入力（全角モード）で書いていると、半角のはずの[[ ]]や｜が
  // うっかり全角の［［ ］］｜になっていることがあるため、どちらで書いても
  // 同じようにリンクとして認識されるようにしている。
  const regex = /[\[［]{2}([^\]］|｜]+?)(?:[|｜]([^\]］]+?))?[\]］]{2}/g;
  const segments = [];
  let lastIndex = 0, m;
  while((m = regex.exec(desc)) !== null){
    if(m.index > lastIndex) segments.push({type:'text', content: desc.slice(lastIndex, m.index)});
    const token = m[1].trim();
    const candidates = findLinkCandidates(token);
    const display = m[2] ? m[2].trim() : (candidates.length===1 ? DATA[candidates[0]].name : token);
    if(candidates.length === 1) segments.push({type:'link', id: candidates[0], display});
    else if(candidates.length > 1) segments.push({type:'ambiguous', token, display, candidates});
    else segments.push({type:'text', content: display});
    lastIndex = regex.lastIndex;
  }
  if(lastIndex < desc.length) segments.push({type:'text', content: desc.slice(lastIndex)});
  return segments;
}

function segmentsToHtml(segments){
  return segments.map(seg=>{

    if(seg.type==='ambiguous'){

// 2点間の大圏距離(km)を返す共通ユーティリティ。zoomForCoords（地図のズーム値決定）
// と、下の経由地並び替え（orderStopsNearestNeighbor）・現在地から近い場所の検索
// （nearbyPanel）の両方から使う。かつては用途ごとに同じ内容の関数が2箇所に
// 定義されていたが、1つにまとめてある。
function haversineKm(a,b){
  const toRad = d=>d*Math.PI/180, R=6371;
  const dLat=toRad(b[0]-a[0]), dLon=toRad(b[1]-a[1]);
  const lat1=toRad(a[0]), lat2=toRad(b[0]);
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function zoomForCoords(coords, excludeId){
  let minDist = Infinity;
  Object.keys(DATA).forEach(oid=>{
    if(oid===excludeId) return;
    const o = DATA[oid];
    if(o.type!=='place' || !o.coords) return;
    const d = haversineKm(coords, o.coords);
    if(d<minDist) minDist=d;
  });
  if(minDist<=2) return 16;
  if(minDist<=5) return 14;
  if(minDist<=20) return 13;
  return 12;
}
function zoomForEntity(id){
  const e = DATA[id];
  if(!e || !e.coords) return 12;
  return zoomForCoords(e.coords, id);
}

function compressImageToBlob(file, maxDim=800, quality=0.72){
  return new Promise((resolve,reject)=>{
    if(!file.type.startsWith('image/')){ reject(new Error('not image')); return; }
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('decode failed'));
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h=Math.round(h*maxDim/w); w=maxDim; } else { w=Math.round(w*maxDim/h); h=maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        canvas.toBlob(blob=>{
          if(blob) resolve(blob); else reject(new Error('blob failed'));
        }, 'image/jpeg', quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
const STORAGE_BUCKET = 'atlas-photos';
async function uploadImageToStorage(file){
  const blob = await compressImageToBlob(file);
  const path = `uploads/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
  const { error } = await supabaseClient.storage.from(STORAGE_BUCKET).upload(path, blob, {contentType:'image/jpeg', upsert:false});
  if(error) throw error;
  const { data } = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

// Supabase Storage側のバケット容量・ファイルサイズ上限の設定も別途ご確認ください。
function canUploadImageNow(){
  if(isReviewer()) return true;
  const STORAGE_KEY = 'atlasImgUploadTimes';
  const WINDOW_MS = 10*60*1000; // 10分

  let times = [];
  try{ times = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }catch(e){ times = []; }

async function geocodeSearchOnce(query, lang){
  try{
    if(MAPTILER_KEY.includes('YOUR_MAPTILER')) throw new Error('no key');
    const langParam = lang ? `&language=${lang}` : '';
    const url = `https://api.maptiler.com/geocoding/${encodeURIComponent(query)}.json?key=${MAPTILER_KEY}${langParam}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('geocode failed');
    const data = await res.json();
    return (data.features||[]).map(f=>{
      const center = f.center || (f.geometry && f.geometry.coordinates) || [null,null];
      const lon = center[0], lat = center[1];
      return {lat, lon, display_name: f.place_name || f.text || query, placeType: f.place_type || []};
    }).filter(r=>r.lat!==null);
  }catch(e){ return null; }
}
async function nominatimSearchFallback(query){

    const res = await fetch(url);
    if(!res.ok) throw new Error('failed');
    const data = await res.json();
    return data.map(d=>({lat: parseFloat(d.lat), lon: parseFloat(d.lon), display_name: d.display_name, placeType: [d.type, d.class].filter(Boolean)}));

// カタカナ表記が地名データベースに登録されていないケース向けの、独自の対応辞書。
// 「カタカナ検索で見つからなかった地名」を見つけるたびにここへ追加していく。
const KATAKANA_PLACE_ALIASES = {
  "オックスフォードストリート": "Oxford Street, London",
  "ウーリッジ": "Woolwich, London",
};
function normalizeForAlias(s){
  return s.replace(/[・･\s]/g,'');
}
function resolveKatakanaAlias(query){
  const key = normalizeForAlias(query);
  const merged = Object.assign({}, KATAKANA_PLACE_ALIASES, customAliases);
  if(merged[key]) return merged[key];
  // 前方一致（例：「オックスフォードスト」→「オックスフォードストリート」）
  let best = null, bestLen = -1;
  Object.keys(merged).forEach(k=>{
    if((k.startsWith(key) || key.startsWith(k)) && k.length > bestLen){
      best = merged[k]; bestLen = k.length;
    }
  });
  if(best) return best;
  // あいまい一致（多少の文字違いを許容）
  for(const k of Object.keys(merged)){
    if(fuzzyMatch(k, query)) return merged[k];
  }
  return null;
}

// 一般会員の登録は「別名の提案」としてp-proposalsに送られ、承認後に反映される。
async function saveCustomAlias(query, englishName){
  const key = normalizeForAlias(query);
  if(isReviewer()){
    customAliases[key] = englishName;
    await rpcObjSet('p-aliases', key, englishName);
    return true;
  } else {
    await submitProposal('alias', 'alias', key, {key, ja:query, en:englishName});
    return false;
  }
}
async function deleteCustomAlias(key){
  delete customAliases[key];

}
async function geocodeSearch(query){
  const alias = resolveKatakanaAlias(query);
  if(alias){
    const aliasResults = await geocodeSearchOnce(alias, null);
    if(aliasResults && aliasResults.length > 0) return aliasResults;
  }
  const jaResults = await geocodeSearchOnce(query, 'ja');
  if(jaResults && jaResults.length > 0) return jaResults;
  // 日本語優先で見つからなければ、言語指定なし（英語表記優先）で再検索
  const fallback = await geocodeSearchOnce(query, null);
  if(fallback && fallback.length > 0) return fallback;
  // それでも見つからなければ、OpenStreetMap本家の検索エンジンも試す
  const nominatim = await nominatimSearchFallback(query);
  if(nominatim && nominatim.length > 0) return nominatim;
  // 全部が通信失敗なら null、どれかが「0件」なら空配列を返す
  if(jaResults === null && fallback === null && nominatim === null) return null;
  return [];
}

const mapboxLibsReady = (typeof mapboxgl !== 'undefined') && (typeof L.mapboxGL === 'function');

// 区別する：あちらは元のズームに戻れば再びMapboxに戻ってよいが、こちらは戻さない。
let mapboxPermanentlyFailed = false;

function addOsmTiles(){
  if(!map.hasLayer(tileLayer)) tileLayer.addTo(map);
}

// Mapboxの読み込みが（クォータ超過・トークン失効・通信障害などで）短時間に繰り返し失敗した場合、
// サイトの地図表示自体が壊れてしまわないよう、自動的にOSM地図へ切り替える安全策。
function fallbackToOsmTiles(reason){
  mapboxPermanentlyFailed = true;
  if(!usingMapboxBasemap) return;
  usingMapboxBasemap = false;
  try{ if(mapboxGlLayer && map.hasLayer(mapboxGlLayer)) map.removeLayer(mapboxGlLayer); }catch(e){}

// ---------- 低ズーム（世界全体を見渡すレベル）での自動フォールバック ----------
// mapbox-gl-leaflet（MapboxをLeafletに組み込むための橋渡しライブラリ）には、
// 大きくズームアウトするとピンの表示位置がズレる既知の未解決の不具合がある
// （ライブラリ側の実験的機能扱いで、明確な修正はまだ無い）。ある特定のズーム
// より下で必ず起きるわけではなく不規則に起きうるとの報告もあるため、安全側に
// 倒して、この閾値より低いズームでは常にOSM地図（位置は正確、日本語化はされない）
// に自動的に切り替える。閾値以上に戻れば再びMapboxに戻る。
const MAPBOX_MIN_SAFE_ZOOM = 4;
function updateBasemapForZoom(){
  if(!mapboxConfigured || mapboxPermanentlyFailed || !mapboxGlLayer) return;
  if(showingHistoric) return; // 古地図表示中はこちらの切り替えに関与しない
  if(map.getZoom() < MAPBOX_MIN_SAFE_ZOOM){
    if(usingMapboxBasemap){
      try{ if(map.hasLayer(mapboxGlLayer)) map.removeLayer(mapboxGlLayer); }catch(e){}
      usingMapboxBasemap = false;
    }
    addOsmTiles();
  } else {
    if(!usingMapboxBasemap){
      try{ if(map.hasLayer(tileLayer)) map.removeLayer(tileLayer); }catch(e){}
      mapboxGlLayer.addTo(map);
      usingMapboxBasemap = true;
    }
  }
}

function tryAddMapboxBasemap(){
  try{
    mapboxgl.accessToken = MAPBOX_TOKEN;
    mapboxGlLayer = L.mapboxGL({
      accessToken: MAPBOX_TOKEN,
      style: 'mapbox://styles/mapbox/streets-v12',
      // Mapbox GL JSは低ズーム時に自動で立体の地球儀表示(globe)に切り替わる仕様があるが、
      // Leafletのピン配置は平面のメルカトル図法を前提に計算しているため、球体表示になると
      // ピンの位置が海上や画面外にズレてしまう。常に平面(mercator)に固定して防ぐ。
      projection: 'mercator',
      // Mapbox GL JS本体に組み込まれている言語指定機能（v2.11以降、classicスタイルにも対応）。
      // 以前使っていたmapbox-gl-languageプラグインは、streets-v12の内部構造と噛み合わず
      // エラーも出さずに何も変えない状態だったため、公式サポートのこちらの方式に切り替えた。
      language: 'ja',
      attribution: '&copy; <a href="https://www.mapbox.com/about/maps/" target="_blank" rel="noopener">Mapbox</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
    }).addTo(map);
    usingMapboxBasemap = true;

    const glMap = mapboxGlLayer.getMapboxMap();
    glMap.on('load', ()=>{
      // OSM地図用のtileLayerが動いていない間はtilesLoaded/tilesErroredが
      // 更新されず、「読み込みに時間がかかっています」の警告が消えないままに
      // なっていた不具合の修正：Mapbox側の読み込み完了もここでカウントする。
      tilesLoaded++;
      if(tilesErrored===0) mapStatusEl.classList.remove('show');
      // コンストラクタのprojectionオプションだけでも効くはずだが、念のため明示的にも固定しておく
      // （globe表示になるとLeafletのピン位置がズレるため）。
      try{
        if(typeof glMap.setProjection === 'function') glMap.setProjection('mercator');
      }catch(e){ console.error('setProjection(mercator)の適用に失敗しました:', e); }
      // コンストラクタのlanguageオプションだけでも効くはずだが、念のため明示的にも呼んでおく。
      try{
        if(typeof glMap.setLanguage === 'function'){
          glMap.setLanguage('ja');
          console.log('[holmes-atlas] setLanguage(ja)を適用しました');
        } else {
          console.warn('[holmes-atlas] このMapbox GL JSのバージョンにはsetLanguageがありません');
        }
      }catch(e){ console.error('setLanguage(ja)の適用に失敗しました:', e); }
    });
    glMap.on('idle', ()=>{
      // styleとタイルの初回描画が完全に落ち着いたタイミング。読み込み完了の合図として
      // 念のためここでも警告を消しておく（loadイベントより後に発火することがあるため）。
      if(tilesErrored===0) mapStatusEl.classList.remove('show');
    });
    glMap.on('error', (e)=>{
      tilesErrored++;
      mapStatusEl.textContent = '地図タイルを読み込めませんでした';
      mapStatusEl.classList.add('show');
      const now = Date.now();
      mapboxErrorTimestamps.push(now);
      mapboxErrorTimestamps = mapboxErrorTimestamps.filter(t => now - t < 10000);
      // 単発のタイル欠損などは無視し、10秒以内に5回以上失敗が続いた場合だけ切り替える
      if(mapboxErrorTimestamps.length >= 5){
        fallbackToOsmTiles((e && e.error && e.error.message) || 'repeated error events');
      }
    });
  }catch(e){
    console.error('Mapboxレイヤーの初期化に失敗しました:', e);
    usingMapboxBasemap = false;
    addOsmTiles();
  }
}

if(mapboxConfigured){
  tryAddMapboxBasemap();
} else {
  addOsmTiles();
}

// ---------- 古地図（ホームズ時代）レイヤーの切り替え ----------
let historicLayer = null;
let showingHistoric = false;
function getHistoricLayer(){
  if(!historicLayer){
    historicLayer = L.tileLayer(`https://api.maptiler.com/tiles/${MAPTILER_HISTORIC_TILE_ID}/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`, {
      attribution:'Historic map (Ordnance Survey six-inch, surveyed 1888-1913): National Library of Scotland / MapTiler',
      maxZoom:18
    });
    historicLayer.on('tileerror', ()=>{
      mapStatusEl.textContent = '古地図タイルを読み込めませんでした（設定をご確認ください）';
      mapStatusEl.classList.add('show');
    });
  }
  return historicLayer;
}
const historicToggleBtn = document.getElementById('historicToggleBtn');
historicToggleBtn.addEventListener('click', ()=>{
  if(MAPTILER_KEY.includes('YOUR_MAPTILER') || MAPTILER_HISTORIC_TILE_ID.includes('YOUR_MAPTILER')){
    showToast('⚠ 古地図を使うにはMapTilerの設定（APIキーとタイルID）が必要です。');
    return;
  }
  showingHistoric = !showingHistoric;
  // ボタン自体はアイコン付きのまま変えず（textContentで丸ごと差し替えるとアイコンの
  // SVGごと消えてしまうため）、中のラベル<span>だけ書き換える。オンの間は年代表記も
  // 一緒に出し、オフの間は帯を圧迫しないよう短い表記に戻す。オン/オフの色分けは
  // 「正典登場地のみ」と共通のactiveクラスのパターンにする。
  historicToggleBtn.classList.toggle('active', showingHistoric);
  historicToggleBtn.setAttribute('aria-pressed', String(showingHistoric));
  document.getElementById('historicToggleLabel').textContent = showingHistoric ? '古地図（1888〜1913年）' : '古地図';
  if(showingHistoric){
    // メインの地図がMapboxかOSMかを問わず、今表示中の方を退避する
    if(usingMapboxBasemap && mapboxGlLayer){ map.removeLayer(mapboxGlLayer); }
    else { map.removeLayer(tileLayer); }
    getHistoricLayer().addTo(map);
  } else {
    map.removeLayer(getHistoricLayer());
    // 元の状態（Mapbox/OSM）に戻す。古地図を見ている間にズームが変わっている
    // 可能性もあるので、現在のズームに応じた判定をここで改めて行う。
    if(usingMapboxBasemap && mapboxGlLayer){ mapboxGlLayer.addTo(map); }
    else { addOsmTiles(); }
    updateBasemapForZoom();
  }
});

// ---------- 表示絞り込み（全ての地点／全ての正典登場地／作品ごと） ----------
// 以前は「正典のみ」トグルボタンと「作品選択」プルダウンの2つに分かれていたが、
// 実質的には「全ての地点を見せる」「正典・パスティーシュ直結の地点だけ見せる」
// 「特定の作品に登場する地点だけ見せる」という、互いに排他な3種類の見せ方の
// 切り替えでしかなかったため、1つの選択式ボタン（表示絞り込み）に統合した。
// 内部の状態は旧来のまま2つ（workFilter＝選んだ作品のID、coreOnlyFilter＝
// 正典のみかどうか）を使い続けているが（renderMarkers/renderIndex側は変更不要）、
// この選択メニューの側で「常にどちらか一方だけが有効になる」よう排他制御する。
// coreOnlyFilター自体の宣言は、renderMarkers/renderIndexに近い場所に残してある
// （このブロックより後で宣言されるが、実際に参照されるのはユーザー操作後、
// つまりスクリプト全体の読み込みが終わったあとなので問題ない）。
let workFilter = null;
// viewFilterValueは表示上の「今選ばれている項目」を覚えておくための値。
// ''＝「全ての地点」（絞り込みなし）、'__core__'＝「全ての正典登場地」、
// それ以外＝選んだ作品のID。
let viewFilterValue = '';
// 正典作品一覧（60件近く）の折りたたみ開閉状態。メニューを開き直しても
// 状態を保つため、populateViewFilterMenu()の外側（関数が呼ばれるたびに
// リセットされない場所）で持つ。
let viewFilterCanonExpanded = false;
function setViewFilterLabel(text, active){
  const label = document.getElementById('viewFilterBtnLabel');
  if(label) label.textContent = text;
  const btn = document.getElementById('viewFilterBtn');
  if(btn) btn.classList.toggle('active', !!active);
}
function closeViewFilterMenu(){
  const menu = document.getElementById('viewFilterMenu');
  const wrap = document.getElementById('viewFilterWrap');
  const btn = document.getElementById('viewFilterBtn');
  if(menu) menu.classList.remove('show');
  if(wrap) wrap.classList.remove('open');
  if(btn) btn.setAttribute('aria-expanded','false');
}
function openViewFilterMenu(){
  const btn = document.getElementById('viewFilterBtn');
  const menu = document.getElementById('viewFilterMenu');
  const wrap = document.getElementById('viewFilterWrap');
  if(!btn || !menu) return;
  // ★開くたびに作り直し、✓マーク（.active）を今のviewFilterValueに合わせて
  // 必ず最新化する（クリックで選んだ直後は個々のボタンのDOMまでは書き換えていない
  // ため、開き直したタイミングでここできちんと揃える）
  populateViewFilterMenu();
  // position:fixedにしたので、ボタン自身のgetBoundingClientRect()と
  // ビューポートのサイズ（window.innerWidth/innerHeight）だけで位置を
  // 決める。.stageのrectには依存しない（理由はCSS側のコメント参照）。
  const br = btn.getBoundingClientRect();
  menu.style.right = Math.max(8, window.innerWidth - br.right) + 'px';
  menu.style.bottom = Math.max(8, window.innerHeight - br.top + 8) + 'px';
  menu.classList.add('show');
  wrap.classList.add('open');
  btn.setAttribute('aria-expanded','true');
}
// 表示絞り込みボタンの「active」ハイライトは、地点側の絞り込み（workFilter／
// coreOnlyFilter）と、訪問記録ピンの表示・非表示（journalMarkersVisible）の
// 2つの軸をまとめて反映する。地点側はラベル文言も変わるためsetViewFilterLabel
// 側でも簡易にactiveを付けているが、訪問記録側はラベル文言を変えない（ボタンの
// 文字は地点の絞り込み状態専用の表示のままにしておきたいため）ので、最終的な
// activeの真偽はここで両方の状態から毎回計算し直す。
function syncViewFilterBtnActive(){
  const btn = document.getElementById('viewFilterBtn');
  if(btn) btn.classList.toggle('active', !!workFilter || coreOnlyFilter || !journalMarkersVisible);
}
function selectViewFilter(value, label){
  viewFilterValue = value;
  if(value === '__core__'){
    coreOnlyFilter = true;
    workFilter = null;
  } else if(value){
    coreOnlyFilter = false;
    workFilter = value;
  } else {
    coreOnlyFilter = false;
    workFilter = null;
  }
  setViewFilterLabel(label, !!value);
  syncViewFilterBtnActive();
  // 選んでもメニューは閉じない（✕ボタンで明示的に閉じる運用）。チェック状態は
  // ここで作り直して最新化する（例：作品Aを選んだ直後に「全ての地点」「全ての
  // 正典登場地」のチェックボックスを外し、選んだ作品側にチェックを入れ直す）。
  populateViewFilterMenu();
  renderMarkers();
  renderIndex();
  if(!workFilter) return;
  const coordsList = Object.keys(DATA)
    .filter(id=>{
      const e = DATA[id];
      if(e.type!=='place' || !e.coords) return false;
      return (e.related||[]).includes(workFilter);
    })
    .map(id=>DATA[id].coords);
  if(coordsList.length===0){
    showToast('この作品に紐づく地図上の地点は見つかりませんでした。');
  } else if(coordsList.length===1){
    flyToNav(coordsList[0], Math.max(map.getZoom(), 14), {duration:0.7});
  } else {
    flyToBoundsNav(L.latLngBounds(coordsList), {padding:[48,48], maxZoom:15, duration:0.7});
  }
}
function populateViewFilterMenu(){
  const menuBody = document.getElementById('viewFilterMenuBody');
  if(!menuBody) return;
  const prevValue = viewFilterValue;
  const canonWorks = [];
  Object.keys(DATA).forEach(id=>{
    const e = DATA[id];
    if(e.type==='work' && e.canon) canonWorks.push(id);
  });
  canonWorks.sort((a,b)=>DATA[a].name.localeCompare(DATA[b].name,'ja'));
  // 正典作品は60件近くあり、全部並べるとメニュー自体が縦に長くなって
  // スクロールが大変になる（ユーザー報告）。そのため折りたたみ方式にし、
  // 既定では閉じておく。ただし今まさにその中の作品が選択されている場合は、
  // 開き直すたびに閉じた状態に戻ってチェックが見えなくなると分かりづらいので、
  // その時だけ自動的に開く。開閉状態自体（viewFilterCanonExpanded）は
  // journalMarkersVisibleと同様、メニューを開き直しても保持する。
  const canonSelected = !!(prevValue && DATA[prevValue] && DATA[prevValue].type==='work' && DATA[prevValue].canon);
  if(canonSelected) viewFilterCanonExpanded = true;
  // data-labelを別に持たせているのは、item.textContentをそのままラベルとして
  // 使うと、チェック済み項目（内部に✓を含むチェックボックス用span）のテキストまで
  // 拾ってしまい「✓全ての地点」のようにボタンの表示ラベルへ✓が混入してしまうため。
  const itemHtml = (value, label) => {
    const active = value===prevValue;
    return `<button type="button" class="mt-select-menu-item${active?' active':''}" data-value="${escapeAttr(value)}" data-label="${escapeAttr(label)}" role="checkbox" aria-checked="${active?'true':'false'}"><span class="mt-select-checkbox">${active?'✓':''}</span>${escapeHtml(label)}</button>`;
  };
  let html = itemHtml('', '全ての地点');
  html += itemHtml('__core__', '全ての正典登場地');
  if(canonWorks.length){
    html += `<button type="button" class="mt-select-menu-section mt-select-menu-collapsible" id="viewFilterCanonToggle" aria-expanded="${viewFilterCanonExpanded?'true':'false'}" aria-controls="viewFilterCanonList"><span class="mt-select-collapse-arrow">${viewFilterCanonExpanded?'▾':'▸'}</span>正典（コナン・ドイル）の各作品<span class="mt-select-menu-count">（${canonWorks.length}）</span></button>`;
    html += `<div class="mt-select-menu-collapse-body${viewFilterCanonExpanded?' expanded':''}" id="viewFilterCanonList">`;
    html += canonWorks.map(id=>itemHtml(id, DATA[id].name)).join('');
    html += `</div>`;
  }
  // 訪問記録ピンの表示・非表示は、上のリストとは独立した軸（複数選択の排他制御に
  // 乗せず、単純なON/OFF）なので、専用のセクションとして分けて追加する。data-value
  // を持たせず、下で専用のクリックハンドラを付ける（他の項目と同じ汎用ハンドラに
  // 拾われないようにするため）。
  html += `<div class="mt-select-menu-section">訪問記録（地図上のピン）</div>`;
  html += `<button type="button" class="mt-select-menu-item${journalMarkersVisible?' active':''}" id="viewFilterJournalToggle" role="checkbox" aria-checked="${journalMarkersVisible?'true':'false'}"><span class="mt-select-checkbox">${journalMarkersVisible?'✓':''}</span>訪問記録を地図に表示する</button>`;
  menuBody.innerHTML = html;
  menuBody.querySelectorAll('.mt-select-menu-item[data-value]').forEach(item=>{
    item.addEventListener('click', ()=>selectViewFilter(item.dataset.value, item.dataset.label));
  });
  const journalToggleItem = document.getElementById('viewFilterJournalToggle');
  if(journalToggleItem){
    journalToggleItem.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      setJournalMarkersVisible(!journalMarkersVisible);
      // 選んでもメニューは閉じない。チェックの見た目だけこの場で最新化する。
      populateViewFilterMenu();
      syncViewFilterBtnActive();
    });
  }
  const canonToggleBtn = document.getElementById('viewFilterCanonToggle');
  if(canonToggleBtn){
    // 開閉の切り替えだけなので絞り込み状態やactiveハイライトには影響しない。
    // メニューは閉じず、その場で中身を差し替えて開いたままにする（続けて
    // 作品を選びやすくするため）。
    canonToggleBtn.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      viewFilterCanonExpanded = !viewFilterCanonExpanded;
      populateViewFilterMenu();
    });
  }
  if(prevValue === '__core__'){
    setViewFilterLabel('全ての正典登場地', true);
  } else if(prevValue && DATA[prevValue] && DATA[prevValue].type==='work'){
    setViewFilterLabel(DATA[prevValue].name, true);
  } else if(prevValue){
    // 選択中だった作品がデータの入れ替えで無くなった場合は、絞り込みを解除する
    viewFilterValue = '';
    workFilter = null;
    coreOnlyFilter = false;
    setViewFilterLabel('表示絞り込み', false);
  }
  // それ以外（''のまま＝「全ての地点」）は変更なし
  syncViewFilterBtnActive();
}

// ---------- お気に入りリストごとの地点絞り込み ----------

let favListFilter = null; // 選択中のお気に入りリストid。nullなら絞り込みなし
function setFavFilterLabel(text, active){

function selectFavFilter(listId){

  } else {

  }
}
function populateFavFilterMenu(){
  const menu = document.getElementById('favFilterMenu');
  if(!menu) return;
  if(favListFilter && !favoriteLists.find(l=>l.id===favListFilter)){

  } else if(favoriteLists.length===0){

// お気に入りリストに入っている地点（座標を持つplace）を、Googleマップの

function openRouteForFavoriteList(listId){

// 出発地・目的地を地点一覧から自分で選ぶモーダル。◎（出発地）○（目的地）は
// それぞれ1つだけ選べる排他選択（同じ地点を両方に選ぶことはできない＝片方を

function openRoutePickStopsModal(stops, travelMode){

  // 除外できるようにする（「リストには入っているが、今回のルートでは回らない
  // 地点がある」というケース向け）。出発地・目的地に選ばれている間は経由地

  overlay.classList.add('open');

    if(!originId || !destId) return;

// ---------- 経由地の並び替え（近い順の簡易最適化） ----------
// GoogleマップのURL版「ルート」（https://www.google.com/maps/dir/?api=1）は、
// Directions API・JS版DirectionsServiceにあるoptimizeWaypoints（俗に
// waypoints=optimize:true|... と書けば効くと誤解されがちな機能）に対応していない。
// 実際にoptimize:true|lat,lngのように渡すと、Googleマップ側はパイプ区切りの
// 1つ目の要素をただの地名テキストとして扱い、「optimize:true」という文字列が
// そのまま1つ目の経由地の検索欄に入力された状態で開いてしまう（＝ルートが
// 組めない）。そのため経由地の並び替えは、出発地の座標が分かっている場合に限り
// こちら側で行ってから、プレーンな lat,lng|lat,lng|... の形でURLに渡す。
// 参考：https://developers.google.com/maps/documentation/urls/get-started
// （距離計算のhaversineKmは共通ユーティリティとして上の方（zoomForCoordsの前）に
// 1つだけ定義している）
// 巡回セールスマン問題の厳密解ではなく、「今いる場所から一番近い未訪問地点へ」を
// 繰り返す最近傍法という簡易な近似。地点数（最大25件程度）を考えれば十分実用的。
function orderStopsNearestNeighbor(startCoords, stopsArr){
  const remaining = stopsArr.slice();
  const ordered = [];
  let current = startCoords;
  while(remaining.length){
    let bestIdx = 0, bestDist = Infinity;
    remaining.forEach((s,i)=>{
      const d = haversineKm(current, s.coords);
      if(d < bestDist){ bestDist = d; bestIdx = i; }
    });
    const next = remaining.splice(bestIdx, 1)[0];
    ordered.push(next);
    current = next.coords;
  }
  return ordered;
}
// Googleマップの経由地URL（waypoints）には、公式ドキュメント上の上限がある：
// モバイルブラウザでは3件、それ以外（デスクトップブラウザ等）では9件まで
// （出発地・目的地は含まない、中間の経由地だけの件数）。超えて渡すと表示が
// 崩れる／一部の経由地が無視されるおそれがある。
// 参考：https://developers.google.com/maps/documentation/urls/get-started
function isLikelyMobileBrowser(){
  if(navigator.userAgentData && typeof navigator.userAgentData.mobile === 'boolean'){
    return navigator.userAgentData.mobile;
  }
  return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
}
function gmapsWaypointLimit(){
  return isLikelyMobileBrowser() ? 3 : 9;
}
// 電車・バス（transit）は、そもそもGoogleマップのDirections APIが経由地
// （waypoints）自体をサポートしていない（"The API supports waypoints for
// these travel modes: driving, walking and bicycling; not transit."と
// 公式ドキュメントに明記されている）。徒歩・自転車・車の時のような
// モバイル/デスクトップの件数上限とは別の、そもそも0件までしか渡せない
// という制約なので、区間ごとの経由地数の上限をtravelModeごとに出し分ける。
// 参考：https://developers.google.com/maps/documentation/directions/get-directions
function legWaypointLimit(travelMode){
  if(travelMode === 'transit') return 0;
  return gmapsWaypointLimit();
}
// ---------- 経由地が上限を超える場合の「区間分割」 ----------
// 単純に切り詰めて残りを諦めるのではなく、上限に収まる区間（leg）に分割し、
// ある区間の終点を次の区間の出発点にする「リレー」形式でGoogleマップの
// リンクを複数用意する。startPointがnull＝現在地（最初の区間の出発地のみ
// 取りうる。2区間目以降の出発点は必ず実在の地点になる）。
// 例：上限3件・経由地10件なら、区間1（出発地＋経由地3件＋区間1の終点＝
// 経由地4件目）、区間2（区間1の終点＋経由地3件＋区間2の終点）、
// 区間3（区間2の終点＋残り2件＋最終目的地）の3区間に分かれる。
// travelModeが'transit'の場合はlegWaypointLimitが0を返すため、この同じ
// ロジックのまま「経由地1件ごとに区間を区切る」形になり、電車・バスでも
// 複数地点をリレー形式で回れる（Googleマップの1回のtransitリクエストには
// 経由地を一切含めない）。
function splitRouteIntoLegs(startPoint, orderedWaypoints, destPoint, travelMode){
  const limit = legWaypointLimit(travelMode);
  const legs = [];
  let legStart = startPoint;
  let idx = 0;
  while(true){
    const remaining = orderedWaypoints.length - idx;
    if(remaining <= limit){
      legs.push({ origin: legStart, waypoints: orderedWaypoints.slice(idx), destination: destPoint });
      break;
    }
    const legWaypoints = orderedWaypoints.slice(idx, idx + limit);
    const legEnd = orderedWaypoints[idx + limit];
    legs.push({ origin: legStart, waypoints: legWaypoints, destination: legEnd });
    idx += limit + 1;
    legStart = legEnd;
  }
  return legs;
}
function buildGmapsLegUrl(leg, travelMode){
  const mode = ROUTE_TRAVEL_MODES.some(m=>m.id===travelMode) ? travelMode : 'walking';
  let url = `https://www.google.com/maps/dir/?api=1&travelmode=${mode}&destination=${leg.destination.coords.join(',')}`;
  if(leg.origin) url += `&origin=${leg.origin.coords.join(',')}`;
  const wp = leg.waypoints.map(e=>e.coords.join(',')).join('|');
  if(wp) url += `&waypoints=${encodeURIComponent(wp)}`;
  return url;
}
// 区間が1つに収まるなら（ほとんどのケース）今まで通り即座にGoogleマップを
// 開き、2つ以上に分かれる場合だけopenMultiLegRouteModalで区間ごとの
// 「開く」ボタンを並べたモーダルを挟む（自動で連続オープンはしない。
// ポップアップブロックに引っかかりやすいのと、区間の切れ目でいったん
// 現地を確認してから次に進みたい、という使い方にも合っているため）。
function openRouteLegsOrDirect(startPoint, orderedWaypoints, destPoint, travelMode){
  const legs = splitRouteIntoLegs(startPoint, orderedWaypoints, destPoint, travelMode);
  if(legs.length <= 1){
    const leg = legs[0] || { origin: startPoint, waypoints: orderedWaypoints, destination: destPoint };
    showToast('Googleマップを開いています…');
    window.open(buildGmapsLegUrl(leg, travelMode), '_blank', 'noopener,noreferrer');
    return;
  }
  openMultiLegRouteModal(legs, travelMode);
}
// useCurrentLocationがfalseなら先頭を出発地・末尾を目的地として並び順通りに。
// trueなら出発地を指定せず（＝Googleマップ側で現在地を使う）、末尾だけを目的地に
// 固定する。この場合、出発地点（＝実際の現在地）がこちらのJSからは分からないため
// 経由地の並べ替えはできず、渡された順のまま案内する。travelModeはopenRouteOriginConfirmModal
// の移動手段トグルで選んだ値（'walking'/'transit'）。
function openGoogleMapsRoute(stops, useCurrentLocation, travelMode){
  const destPoint = stops[stops.length-1];
  if(useCurrentLocation){
    openRouteLegsOrDirect(null, stops.slice(0, -1), destPoint, travelMode);
  } else {
    const ordered = orderStopsNearestNeighbor(stops[0].coords, stops.slice(1, -1));
    openRouteLegsOrDirect(stops[0], ordered, destPoint, travelMode);
  }
}
// 出発地・目的地を自分で指定するモーダル（openRoutePickStopsModal）専用。
// waypointIncludedIds（Setまたは配列。経由地チェックボックスがONの地点id）に
// 入っている地点だけを経由地として使う。出発地・目的地以外で除外された地点は
// 今回のルートに一切含めない。出発地が実在の地点（座標が分かっている）なら、
// そこから近い順にorderStopsNearestNeighborで並べ替える。originIdが
// ROUTE_CURRENT_LOCATION_ID（「現在地」）の場合は、その座標がJS側からは分から
// ないため並べ替えは行わない（openGoogleMapsRouteのuseCurrentLocation=trueと
// 同じ考え方）。travelModeはopenRoutePickStopsModalで選んだ移動手段。
function openGoogleMapsRouteCustom(stops, originId, destId, waypointIncludedIds, travelMode){
  const useCurrentLocation = originId === ROUTE_CURRENT_LOCATION_ID;
  const origin = useCurrentLocation ? null : stops.find(e=>e.id===originId);
  const dest = stops.find(e=>e.id===destId);
  if((!useCurrentLocation && !origin) || !dest) return;
  const includedSet = waypointIncludedIds instanceof Set ? waypointIncludedIds : new Set(waypointIncludedIds||[]);
  const toVisit = stops.filter(e=>e.id!==originId && e.id!==destId && includedSet.has(e.id));
  const orderedWaypoints = useCurrentLocation ? toVisit : orderStopsNearestNeighbor(origin.coords, toVisit);
  openRouteLegsOrDirect(useCurrentLocation ? null : origin, orderedWaypoints, dest, travelMode);
}
// 経由地が上限を超え、区間が2つ以上に分かれた場合に開くモーダル。区間ごとに
// 「開く」ボタンを縦に並べ、押すとその区間だけのGoogleマップのリンクを新しい
// タブで開く（クリック直後の同期処理なのでポップアップブロックの心配がない）。
// 開いた区間には✓を添えてどこまで進んだか分かるようにするが、ボタン自体は
// 無効化しない（タブを間違えて閉じてしまった、もう一度確認したい、といった
// 場合に何度でも押し直せるようにするため）。
function openMultiLegRouteModal(legs, travelMode){
  const isTransit = travelMode === 'transit';
  const reasonText = isTransit
    ? '電車・バスのルートはGoogleマップ側が経由地に対応していないため、区間ごとにリンクを分けています。'
    : `Googleマップは一度に開けるルートの経由地数に上限があるため（お使いの環境では${legWaypointLimit(travelMode)}件まで）、区間ごとにリンクを分けています。`;
  const rowsHtml = legs.map((leg,i)=>{
    const originName = leg.origin ? leg.origin.name : '現在地';
    const destName = leg.destination.name;
    const viaHtml = leg.waypoints.length
      ? `<span class="route-leg-via">経由：${leg.waypoints.map(w=>escapeHtml(w.name)).join(' → ')}</span>`
      : '';
    return `
    <div class="route-leg-row">
      <div class="route-leg-info">
        <span class="route-leg-num">区間${i+1}</span>
        <span class="route-leg-desc">${escapeHtml(originName)} → ${escapeHtml(destName)}</span>
        ${viaHtml}
      </div>
      <button type="button" class="modal-submit route-leg-open-btn" data-leg-idx="${i}">区間${i+1}を開く</button>
    </div>`;
  }).join('');
  modalBody.innerHTML = `
    <h3>ルートを${legs.length}つの区間に分けました</h3>
    <div class="modal-sub">移動手段：${escapeHtml(routeTravelModeLabel(travelMode))}。${reasonText}ある区間の終点が、そのまま次の区間の出発点になります。区間ごとに開いて、それぞれ別のタブでルート案内をご利用ください（何度でも開き直せます）。</div>
    <div class="route-leg-list">${rowsHtml}</div>
    <div class="modal-actions"><button class="modal-cancel" id="route-leg-close">閉じる</button></div>`;
  overlay.classList.add('open');
  modalBody.querySelectorAll('[data-leg-idx]').forEach(btn=>{
    const originalLabel = btn.textContent;
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.dataset.legIdx, 10);
      const leg = legs[i];
      showToast(`区間${i+1}のGoogleマップを開いています…`);
      window.open(buildGmapsLegUrl(leg, travelMode), '_blank', 'noopener,noreferrer');
      btn.textContent = originalLabel + ' ✓';
      btn.classList.add('opened');
    });
  });
  document.getElementById('route-leg-close').addEventListener('click', closeModal);
}

// ルートかごの中身を、既存のお気に入りリスト（複数選択可）に追加するか、新しい
// リストとして作成する。openFavoriteListsModal（1項目を複数リストへ）の逆パターン
// ＝「複数項目を1つ以上のリストへ」にあたる。新規作成はentityIds:routeCart.slice()で
// 最初から中身入りのリストを作る（openFavoriteListsModalの新規作成と同じ
// isFirstEverList分岐をそのまま踏襲）。
function openSaveRouteCartAsListModal(){
  const stops = routeCart.map(id=>DATA[id]).filter(Boolean);
  if(stops.length===0){ closeModal(); return; }
  modalBody.innerHTML = `
    <h3>ルートかごをお気に入りリストに保存</h3>
    <div class="modal-sub">ルートかごの${stops.length}件を追加したいリストにチェックを入れてください（複数選択可）。</div>
    <div class="checklist" id="cartSaveListCheckList">
      ${favoriteLists.length ? favoriteLists.map(l=>`
        <div class="fav-list-row">
          <label><input type="checkbox" data-cart-save-list-id="${l.id}"> <span class="fav-list-name">${escapeHtml(l.name)}</span> <span class="fav-list-count">（${l.entityIds.length}件）</span></label>
        </div>
      `).join('') : '<div class="alias-list-empty">まだリストがありません。下から新しく作成できます。</div>'}
    </div>
    <div class="field">
      <label>新しいリストを作る</label>
      <div class="geo-row"><input type="text" id="cart-new-list-name" placeholder="お気に入り${favoriteLists.length+1}"><button type="button" class="geo-search-btn" id="cart-new-list-create">作成して保存</button></div>
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" id="cart-save-back">戻る</button>
      <button class="modal-submit" id="cart-save-apply" ${favoriteLists.length?'':'disabled'}>選んだリストに追加</button>
    </div>`;
  overlay.classList.add('open');
  document.getElementById('cart-save-back').addEventListener('click', ()=>openRouteCartModal());
  document.getElementById('cart-save-apply')?.addEventListener('click', async ()=>{
    const checked = Array.from(modalBody.querySelectorAll('#cartSaveListCheckList input[type=checkbox]:checked')).map(cb=>cb.dataset.cartSaveListId);
    if(checked.length===0){ showToast('追加先のリストにチェックを入れてください。'); return; }
    for(const listId of checked){
      const list = favoriteLists.find(l=>l.id===listId);
      if(!list) continue;
      const before = list.entityIds.length;
      list.entityIds = Array.from(new Set([...list.entityIds, ...routeCart]));
      if(list.entityIds.length !== before) await rpcArrPatch(favoritesKey(), list.id, {entityIds: list.entityIds});
    }
    renderIndex();
    showToast('ルートかごの地点をリストに追加しました。');
    closeModal();
  });
  document.getElementById('cart-new-list-create').addEventListener('click', async ()=>{
    const rawName = document.getElementById('cart-new-list-name').value.trim();
    const name = rawName || defaultFavoriteListName();
    const newList = {id:'list-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), name, entityIds: routeCart.slice()};
    const isFirstEverList = favoriteLists.length === 0;
    favoriteLists.push(newList);
    if(isFirstEverList) await safeSet(favoritesKey(), favoriteLists);
    else await rpcArrAppend(favoritesKey(), newList);
    renderIndex();
    showToast(`新しいリスト「${newList.name}」に保存しました。`);
    closeModal();
  });
}

// このズーム以上で「クラスタが完全に解除され、どのピンも個別に表示される」
const DECLUSTER_ZOOM = 17;
// 地名ラベルを常時表示する閾値。中心ロンドンはピンが密集しすぎていて、
// 個別表示になった直後（DECLUSTER_ZOOMと同じ値）だとまだ名前同士が
// 重なって読めないため、あえて別の値にして、もう少し寄ってから名前が
// 出るようにしている（historic地図のmaxZoomが18までなので、それでも
// 名前が見られるよう18に設定。値は目安なので、実際の見え方次第で調整可）。
const LABEL_VISIBLE_ZOOM = 18;
// 検索や索引で選んだ項目のID。地図上でその項目のピンが今どのクラスタの中に
// 隠れているかをハイライトするために使う（選択が無ければnull）。
let selectedEntityId = null;
const markerClusterGroup = L.markerClusterGroup({
  // ズームレベルに応じて合体しやすさを変える。国・都市全体を見るような広い
  // ズームでは今まで通りまとめて見やすくし、通り・街区レベルまで寄ったら
  // 「ほぼ完全に重なっているピンだけ」合体するようにして、隣接した別の地点が
  // 不必要に「2件」とまとめられてしまうのを防ぐ（数値は目安。実際の地図で見て
  // 違和感があれば調整してください）。
  maxClusterRadius: function(zoom){
    if(zoom >= 15) return 16;
    if(zoom >= 12) return 30;
    return 45;
  },
  disableClusteringAtZoom: DECLUSTER_ZOOM,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  // 項目数が増えてきた場合に備え、大量のピンを一括追加する際は内部で
  // 処理を細切れ（デフォルトでは200msごとに区切って50ms休む）にして、
  // 地図の操作がその間フリーズしないようにする。
  chunkedLoading: true,
  iconCreateFunction: function(cluster){
    const children = cluster.getAllChildMarkers();
    const count = children.length;
    // 221Bベーカー街が含まれているクラスタは、代表名として必ずそちらを優先する
    // （先頭マーカー任せだと221Bが埋もれて見えなくなってしまうため）
    const flagship = children.find(c=>c.entityId==='baker-street');
    const firstName = (flagship || children[0])?.entityName || '';
    const labelText = count > 1 ? `${firstName} 他${count-1}件` : firstName;
    const hasSelected = !!selectedEntityId && children.some(c=>c.entityId===selectedEntityId);
    if(!cluster._holmesWired){
      cluster.bindTooltip(labelText, {direction:'right', offset:[19,0], permanent:true, className:'place-label'});
      cluster.on('mouseover', ()=>{ cluster.getTooltip()?.getElement()?.classList.add('force-show'); });
      cluster.on('mouseout', ()=>{ cluster.getTooltip()?.getElement()?.classList.remove('force-show'); });
      cluster._holmesWired = true;
    } else {
      cluster.setTooltipContent(labelText);
    }
    return L.divIcon({
      html: `<div class="cluster-icon-inner">${count}</div>`,
      className: 'holmes-cluster-icon' + (hasSelected ? ' has-selected' : ''),
      iconSize: L.point(34, 34)
    });
  }
}).addTo(map);

// 221Bボタン・検索結果の選択・訪問記録タップなど「その場所へ一気に飛ぶ」
// flyToNav()/flyToBoundsNav()（実体はmap.flyTo()/flyToBounds()）の後、Leaflet.markercluster側のクラスタ分割が
// 追いつかず、着地後も古いクラスタ（本来ズームインして個別ピンに分かれるべき
// もの）がそのまま残ってしまうことがある（flyToのような大きなジャンプを伴う
// アニメーションでは、プラグイン内部のズーム追従処理が正しく反映されない既知の
// 挙動）。ユーザーが手でパン・ピンチズームする分にはこの問題は起きないので、
// 毎回のmoveendで作り直す（重い）のではなく、flyTo/flyToBoundsによる移動の

function labelDirectionFor(id){
  const dirs = [
    {direction:'right', offset:[10,0]},
    {direction:'left', offset:[-10,0]},
    {direction:'top', offset:[0,-12]},
    {direction:'bottom', offset:[0,12]}
  ];
  let hash = 0;
  for(let i=0;i<id.length;i++){ hash = (hash*31 + id.charCodeAt(i)) >>> 0; }
  return dirs[hash % dirs.length];
}
// リンク構文 [[id|表示名]] が混ざった説明文から、ピンのプレビューカード用に
// 短いプレーンテキストの抜粋を作る（表示名だけ残し、角括弧やIDは見せない）。
function stripLinkSyntaxForSnippet(desc){
  const regex = /[\[［]{2}([^\]］|｜]+?)(?:[|｜]([^\]］]+?))?[\]］]{2}/g;
  return (desc||'').replace(regex, (full, token, display) => (display ? display : token).trim());
}
function pinPopupSnippet(desc, maxLen){
  const plain = stripLinkSyntaxForSnippet(desc).replace(/\s+/g, ' ').trim();
  return plain.length > maxLen ? plain.slice(0, maxLen) + '…' : plain;
}
// 地名ピンをタップした時に出す小さいプレビューカード。カード自体をタップすると
// 詳細ページ（showEntity）に遷移する（クリック処理はopenPlacePreviewPopup側で、
// ポップアップのDOMに直接リスナーを付ける形で行っている）。
function renderPinPreviewPopupHtml(e, id){
  const imgUrl = (e.photos && e.photos.length && e.photos[0].url) ? e.photos[0].url : e.image;
  const snippet = pinPopupSnippet(e.desc, 46);
  const isFav = favoriteListsContaining(id).length > 0;
  const inCart = isInRouteCart(id);
  return `<div class="pin-preview-card" data-popup-open="${id}">
    ${imgUrl ? `<img class="pin-preview-img" src="${escapeAttr(imgUrl)}" alt="" loading="lazy">` : ''}
    <div class="pin-preview-body">
      <div class="pin-preview-name">${escapeHtml(e.name)}</div>
      ${snippet ? `<div class="pin-preview-desc">${escapeHtml(snippet)}</div>` : ''}
      <div class="pin-preview-footer">
        <span class="pin-preview-more">詳細を見る ›</span>
        <div class="pin-preview-actions">
          <button type="button" class="pin-preview-route-btn${inCart?' active':''}" data-route-cart-id="${id}" title="${inCart?'ルートかごから外す':'ルートに追加'}" aria-label="${inCart?'ルートかごから外す':'ルートに追加'}">${inCart?'✓':'🧭'}</button>
          <button type="button" class="pin-preview-fav-btn${isFav?' active':''}" data-fav-toggle="${id}" title="お気に入りに追加" aria-label="お気に入りに追加">${isFav?'★':'☆'}</button>
        </div>
      </div>
    </div>
  </div>`;
}
function openPlacePreviewPopup(id){
  const e = DATA[id];
  if(!e || !e.coords) return;
  map.closePopup();
  const popup = L.popup({closeButton:true, className:'pin-preview-popup', offset:[0,-6], autoPanPadding:[20,20]})
    .setLatLng(e.coords)
    .setContent(renderPinPreviewPopupHtml(e, id))
    .openOn(map);
  // LeafletのポップアップはdisableClickPropagationでクリックの伝播をポップアップ自身の
  // 要素で止めているため、documentへのイベント委譲では拾えない。ポップアップのDOMに
  // 直接リスナーを付ける。
  const popupEl = popup.getElement();
  popupEl?.querySelector('[data-popup-open]')?.addEventListener('click', ()=>{
    map.closePopup();
    showEntity(id);
  });
  // 🧭ルートかごボタンはカード全体のクリック（詳細ページへ遷移）に巻き込まれないよう
  // stopPropagationする。お気に入りと違いログイン不要・確認モーダルも挟まない単純な
  // ON/OFFトグルなので、toggleRouteCartを直接呼ぶだけでよい（見た目の更新は
  // toggleRouteCart内のrefreshRouteCartUiForがこのボタン自身を見つけて行う）。
  popupEl?.querySelector('[data-route-cart-id]')?.addEventListener('click', (ev)=>{
    ev.stopPropagation();
    toggleRouteCart(id);
  });
  // ☆お気に入りボタンはカード全体のクリック（詳細ページへ遷移）に巻き込まれない
  // よう、必ずstopPropagationする。既存の「詳細ページ内の☆お気に入りボタン」
  // （favToggleBtn）と同じ、リスト選択モーダルを開く方式に揃えている（お気に入りは
  // 複数リストに分かれているため、ここで単純なON/OFFトグルにはできないため）。
  popupEl?.querySelector('[data-fav-toggle]')?.addEventListener('click', (ev)=>{
    ev.stopPropagation();
    if(!currentUser){ showToast('お気に入り登録にはログインが必要です。'); return; }
    openFavoriteListsModal(id);
  });
}
function renderMarkers(){
  markerClusterGroup.clearLayers();
  Object.values(markers).forEach(m=>{ if(map.hasLayer(m)) map.removeLayer(m); });
  markers = {};
  // addLayer()を1件ずつ呼ぶと、追加のたびにクラスタツリーを再計算するため
  // 項目数が増えるほど遅くなる（Leaflet.markercluster公式が個別addLayerの
  // ループを避けるよう案内している）。いったんこの配列にまとめておき、
  // 最後にaddLayers()を1回だけ呼んで一括でクラスタを組み直す。
  const newLayers = [];
  Object.keys(DATA).forEach(id=>{
    const e = DATA[id];
    if(e.type==='place' && e.coords){
      if(coreOnlyFilter && e.relevance!=='core') return;
      if(workFilter && !(e.related||[]).includes(workFilter)) return;
      if(favListFilter){
        const list = favoriteLists.find(l=>l.id===favListFilter);
        if(!list || !list.entityIds.includes(id)) return;
      }
      const isSpecial = id === 'baker-street';
      const icon = isSpecial ? makeSpecialIcon() : (e.relevance==='peripheral' ? makePeripheralIcon() : (e.relevance==='misc' ? makeMiscIcon() : makeIcon()));
      const m = L.marker(e.coords,{icon, zIndexOffset: isSpecial ? 2000 : 0});
      m.entityName = e.name;
      m.entityId = id;
      m.on('click', ()=>{ if(mapPickModeActive) return; openPlacePreviewPopup(id); });
      if(isSpecial){
        m.bindTooltip(e.name,{direction:'right',offset:[12,0],permanent:true,className:'place-label-special'});
        m.on('mouseover', ()=>{ m.getTooltip()?.getElement()?.classList.add('force-show'); });
        m.on('mouseout', ()=>{ m.getTooltip()?.getElement()?.classList.remove('force-show'); });
      } else if(isInUK(e.coords)){
        const ld = labelDirectionFor(id);
        m.bindTooltip(e.name,{direction:ld.direction,offset:ld.offset,permanent:true,className: e.relevance==='peripheral' ? 'place-label place-label-peripheral' : (e.relevance==='misc' ? 'place-label place-label-misc' : 'place-label')});
        m.on('mouseover', ()=>{ m.getTooltip()?.getElement()?.classList.add('force-show'); });
        m.on('mouseout', ()=>{ m.getTooltip()?.getElement()?.classList.remove('force-show'); });
      }
      else m.bindTooltip(e.name,{direction:'top',offset:[0,-10]});
      markers[id]=m;
      // 221Bも他の地点と同じくクラスタに参加させる。広いズームでは他の地点と
      // 合体して「◯件」の数字に含まれ、ズームインしてクラスタが自然に分かれた
      // 瞬間だけ、上で設定した特別な見た目（大きいアイコン・常時ラベル）で
      // 単独表示になる（合体中は下のiconCreateFunctionで名前を優先表示する）。
      newLayers.push(m);
    }
  });
  markerClusterGroup.addLayers(newLayers);
}

// 訪問記録（journal）は全会員が投稿できるサイト全体の公開データで、件数の
// 上限は設けていない（投稿頻度のレート制限のみ）ため、地点ピンと同じく
// 件数が増えるほど地図が重く・見づらくなる可能性がある。地点ピン側は既に
// markerClusterGroupでクラスタ化してこの問題を回避しているので、訪問記録
// マーカーも同じ仕組みに乗せる（専用のクラスタグループを分け、色・見た目は
// 地点クラスタと区別できるようにしてある＝CSSの.holmes-journal-cluster-icon）。
const journalMarkerClusterGroup = L.markerClusterGroup({
  maxClusterRadius: function(zoom){
    if(zoom >= 15) return 16;
    if(zoom >= 12) return 30;
    return 45;
  },
  disableClusteringAtZoom: DECLUSTER_ZOOM,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  chunkedLoading: true,
  iconCreateFunction: function(cluster){
    const count = cluster.getAllChildMarkers().length;
    return L.divIcon({
      html: `<div class="cluster-icon-inner">${count}</div>`,
      className: 'holmes-cluster-icon holmes-journal-cluster-icon',
      iconSize: L.point(30, 30)
    });
  }
}).addTo(map);
let journalMarkers = [];
// 訪問記録ピンの表示・非表示（表示絞り込みメニュー内のチェックで切り替え）。
// クラスタ化は「多すぎて重い・見づらい」への対処だが、こちらは「今は地点そのもの
// に集中したいので訪問記録ピンごと視界から消したい」という別のニーズへの対処。
// レイヤーグループ自体をmapに付け外しするだけなので、journal配列やrenderJournalMarkers()
// 側のデータには一切手を入れない（再表示時にrenderJournalMarkers()を呼び直す必要もない）。
let journalMarkersVisible = true;
function setJournalMarkersVisible(visible){
  journalMarkersVisible = visible;
  if(visible){
    if(!map.hasLayer(journalMarkerClusterGroup)) map.addLayer(journalMarkerClusterGroup);
  } else {
    if(map.hasLayer(journalMarkerClusterGroup)) map.removeLayer(journalMarkerClusterGroup);
  }
}
function renderJournalMarkers(){
  journalMarkerClusterGroup.clearLayers();
  journalMarkers = [];
  // renderMarkers()と同じ理由で、1件ずつaddLayerせず配列にまとめてから
  // addLayers()を1回だけ呼ぶ。訪問記録は件数の上限を設けていないため、
  // 将来的にまとまった件数になったときの体感速度への影響が大きい。
  journal.forEach(j=>{
    if(!j.coords) return;
    const m = L.marker(j.coords, {icon: makeJournalIcon()});
    m.on('click', ()=>{ if(mapPickModeActive) return; openJournalDetail(j.id); });
    m.bindTooltip(escapeHtml(j.placeName), {direction:'top', offset:[0,-8]});

  });
  journalMarkerClusterGroup.addLayers(journalMarkers);

// ---------- 索引 ----------
// ★掲載には先方の許可を取ってから載せたいので、一旦0件にしてある。
// 許可が取れたサイトから、下の配列に {name, url, desc} の形で追加していく。
const EXTERNAL_LINKS = [
];

let indexOpenGroups = new Set();
// 索引の項目数が増えてスクロールが大変にならないよう、索引だけで使える
// 絞り込みテキストボックス。既存の検索（fuzzyMatch）と同じロジックで、
// 一致した項目だけが残る（該当ゼロのジャンルはグループごと非表示）。
let indexFilterQuery = '';
function renderIndex(){
  const indexEl = document.getElementById('index');
  const scrollEl = document.getElementById('indexScroll');
  const q = indexFilterQuery.trim();
  const groups = {place:[],person:[],work:[],'work-pastiche':[],term:[]};
  Object.keys(DATA).forEach(id=>{
    const e = DATA[id];
    if(q && !fuzzyMatch(e.name, q)) return;
    if(e.type==='work'){
      (e.canon ? groups.work : groups['work-pastiche']).push(id);
    } else if(e.type==='place'){
      const passCore = !coreOnlyFilter || e.relevance==='core';
      const passWork = !workFilter || (e.related||[]).includes(workFilter);
      // ★お気に入りリストでの地図の絞り込み（favListFilter）は索引には連動させない
      // （地図だけ絞り込んで、索引はそのまま全件見えている状態を保つ）
      if(passCore && passWork) groups.place.push(id);
    } else {
      groups[e.type].push(id);
    }
  });
  Object.values(groups).forEach(arr=>arr.sort((a,b)=>DATA[a].name.localeCompare(DATA[b].name,'ja')));
  const sectionLabels = {place:'地名', person:'人物', work:'作品（正典）', 'work-pastiche':'作品（正典外）', term:'用語', links:'関連サイト'};
  let html='';
  const totalMatches = Object.values(groups).reduce((a,arr)=>a+arr.length, 0);
  if(q && totalMatches===0){
    html += `<div class="index-filter-empty">「${escapeHtml(q)}」に一致する項目が見つかりませんでした。</div>`;
  }

  // お気に入り（リスト＝フォルダ別。絞り込み中は該当する項目だけに絞られる）
  // ジャンル別ではなく、ユーザーが作った各お気に入りリストをそのまま「フォルダ」として
  // 見出しにする。同じ項目が複数のリストに入っていれば、その分だけ複数のフォルダの下に
  // 重複して現れる（チェックボックスで複数リストに追加できる仕様に対応するため）。
  const favMatchedIds = new Set();
  ['place','person','work','work-pastiche','term'].forEach(t=>{
    groups[t].forEach(id=>{ if(isInAnyFavoriteList(id)) favMatchedIds.add(id); });
  });
  const favTotal = favMatchedIds.size;
  // 絞り込み中は、結果が見えるようそのジャンルを強制的に開いた状態で表示する
  const favOpen = q ? favTotal>0 : indexOpenGroups.has('favorites');
  if(!q || favTotal>0){
    html += `<div class="index-group">
      <button class="index-group-header" data-group="favorites"><span class="igh-arrow">${favOpen?'▾':'▸'}</span>★ お気に入り<span class="igh-count">${favTotal}</span></button>
      <div class="index-group-items" style="display:${favOpen?'block':'none'}">`;
    if(favTotal===0){
      html += `<div class="alias-list-empty">まだありません。項目を開いて☆お気に入りボタンで登録できます。</div>`;
    } else {
      let anyListShown = false;
      favoriteLists.forEach(list=>{
        const items = list.entityIds.filter(id=>favMatchedIds.has(id)).sort((a,b)=>DATA[a].name.localeCompare(DATA[b].name,'ja'));
        if(items.length===0) return;
        anyListShown = true;
        html += `<div class="fav-subheader-row">
          <span class="fav-subheader"><span class="fav-index-name" data-fav-index-name="${list.id}">${escapeHtml(list.name)}</span><span class="fav-list-count">（${items.length}）</span></span>
          <span class="fav-subheader-actions">
            <button type="button" class="fav-list-route-btn" data-route-list-index="${list.id}" title="このリストの地点をGoogleマップでルート表示（リストの並び順に基づきます）" aria-label="このリストの地点をGoogleマップでルート表示（リストの並び順に基づきます）">🧭</button>
            <button type="button" class="fav-list-rename-btn" data-fav-rename-index="${list.id}" title="リスト名を変更" aria-label="リスト名を変更">✏️</button>
          </span>
        </div>`;
        items.forEach(id=>{ html += `<button class="index-item" data-id="${id}">${escapeHtml(DATA[id].name)}</button>`; });
      });
      // リストに紐づかないのに favMatchedIds に入ることは通常起きないが、
      // データ不整合などの保険として、どのフォルダにも表示されなかった項目があれば
      // 最後に「その他」としてまとめて出す
      const shown = new Set(favoriteLists.flatMap(l=>l.entityIds));
      const leftover = Array.from(favMatchedIds).filter(id=>!shown.has(id)).sort((a,b)=>DATA[a].name.localeCompare(DATA[b].name,'ja'));
      if(leftover.length){
        html += `<div class="fav-subheader-row"><span class="fav-subheader">その他</span></div>`;
        leftover.forEach(id=>{ html += `<button class="index-item" data-id="${id}">${escapeHtml(DATA[id].name)}</button>`; });
        anyListShown = true;
      }
      if(!anyListShown){
        html += `<div class="alias-list-empty">まだありません。項目を開いて☆お気に入りボタンで登録できます。</div>`;
      }
    }
    html += `</div></div>`;
  }

  ['place','person','work','work-pastiche','term'].forEach(t=>{
    if(groups[t].length===0) return;
    const open = q ? true : indexOpenGroups.has(t);
    html += `<div class="index-group">
      <button class="index-group-header" data-group="${t}"><span class="igh-arrow">${open?'▾':'▸'}</span>${sectionLabels[t]}<span class="igh-count">${groups[t].length}</span></button>
      <div class="index-group-items" style="display:${open?'block':'none'}">`;

  // 関連サイト（絞り込みの対象外。件数が少なく、常に見えていて困らないため）
  // ★掲載サイトが0件の間も見出し自体は残す（許可取得中であることが分かるように）。
  // 開いた時に中身が空っぽに見えて紛らわしくならないよう、0件の間だけ案内文を出す。

  html += `<div class="index-group">

  html += `</div></div>`;

  // 地名の言い換え辞書
  const aliasKeys = Object.keys(customAliases);
  const aliasOpen = indexOpenGroups.has('aliases');
  html += `<div class="index-group">
    <button class="index-group-header" data-group="aliases"><span class="igh-arrow">${aliasOpen?'▾':'▸'}</span>地名の言い換え辞書<span class="igh-count">${aliasKeys.length}</span></button>

      <button class="alias-add-standalone-btn" id="aliasAddStandaloneBtn">＋ 対応を追加</button>`;

    html += `<div class="alias-list-empty">まだありません。</div>`;

  html += `</div></div>`;

  html += `<div class="site-license">本サイトの説明文は <a href="https://creativecommons.org/licenses/by/4.0/deed.ja" target="_blank" rel="noopener noreferrer">CC BY 4.0</a> で公開しています（出典を明記すれば自由にご利用いただけます）。画像は個別に出典・ライセンスを表示しています。</div>`;
  html += `<div class="site-license">運営者のX（旧Twitter）: <a href="https://x.com/221bkcolrehs" target="_blank" rel="noopener noreferrer">@221bkcolrehs</a></div>`;
  html += `<div class="site-license"><button class="link-btn" id="openLegalBtn">利用規約・プライバシーポリシー</button>（本サイトは個人が趣味で開発・運営しています）</div>`;
  scrollEl.innerHTML = html;
  document.getElementById('openLegalBtn')?.addEventListener('click', openLegalModal);
  scrollEl.querySelectorAll('.index-item[data-id]').forEach(btn=>btn.addEventListener('click', ()=>{ showEntity(btn.dataset.id); indexEl.classList.remove('open'); }));
  document.getElementById('aliasAddStandaloneBtn')?.addEventListener('click', (ev)=>{
    ev.stopPropagation();
    if(!currentUser){ showToast('辞書の登録にはログインが必要です。'); return; }

// ---------- 個別項目のディープリンク（?id=...） ----------
// 各項目に固有のURLを持たせ、共有・再訪問・ブラウザの戻る/進むに対応する。
function urlForEntity(id){
  const url = new URL(location.href);
  url.search = '?id=' + encodeURIComponent(id);
  url.hash = '';
  return url.pathname + url.search;
}
// 共有・コピー用には、他の端末やアプリでもそのまま開ける絶対URLが要るので、
// urlForEntity（pathname+searchだけ）とは別に、オリジンまで含めた形で返す。
function absoluteUrlForEntity(id){
  const url = new URL(location.href);
  url.search = '?id=' + encodeURIComponent(id);
  url.hash = '';
  return url.href;
}
function setUrlForEntity(id){
  const target = urlForEntity(id);
  if(location.pathname + location.search === target) return; // 既に同じURLなら履歴を汚さない
  history.pushState({entityId:id}, '', target);
}
function clearEntityUrl(){
  const target = location.pathname;
  if(location.pathname + location.search === target) return;
  history.pushState({}, '', target);
}

// ---------- 訪問記録単体のディープリンク（?journal=...） ----------
// 個々の訪問記録・感想コメントも、項目と同じ仕組みでURLを持たせて共有できるようにする。
function urlForJournal(id){
  const url = new URL(location.href);
  url.search = '?journal=' + encodeURIComponent(id);
  url.hash = '';
  return url.pathname + url.search;
}
function absoluteUrlForJournal(id){
  const url = new URL(location.href);
  url.search = '?journal=' + encodeURIComponent(id);
  url.hash = '';
  return url.href;
}
function setUrlForJournal(id){
  const target = urlForJournal(id);
  if(location.pathname + location.search === target) return;
  history.pushState({journalId:id}, '', target);
}
function clearJournalUrl(){
  // journal= 以外のパラメータ（?id=など）が付いていた場合に巻き込んで消してしまわないよう、
  // journalキーだけを取り除く（付いていなければ何もしない）。
  const params = new URLSearchParams(location.search);
  if(!params.has('journal')) return;
  params.delete('journal');
  const search = params.toString();
  const target = location.pathname + (search ? '?' + search : '');
  if(location.pathname + location.search === target) return;
  history.pushState({}, '', target);
}

function renderPhoto(photo, entityId){
  if(!photo || !photo.url) return '';
  const creditBits = [];
  if(photo.credit) creditBits.push(escapeHtml(photo.credit));
  if(photo.license) creditBits.push(escapeHtml(photo.license));
  let creditLine = creditBits.join(' ／ ');
  if(photo.sourceUrl) creditLine += (creditLine?' ':'') + `<a href="${escapeAttr(photo.sourceUrl)}" target="_blank" rel="noopener noreferrer">出典</a>`;
  const label = photo.year || '';
  const delBtn = (photo.id && isReviewer()) ? `<button class="photo-del-btn" data-del-photo="${photo.id}" data-photo-entity="${entityId}" title="この写真を削除">×</button>` : '';
  return `<div class="photo-block">
    ${delBtn}
    ${label ? `<div class="photo-label">${escapeHtml(label)}</div>` : ''}
    <img src="${escapeAttr(photo.url)}" alt="${escapeAttr(photo.caption||label||'')}" loading="lazy">
    ${creditLine ? `<div class="photo-credit">${creditLine}</div>` : ''}

window.addEventListener('popstate', ()=>{
  const id = new URLSearchParams(location.search).get('id');
  const journalId = new URLSearchParams(location.search).get('journal');
  // 訪問記録モーダルの開閉を先に処理してから項目パネルを処理する。
  // （closeModal()がタイトルを一旦既定値に戻すため、この順序でないと
  //   entity側で設定したタイトルが後から上書きされて消えてしまう）
  if(journalId && journal.find(x=>x.id===journalId)){
    openJournalDetail(journalId, {skipUrlUpdate:true});
  } else if(journalUrlActive){

  }

  } else if(panel.classList.contains('open')){
    closePanel();

});

function flyToAvoidingPanel(latlng, zoom){
  const panelWidth = panel.offsetWidth;
  const targetPoint = map.project(latlng, zoom);
  const shiftedPoint = targetPoint.add(L.point(panelWidth/2, 0));
  const shiftedLatLng = map.unproject(shiftedPoint, zoom);
  flyToNav(shiftedLatLng, zoom, {duration:0.7});
}
function goToMap(id){
  const e = DATA[id];
  if(!e || !e.coords) return;
  setUrlForEntity(id);
  panel.classList.remove('open');
  document.getElementById('timeline').classList.remove('open');
  document.getElementById('myBook').classList.remove('open');
  selectedEntityId = id;
  refreshSelectedClusterHighlight();
  // クラスタの展開任せ（zoomToShowLayer）だと、展開後の中心がずれて地点が
  // 画面の隅に寄ってしまうことがあったため、常にその地点の座標そのものへ
  // まっすぐ移動させる。ズーム値は「その地点が個別ピンとして見えるはずの
  // 値」（zoomForEntity）を使うので、クラスタも自然に解除される。
  map.closePopup();
  flyToNav(e.coords, zoomForEntity(id), {duration:0.7});
  L.popup({closeButton:true, className:'map-jump-name-popup', offset:[0,-6]})
    .setLatLng(e.coords)
    .setContent(escapeHtml(e.name))
    .openOn(map);
}

// オーバーレイの外側タップ・そのモーダル自身の「キャンセル」がその関数を
// 呼ぶようになる（呼んだら必ずnullに戻す一度きりの予約）。closeModal()自体も
// 必ずクリアするので、他のモーダルへ意図せず引き継がれることはない。

  if(modalBackAction){ const fn = modalBackAction; modalBackAction = null; fn(); }
  else { closeModal(); }

function closeModal(){

// ---------- モーダルのキーボード操作・フォーカス管理 ----------
// openXXXModal系の関数はどれも「modalBody.innerHTMLを差し替えてから
// overlay.classList.add('open')する」という共通パターンなので、個々の関数を
// 直さなくても、overlayのclass変化をMutationObserverで監視するだけで
// 全モーダル共通のフォーカス管理を後付けできる。
const modalShellEl = document.getElementById('modalShell');
let lastFocusedBeforeModal = null;
function getModalFocusableEls(){
  return Array.from(modalShellEl.querySelectorAll(
    'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
  )).filter(el => !el.disabled && el.offsetParent !== null);
}
new MutationObserver(()=>{
  const isOpen = overlay.classList.contains('open');
  if(isOpen){
    // すでにモーダル内にフォーカスがある(＝連続してモーダルを開き直した)場合は
    // 直前のフォーカス先を上書きしない。
    if(!modalShellEl.contains(document.activeElement)){
      lastFocusedBeforeModal = document.activeElement;
    }
    modalBody.focus({preventScroll:true});
  } else if(lastFocusedBeforeModal && document.body.contains(lastFocusedBeforeModal)){
    lastFocusedBeforeModal.focus({preventScroll:true});
    lastFocusedBeforeModal = null;
  }
}).observe(overlay, {attributes:true, attributeFilter:['class']});
document.addEventListener('keydown', (ev)=>{
  if(!overlay.classList.contains('open')) return;
  if(ev.key === 'Escape'){
    modalGoBack();
    return;
  }
  if(ev.key === 'Tab'){
    // モーダルの外にTabで抜けられないよう、モーダル内の先頭⇔末尾で折り返す
    const focusable = getModalFocusableEls();
    if(!focusable.length) return;
    const first = focusable[0], last = focusable[focusable.length-1];
    if(ev.shiftKey && document.activeElement === first){
      ev.preventDefault(); last.focus();
    } else if(!ev.shiftKey && document.activeElement === last){
      ev.preventDefault(); first.focus();
    }
  }
});

function relatedChecklist(excludeId, preselected=[]){
  const ids = Object.keys(DATA).filter(id=>id!==excludeId).sort((a,b)=>DATA[a].name.localeCompare(DATA[b].name,'ja'));
  return ids.map(id=>`<label><input type="checkbox" value="${id}" ${preselected.includes(id)?'checked':''}> <span class="dot dot-${entityClass(DATA[id])}"></span>${escapeHtml(DATA[id].name)}</label>`).join('');

// eを渡すと編集モーダル用（既存値をプリフィルし、差し替え時の注意文を追加する）、
// nullなら新規追加モーダル用（すべて空欄）になる。
function renderImageField(e){
  const urlVal = e && e.image && !e.image.startsWith('data:') ? escapeAttr(e.image) : '';
  const previewHtml = e && e.image ? `<img src="${escapeAttr(e.image)}" alt="">` : '';
  const replaceHint = e ? '画像を差し替えるときは、クレジットも合わせて更新してください。' : '';
  return `<div class="field"><label>画像（任意）</label>
      <input type="file" class="file-input" id="f-image-file" accept="image/*">
      <input type="text" id="f-image" value="${urlVal}" placeholder="https://..." style="margin-top:6px;">
      <div class="image-preview" id="f-image-preview">${previewHtml}</div>
      <div class="hint">Wikimedia Commonsなどの画像を使う場合は、作者・ライセンス・出典URLもあわせて入力しておくと安心です。${replaceHint}</div>
      <input type="text" id="f-image-credit" value="${e && e.imageCredit ? escapeAttr(e.imageCredit) : ''}" placeholder="作者・提供元（任意）" style="margin-top:6px;">
      <input type="text" id="f-image-license" value="${e && e.imageLicense ? escapeAttr(e.imageLicense) : ''}" placeholder="ライセンス（任意）例：CC BY-SA 4.0" style="margin-top:6px;">
      <input type="text" id="f-image-source" value="${e && e.imageSourceUrl ? escapeAttr(e.imageSourceUrl) : ''}" placeholder="出典URL（任意）" style="margin-top:6px;">
    </div>`;
}

// 新規追加・編集モーダルで共通の「場所を検索」ボタンの挙動。
// requireQueryをtrueにすると、未入力での検索時にトースト表示する（新規追加モーダル用）。
function wireGeoSearchButton(requireQuery){
  const btn = document.getElementById('f-geo-search');
  if(!btn) return;
  btn.addEventListener('click', async ()=>{
    const q = document.getElementById('f-geo-query').value.trim();
    if(!q){ if(requireQuery) showToast('地名を入力してください。'); return; }
    const rEl = document.getElementById('f-geo-results');
    rEl.innerHTML = '<div class="hint">検索中…</div>';
    const results = await geocodeSearch(q);
    if(!results || results.length===0){ rEl.innerHTML='<div class="hint">見つかりませんでした。</div>'; return; }
    rEl.innerHTML = results.map(r=>`<button type="button" class="geo-result-item" data-lat="${r.lat}" data-lon="${r.lon}">${escapeHtml(r.display_name)}</button>`).join('');
    rEl.querySelectorAll('.geo-result-item').forEach(resultBtn=>{
      resultBtn.addEventListener('click', ()=>{
        rEl.querySelectorAll('.geo-result-item').forEach(b=>b.classList.remove('selected'));
        resultBtn.classList.add('selected');
        document.getElementById('f-lat').value = parseFloat(resultBtn.dataset.lat).toFixed(4);
        document.getElementById('f-lng').value = parseFloat(resultBtn.dataset.lon).toFixed(4);
      });
    });
  });
}
// モーダルを一時的に隠して地図を露出させ、次に地図をクリックした地点の緯度経度をonPickへ渡す。
// モーダルのDOM（modalBody.innerHTML）自体はそのまま保持するので、入力途中の内容は消えない。
function pickLocationOnMap(onPick){
  overlay.classList.add('picking');
  document.body.classList.add('map-picking');
  mapPickModeActive = true;
  const banner = document.createElement('div');
  banner.className = 'map-pick-banner';
  banner.innerHTML = `<span>地図をクリックして地点を指定してください</span><button type="button" id="mapPickCancelBtn">キャンセル</button>`;
  document.body.appendChild(banner);
  function cleanup(){
    mapPickModeActive = false;
    activeMapPickCleanup = null;
    overlay.classList.remove('picking');
    document.body.classList.remove('map-picking');
    banner.remove();
    map.off('click', onMapClick);
  }
  function onMapClick(ev){
    cleanup();
    onPick(ev.latlng);
  }
  map.on('click', onMapClick);
  document.getElementById('mapPickCancelBtn').addEventListener('click', cleanup);
  activeMapPickCleanup = cleanup;
}
// 新規追加・編集モーダルで共通の「地図で指定する」ボタンの挙動。
function wireMapPickButton(){
  const btn = document.getElementById('f-geo-map-pick');
  if(!btn) return;
  btn.addEventListener('click', ()=>{
    pickLocationOnMap(latlng=>{
      document.getElementById('f-lat').value = latlng.lat.toFixed(4);
      document.getElementById('f-lng').value = latlng.lng.toFixed(4);
      showToast('地図上の地点を設定しました。');
    });
  });
}

  typeSelect.addEventListener('change', sync);

  // ★編集画面（openEditModal）と同様、「復元する／破棄する」のバナーは廃止し、
  // 一時保存の内容があればバナーなしでそのままフォームに反映する形に単純化した。
  const newEntityDraft = loadDraft('newEntity', 'new');
  if(newEntityDraft){

    sync();
  }
  wireDraftAutosave('newEntity', 'new', newEntityDraftFields);

  });
  document.getElementById('f-submit').addEventListener('click', async ()=>{
    if(!currentUser){ showToast('投稿にはログインが必要です。'); return; }
